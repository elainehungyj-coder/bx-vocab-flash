  { id: 'vocab_N778', word: 'survival', phonetic: '/səˈvaɪv(ə)l/', meaning: 'n. 生存', sentence: 'The survival of the manufacturing business depends on its ability to adapt to changing market conditions.', notes: '制造业务的生存取决于其适应不断变化的市场条件的能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N779', word: 'surroundings', phonetic: '/səˈraʊndɪŋz/', meaning: 'n. 周围环境', sentence: 'The surroundings of the factory need to be maintained to ensure a pleasant working environment.', notes: '工厂周围的环境需要维护，以确保愉快的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N780', word: 'surface', phonetic: '/ˈsɜːfɪs/', meaning: 'n. 表面', sentence: 'The surface finish of the product is an important factor in its appearance and quality.', notes: '产品的表面处理是其外观和质量的重要因素。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N781', word: 'target', phonetic: '/ˈtɑːɡɪt/', meaning: 'n. 目标', sentence: 'The target market for the product is identified through market research.', notes: '通过市场研究确定产品的目标市场。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N782', word: 'union', phonetic: '/ˈjuːniən/', meaning: 'n. 工会 / 联合', sentence: 'The union representing the workers negotiates wages and working conditions with the management.', notes: '代表工人的工会与管理层谈判工资和工作条件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N783', word: 'victim', phonetic: '/ˈvɪktɪm/', meaning: 'n. 受害者', sentence: 'The victim of the workplace accident received compensation from the company.', notes: '工作场所事故的受害者从公司获得了赔偿。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N784', word: 'volunteer', phonetic: '/ˌvɒlənˈtɪə(r)/', meaning: 'n. 志愿者', sentence: 'The volunteer program at the company encourages employees to give back to the community.', notes: '公司的志愿者计划鼓励员工回馈社区。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N785', word: 'personality', phonetic: '/ˌpɜːsəˈnæləti/', meaning: 'n. 个性', sentence: 'Each member of the manufacturing team brings their own unique personality and skills to the table.', notes: '制造团队的每个成员都带来了自己独特的个性和技能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N786', word: 'secretary', phonetic: '/ˈsekrət(ə)ri/', meaning: 'n. 秘书', sentence: 'The secretary is responsible for scheduling meetings and coordinating with different departments.', notes: '秘书负责安排会议并与不同部门进行协调。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N787', word: 'seniority', phonetic: '/ˌsiːniˈɒrəti/', meaning: 'n. 资历 / 年资', sentence: 'The company values seniority and rewards employees who have been with the organization for a long time.', notes: '公司重视资历，并奖励在组织中工作时间较长的员工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N788', word: 'altitude', phonetic: '/ˈæltɪtjuːd/', meaning: 'n. 海拔高度', sentence: 'The engineers are testing the equipment at high altitudes to ensure its reliability and performance in extreme conditions.', notes: '工程师们正在高海拔地区测试设备，以确保其在极端条件下的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N789', word: 'career', phonetic: '/kə\'rɪə(r)/', meaning: 'n. 职业 / 事业', sentence: 'She is considering a career change from sales to manufacturing to pursue her passion for engineering.', notes: '她正在考虑从销售转向制造业，以追求她对工程的热情。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N790', word: 'unemployment', phonetic: '/ˌʌnɪmˈplɔɪmənt/', meaning: 'n. 失业', sentence: 'The recent economic downturn has led to a significant increase in unemployment in the manufacturing sector.', notes: '最近的经济衰退导致制造业的失业率大幅上升。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N791', word: 'indication', phonetic: '/ˌɪndɪˈkeɪʃn/', meaning: 'n. 指示 / 迹象', sentence: 'The indication of a potential problem in the production process requires immediate attention.', notes: '生产过程中潜在问题的迹象需要立即引起注意。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N792', word: 'corporation', phonetic: '/ˌkɔːpəˈreɪʃ(ə)n/', meaning: 'n. 公司', sentence: 'The large corporation has a complex supply chain that involves multiple manufacturing facilities.', notes: '这家大公司拥有一个复杂的供应链，涉及多个制造工厂。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N793', word: 'sphere', phonetic: '/sfɪə(r)/', meaning: 'n. 范围 / 领域', sentence: 'The sphere of activity of our R&D department includes not only product development but also process improvement.', notes: '我们研发部的工作范围不仅是产品开发，还包括工艺改进。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N794', word: 'bargain', phonetic: '/ˈbɑːɡən/', meaning: 'n. 协议 / 议价', sentence: 'The company was willing to accept a lower profit margin in order to secure a bargain with a major customer.', notes: '公司愿意接受较低的利润率，以与一个主要客户达成协议。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N795', word: 'wholesale', phonetic: '/ˈhəʊlseɪl/', meaning: 'n. 批发', sentence: 'The wholesale price of our products is very competitive, which helps us attract more customers.', notes: '我们产品的批发价格很有竞争力，有助于吸引更多客户。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N796', word: 'invoice', phonetic: '/ˈɪnvɔɪs/', meaning: 'n. 发票 / 账单', sentence: 'We need to carefully check the invoice to ensure the accuracy of the quantities and prices before making payment.', notes: '在付款之前，我们需要仔细检查发票以确保数量和价格的准确', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N797', word: 'expense', phonetic: '/ɪkˈspens/', meaning: 'n. 费用', sentence: 'The expense of upgrading the production facilities was significant, but it will improve efficiency in the long run.', notes: '升级生产设施的费用很高，但从长远来看会提高效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N798', word: 'circulation', phonetic: '/ˌsɜːkjəˈleɪʃ(ə)n/', meaning: 'n. 流通', sentence: 'The circulation of information within the manufacturing plant is essential for smooth operations.', notes: '制造工厂内信息的流通对于顺利运营至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N799', word: 'etiquette', phonetic: '/ˈetɪkət/', meaning: 'n. 礼仪', sentence: 'It is important to follow proper etiquette when dealing with clients and suppliers.', notes: '与客户和供应商打交道时遵循适当的礼仪非常重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N800', word: 'originality', phonetic: '/əˌrɪdʒəˈnæləti/', meaning: 'n. 创意', sentence: 'The company encourages its employees to think outside the box and bring originality to the design process.', notes: '公司鼓励员工跳出框框思考，为设计过程带来创意。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N801', word: 'rapport', phonetic: '/ræˈpɔː(r)/', meaning: 'n. 融洽 ( 关系 )', sentence: 'The team leader needs to establish a rapport with the members to ensure effective communication.', notes: '团队领导需要与成员建立融洽的关系，以确保有效的沟通。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N802', word: 'paperwork', phonetic: '/ˈpeɪpəwɜːk/', meaning: 'n. 文书工作', sentence: 'The paperwork for shipping and delivery needs to be organized properly to avoid delays.', notes: '运输和交付的文书工作需要妥善组织，以避免延误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N803', word: 'client', phonetic: '/ˈklaɪənt/', meaning: 'n. 客户', sentence: 'Meeting the delivery deadlines is important to satisfy the clients and build a long-term partnership.', notes: '满足交付期限对满足客户并建立长期合作伙伴关系很重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N804', word: 'hands-on', phonetic: '/ˌhændz ˈɒn/', meaning: 'adj. 实际操作的', sentence: 'The engineer spent hours on the shopfloor, getting handson experience with the machinery.', notes: '工程师在车间花费了数小时，获得了与机械的实践经验。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N805', word: 'commute', phonetic: '/kəˈmjuːt/', meaning: 'n. 通勤', sentence: 'The company provides transportation for its employees to reduce the burden of the commute.', notes: '公司为员工提供交通，以减轻通勤的负担。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N806', word: 'vacation', phonetic: '/veɪˈkeɪʃ(ə)n/', meaning: 'n. 假期', sentence: 'The workers are entitled to a certain number of vacation days based on their years of service.', notes: '根据服务年限，工人有权享受一定数量的假期。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N807', word: 'supervision', phonetic: '/ˌsuːpəˈvɪʒ(ə)n/', meaning: 'n. 监督', sentence: 'The company has implemented a quality control system with multiple levels of supervision.', notes: '公司实施了具有多层次监督的质量控制系统。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N808', word: 'hygiene', phonetic: '/ˈhaɪdʒiːn/', meaning: 'n. 卫生', sentence: 'Regular cleaning and disinfection are part of the hygiene measures in the production area.', notes: '定期清洁和消毒是生产区域卫生措施的一部分。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N809', word: 'security', phonetic: '/sɪˈkjʊərəti/', meaning: 'n. 安全', sentence: 'The company has invested in advanced security systems to prevent unauthorized access to the production area.', notes: '公司投资了先进的安全系统，防止未经授权进入生产区域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N810', word: 'redundancy', phonetic: '/rɪˈdʌndənsi/', meaning: 'n. 冗余 / 多余', sentence: 'The company has implemented redundancy measures in the IT infrastructure to prevent data loss.', notes: '公司在 IT 基础设施中实施了冗余措施，以防止数据丢失。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N811', word: 'cost-effective', phonetic: '/ˌkɒst ɪˈfektɪv/', meaning: 'adj. 成本效益好的', sentence: 'The new production method is more cost-effective, which will help us increase our profit margins.', notes: '新的生产方法更具成本效益，这将有助于我们提高利润率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N812', word: 'labor-intensive', phonetic: '/ˌleɪbər ɪnˈtensɪv/', meaning: 'adj. 劳动密集型的', sentence: 'Despite being labor-intensive, customers highly regard the quality of our handcrafted products.', notes: '尽管是劳动密集型的，但我们手工制作产品的质量受到客', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N813', word: 'part-time', phonetic: '/ˌpɑːt ˈtaɪm/', meaning: 'adj. 兼职的', sentence: 'The company offers part-time positions to students who are interested in gaining manufacturing experience.', notes: '公司为有兴趣获得制造经验的学生提供兼职职位。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N814', word: 'ambiguity', phonetic: '/ˌæmbɪˈɡjuːəti/', meaning: 'n. 模棱两可', sentence: 'There is ambiguity in the instructions for assembling the components, resulting in errors in the final product.', notes: '组件的组装说明存在模糊性，导致最终产品出现错误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N815', word: 'workaholic', phonetic: '/ˌwɜːkəˈhɒlɪk/', meaning: 'n. 工作狂', sentence: 'The factory manager is a workaholic who spends most of his time on the production line.', notes: '这位工厂经理是个工作狂，他大部分时间都花在生产线上。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N816', word: 'talent', phonetic: '/ˈtælənt/', meaning: 'n. 才能', sentence: 'We invest in training and development to nurture the talent of our employees in this factory.', notes: '我们投资于培训和发展，以培养这家工厂员工的才能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N817', word: 'competent', phonetic: '/ˈkɒmpɪtənt/', meaning: 'adj. 能干的', sentence: 'The manufacturing team is composed of competent individuals with diverse skills.', notes: '制造团队由具有不同技能的能干人员组成。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N818', word: 'intervention', phonetic: '/ˌɪntəˈvenʃ(ə)n/', meaning: 'n. 干预', sentence: 'The quality control team\'s intervention prevented a batch of defective products from reaching the market.', notes: '质量控制团队的干预防止了一批有缺陷的产品进入市场。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N819', word: 'mobility', phonetic: '/məʊˈbɪləti/', meaning: 'n. 机动性 / 流动性', sentence: 'The design of the assembly line allows for greater mobility and flexibility in the production process.', notes: '装配线的设计允许在生产过程中有更大的机动性和灵活性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N820', word: 'entrepreneur', phonetic: '/ˌɒntrəprəˈnɜː(r)/', meaning: 'n. 企业家', sentence: 'The success of the company can be attributed to the entrepreneur\'s innovative ideas and leadership.', notes: '这家公司的成功归功于企业家的创新理念和领导才能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N821', word: 'questionnaire', phonetic: '/ˌkwestʃəˈneə(r)/', meaning: 'n. 问卷', sentence: 'The production manager used a questionnaire to assess the skills and knowledge of the workers.', notes: '生产经理使用问卷来评估工人的技能和知识。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N822', word: 'dynamic', phonetic: '/daɪˈnæmɪk/', meaning: 'adj. 动态的', sentence: 'The dynamic nature of the production line requires skilled workers to handle unexpected situations.', notes: '生产线的动态性质要求熟练工人处理意外情况。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N823', word: 'trait', phonetic: '/treɪt/', meaning: 'n. 特征', sentence: 'The company values the creativity trait of its design team in developing unique products.', notes: '公司重视其设计团队的创造力特点，以开发独特的产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N824', word: 'sensitivity', phonetic: '/ˌsensəˈtɪvəti/', meaning: 'n. 敏感性', sentence: 'The sensitivity of the production process requires precise control of temperature and humidity.', notes: '生产过程的敏感性要求对温度和湿度进行精确控制。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N825', word: 'acquisition', phonetic: '/ˌækwɪˈzɪʃ(ə)n/', meaning: 'n. 获得 / 收购', sentence: 'The company\'s recent acquisition of a smaller competitor has expanded its market share.', notes: '公司最近对一家较小竞争对手的收购扩大了其市场份额。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N826', word: 'ingenuity', phonetic: '/ˌɪndʒəˈnjuːəti/', meaning: 'n. 聪明才智 / 独创力', sentence: 'The company\'s success is attributed to the ingenuity of its R&D team in developing innovative products.', notes: '公司的成功归功于其研发团队在开发创新产品方面的聪明才智。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N827', word: 'permanent', phonetic: '/ˈpɜːmənənt/', meaning: 'adj. 长期的 / 永久的', sentence: 'The company is committed to providing permanent job opportunities and a stable work environment for its staff.', notes: '公司致力于为其员工提供长期工作机会和稳定的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N828', word: 'temporary', phonetic: '/ˈtemprəri/', meaning: 'adj. 临时的', sentence: 'Due to the unexpected increase in demand, we need to hire some temporary workers for the production line.', notes: '由于需求意外增加，我们需要为生产线雇佣一些临时工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N829', word: 'satisfactory', phonetic: '/sætɪsˈfæktəri/', meaning: 'adj. 满意的', sentence: 'We received satisfactory customer feedback regarding the quality and delivery of the products.', notes: '我们收到了客户对产品质量和交货的满意反馈。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N830', word: 'repetitive', phonetic: '/rɪˈpetətɪv/', meaning: 'adj. 重复的', sentence: 'The repetitive nature of the assembly line work can lead to worker fatigue and reduced productivity.', notes: '装配线工作的重复性可能导致工人疲劳和生产率下降。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N831', word: 'vacancy', phonetic: '/ˈveɪkənsi/', meaning: 'n. 空缺', sentence: 'We have received a large number of applications for the vacancy, and the selection process will be competitive.', notes: '这个空缺我们已经收到大量申请，选拔过程将竞争激烈。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N832', word: 'applicant', phonetic: '/ˈæplɪkənt/', meaning: 'n. 申请人', sentence: 'The successful applicant will be required to undergo a comprehensive training program.', notes: '成功的申请人将要接受全面的培训计划。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N833', word: 'graduate', phonetic: '/ˈɡrædʒuət; ˈɡrædʒuˌeɪt/', meaning: 'n. 毕业生', sentence: 'Some graduates choose to pursue careers in research and development in the manufacturing sector.', notes: '一些毕业生选择在制造业的研发领域追求职业发展。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N834', word: 'systematic', phonetic: '/ˌsɪstəˈmætɪk/', meaning: 'adj. 系统的', sentence: 'The engineers are using a systematic method to troubleshoot the production line problems.', notes: '工程师们正在使用系统的方法来解决生产线问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N835', word: 'opposite', phonetic: '/ˈɒpəzɪt/', meaning: 'adv. 在对面', sentence: 'The two machines are placed opposite each other to improve the workflow.', notes: '这两台机器被放置在彼此对面，以改善工作流程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N836', word: 'payroll', phonetic: '/ˈpeɪrəʊl/', meaning: 'n. 工资表 / 薪资管理', sentence: 'The manager is reviewing the payroll reports to ensure the accuracy of the payments.', notes: '经理正在审查薪资报告以确保支付的准确性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N837', word: 'personnel', phonetic: '/ˌpɜːsəˈnel/', meaning: 'n. 人员', sentence: 'The production line requires a sufficient number of skilled personnel to operate efficiently.', notes: '生产线需要足够数量的熟练人员才能高效运行。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N838', word: 'visualization', phonetic: '/ˌvɪʒuəlaɪˈzeɪʃn/', meaning: 'n. 可视化', sentence: 'Data visualization helps managers make informed decisions based on production metrics.', notes: '数据可视化帮助管理人员根据生产指标做出明智的决策。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N839', word: 'stoppage', phonetic: '/ˈstɒpɪdʒ/', meaning: 'n. 中断 / 停止', sentence: 'The quality control check identified a defect, triggering a stoppage in the production process.', notes: '质量控制检查发现了一个缺陷，引发了生产过程的停止。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N840', word: 'restructuring', phonetic: '/ˌriːˈstrʌktʃərɪŋ/', meaning: 'n. 重组', sentence: 'The factory is undergoing a major restructuring, which may involve the termination of some positions.', notes: '工厂正在进行重大重组，可能涉及一些职位的终止。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N841', word: 'discrimination', phonetic: '/dɪˌskrɪmɪˈneɪʃn/', meaning: 'n. 歧视 / 辨别', sentence: 'The company is committed to providing equal opportunities to all employees to prevent any form of discrimination.', notes: '公司致力于为所有员工提供平等机会，防止任何形式的歧视。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N842', word: 'executive', phonetic: '/ɪɡˈzekjətɪv/', meaning: 'n. 高管 adj. 执行的', sentence: 'The executive team is responsible for making strategic decisions to drive the company\'s growth.', notes: '高管团队负责做出战略决策以推动公司成长。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N843', word: 'establishment', phonetic: '/ɪˈstæblɪʃmənt/', meaning: 'n. 建立', sentence: 'The establishment of a quality management system is essential for ensuring consistent product quality.', notes: '建立质量管理体系对于确保产品质量的一致性至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N844', word: 'founder', phonetic: '/ˈfaʊndə(r)/', meaning: 'n. 创始人', sentence: 'A passionate founder can inspire the team to work towards the common goal of excellence.', notes: '充满激情的创始人可以激励团队朝着卓越的共同目标努力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N845', word: 'concern', phonetic: '/kənˈsɜːn/', meaning: 'n. 关心 / 关注点', sentence: 'Cost reduction is a common concern for manufacturers to remain competitive in the market.', notes: '降低成本是制造商在市场上保持竞争力的常见关注点。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N846', word: 'chamber', phonetic: '/ˈtʃeɪmbə(r)/', meaning: 'n. 室 / 腔', sentence: 'The curing chamber is used to accelerate the drying and hardening of coatings or adhesives.', notes: '固化室用于加速涂层或胶粘剂的干燥和硬化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N847', word: 'bureaucracy', phonetic: '/bjʊəˈrɒkrəsi/', meaning: 'n. 官僚 ( 作风 )', sentence: 'Bureaucracy can sometimes prevent companies from quickly adapting to changes in the market.', notes: '官僚主义有时会阻止公司迅速适应市场变化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N848', word: 'liability', phonetic: '/ˌlaɪəˈbɪləti/', meaning: 'n. 责任 / 义务', sentence: 'When outsourcing production, manufacturers should clearly define liability to avoid any confusion.', notes: '在外包生产时，制造商应明确界定责任，以避免任何混淆。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N849', word: 'donation', phonetic: '/dəʊˈneɪʃ(ə)n/', meaning: 'n. 捐赠', sentence: 'The company made a generous donation of manufacturing equipment to a local vocational school.', notes: '该公司向当地一所职业学校慷慨捐赠了制造设备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N850', word: 'household', phonetic: '/ˈhaʊshəʊld/', meaning: 'adj. 家用的', sentence: 'The manufacturing process of household appliances requires strict quality control to ensure safety.', notes: '家用电器的制造过程需要严格的质量控制以确保安全。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N851', word: 'copyright', phonetic: '/ˈkɒpiraɪt/', meaning: 'n. 版权', sentence: 'Copyright infringement can result in legal consequences for the manufacturer and damage to their reputation.', notes: '侵犯版权可能导致制造商的法律后果并损害其声誉。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N852', word: 'sample', phonetic: '/ˈsɑːmp(ə)l/', meaning: 'n. 样本 / 试样', sentence: 'The quality control department compared the production samples with the golden sample to ensure consistency.', notes: '质量控制部将生产样品与标准样品进行比较，确保一致性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N853', word: 'rotation', phonetic: '/rəʊˈteɪʃ(ə)n/', meaning: 'n. 转动 / 轮换', sentence: 'The supervisor schedules job rotations to ensure that each employee has the opportunity to learn and develop.', notes: '主管安排工作轮换，确保每个员工都有学习和发展的机会。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N854', word: 'cutting-edge', phonetic: '/ˌkʌtɪŋ ˈedʒ/', meaning: 'adj. 前沿的 / 领先的', sentence: 'Our products incorporate cutting-edge design and functionality to provide a superior user experience.', notes: '我们的产品融合了前沿的设计和功能，提供卓越用户体验。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N855', word: 'charity', phonetic: '/ˈtʃærəti/', meaning: 'n. 慈善', sentence: 'The company organized a charity event to raise funds for local community projects.', notes: '公司组织了一场慈善活动，为当地社区项目筹集资金。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N856', word: 'state-of-the-art', phonetic: '/ˌsteɪt əv ði ˈɑːt/', meaning: 'adj. 最先进的', sentence: 'By investing in state-of-the-art equipment, we can stay competitive in the global market.', notes: '通过投资最先进的设备，我们可以在全球市场保持竞争力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N857', word: 'obsolete', phonetic: '/ˈɒbsəliːt/', meaning: 'adj. 过时的 / 淘汰的', sentence: 'The company decided to phase out the obsolete models and focus on developing new ones.', notes: '公司决定逐步淘汰过时的型号，专注于开发新的型号。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N858', word: 'trademark', phonetic: '/ˈtreɪdmɑːk/', meaning: 'n. 商标', sentence: 'The company spent a lot of money on marketing to build its trademark and brand reputation.', notes: '该公司在营销上花费了大量资金来建立其商标和品牌声誉。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N859', word: 'intellectual', phonetic: '/ˌɪntəˈlektʃuəl/', meaning: 'adj. 智力的 / 知识的', sentence: 'The company invests in training and development programs to enhance the intellectual capabilities of its workforce.', notes: '公司投资于培训和发展计划，以提高员工的知识能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N860', word: 'provision', phonetic: '/prəˈvɪʒ(ə)n/', meaning: 'n. 提供', sentence: 'The company made provisions for additional equipment to increase production capacity.', notes: '公司为增加生产能力提供了额外设备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N861', word: 'subcontractor', phonetic: '/ˈsʌbkəntræktə(r)/', meaning: 'n. 分包商', sentence: 'Subcontractors are often used to provide additional capacity during peak production periods.', notes: '分包商通常用于在生产高峰期提供额外的产能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N862', word: 'tailor-made', phonetic: '/ˌteɪlə ˈmeɪd/', meaning: 'adj. 定制的', sentence: 'The factory can produce tailor-made parts according to the customer\'s specifications.', notes: '工厂可以根据客户的规格生产定制零件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N863', word: 'collaboration', phonetic: '/kəˌlæbəˈreɪʃ(ə)n/', meaning: 'n. 合作', sentence: 'The project required close collaboration among different teams to meet the tight deadline.', notes: '该项目需不同团队之间密切合作，以满足紧迫的截止日期。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N864', word: 'learning curve', phonetic: '/ˈlɜːnɪŋ kɜːv/', meaning: '学习曲线', sentence: 'The introduction of new technology requires a significant learning curve for the workers to adapt to the changes.', notes: '新技术引入需要工人经历一个重要的学习曲线来适应变化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N865', word: 'reform', phonetic: '/rɪˈfɔːm/', meaning: 'n. 改革', sentence: 'The industry needs to embrace technological reforms to stay ahead in the global market.', notes: '该行业需要接受技术改革，以在全球市场中保持领先地位。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N866', word: 'penetration', phonetic: '/ˌpenəˈtreɪʃ(ə)n/', meaning: 'n. 渗透率', sentence: 'This new product has achieved a high level of penetration in the market due to its unique features.', notes: '这款新产品因其独特的特点在市场上取得了很高的渗透率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N867', word: 'monopoly', phonetic: '/məˈnɒpəli/', meaning: 'n. 垄断', sentence: 'Small businesses often struggle to compete against large monopolies in the manufacturing market.', notes: '小企业在制造业市场上往往难以与大型垄断企业竞争。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N868', word: 'rival', phonetic: '/ˈraɪv(ə)l/', meaning: 'n. 竞争对手', sentence: 'Our products are designed to offer better quality and performance than those of our rivals in the market.', notes: '我们的产品旨在提供比市场上竞争对手更好的质量和性能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N869', word: 'portfolio', phonetic: '/pɔːtˈfəʊliəʊ/', meaning: 'n.( 投资 ) 组合', sentence: 'A diverse portfolio of manufacturing capabilities allows us to offer customized solutions to our clients.', notes: '多样化制造能力组合使我们能够为客户提供定制解决方案。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N870', word: 'premium', phonetic: '/ˈpriːmiəm/', meaning: 'adj. 高价的 n. 加价', sentence: 'Despite the premium cost, customers are willing to pay for our products due to their superior quality and performance.', notes: '尽管成本高昂，但客户愿意为我们的产品支付费用，因为它们', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N871', word: 'campaign', phonetic: '/kæmˈpeɪn/', meaning: 'n. 活动', sentence: 'The company is planning a cost reduction campaign to improve its profit margins.', notes: '公司正在计划一场成本削减活动，以提高其利润率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N872', word: 'overhead', phonetic: '/ˌəʊvəˈhed/', meaning: 'n. 间接费用', sentence: 'We need to find ways to reduce overhead expenses without sacrificing product quality.', notes: '我们需要找到在不牺牲产品质量情况下降低间接费用的方法。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N873', word: 'gross margin', phonetic: '/ɡrəʊs ˈmɑːdʒɪn/', meaning: '毛利', sentence: 'By optimizing our supply chain, we can improve gross margin and deliver better value to our customers.', notes: '通过优化供应链，我们可以提高毛利并为客户提供更好的价值。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N874', word: 'cash flow', phonetic: '/ˈkæʃ fləʊ/', meaning: '现金流', sentence: 'The company is facing cashflow problems due to the delay in payment from customers.', notes: '由于客户付款延迟，该公司面临现金流问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N875', word: 'depreciation', phonetic: '/dɪˌpriːʃiˈeɪʃn/', meaning: 'n. 折旧', sentence: 'Regular maintenance can extend the useful life of assets and reduce the rate of depreciation.', notes: '定期维护可以延长资产的使用寿命并降低折旧率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N876', word: 'default', phonetic: '/dɪˈfɔːlt/', meaning: 'n. 默认值', sentence: 'It\'s important to document any changes made to the default settings to ensure consistency in future production runs.', notes: '记录对默认设置所做的任何更改非常重要，以确保未来生产运', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N877', word: 'crisis', phonetic: '/ˈkraɪsɪs/', meaning: 'n. 危机', sentence: 'The COVID-19 pandemic has created a global crisis that has severely impacted the manufacturing sector.', notes: 'COVID-19 流行造成了全球危机，对制造业造成了严重影响。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N878', word: 'simultaneous', phonetic: '/ˌsɪm(ə)lˈteɪniəs/', meaning: 'adj. 同时发生的', sentence: 'We need to ensure simultaneous delivery of all materials to avoid any delays in the production process.', notes: '我们需要确保所有材料同时交付，避免生产过程中的任何延误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N879', word: 'miscellaneous', phonetic: '/ˌmɪsəˈleɪniəs/', meaning: 'adj. 混杂的 / 多种多样的', sentence: 'The miscellaneous expenses for this project include tools, supplies, and transportation costs.', notes: '这个项目的杂项费用包括工具、用品和运输成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N880', word: 'parallel', phonetic: '/ˈpærəlel/', meaning: 'n. 平行', sentence: 'The new assembly line is designed to run in parallel with the existing one, increasing production capacity.', notes: '新装配线设计为与现装配线并行运行，从而提高生产能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N881', word: 'belief', phonetic: '/bɪˈliːf/', meaning: 'n. 信念', sentence: 'The company\'s success is based on the belief that customer satisfaction is paramount.', notes: '公司的成功基于这样一种信念，即客户满意度至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N882', word: 'stereotype', phonetic: '/ˈsteriətaɪp/', meaning: 'n. 刻板印象', sentence: 'The stereotype that women are not good at engineering is gradually being broken.', notes: '女性不擅长工程的刻板印象正在逐渐被打破。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N883', word: 'gesture', phonetic: '/ˈdʒestʃə(r)/', meaning: 'n. 姿势 / 姿态', sentence: 'The workers\' gesture of working overtime without complaint showed their dedication to the project.', notes: '工人们毫无怨言地加班，这一姿态显示了他们对项目的奉献', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N884', word: 'extension', phonetic: '/ɪkˈstenʃ(ə)n/', meaning: 'n. 扩展 / 延长', sentence: 'The extension of the warranty period gives customers more confidence in the quality of our products.', notes: '保修期的延长让客户对我们产品的质量更有信心。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N885', word: 'internship', phonetic: '/ˈɪntɜːnʃɪp/', meaning: 'n. 实习 ( 期 )', sentence: 'During the internship, the interns will have the opportunity to work on real projects and gain valuable skills.', notes: '在实习期间，实习生将有机会参与实际项目并获得宝贵的技能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N886', word: 'apprentice', phonetic: '/əˈprentɪs/', meaning: 'n. 学徒', sentence: 'The company provides apprentices with a competitive salary and benefits package.', notes: '公司为学徒提供有竞争力的薪资和福利待遇。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N887', word: 'brainstorming', phonetic: '/ˈbreɪnstɔːmɪŋ/', meaning: 'n. 头脑风暴', sentence: 'During the brainstorming, participants shared their thoughts and suggestions freely.', notes: '在头脑风暴期间，参与者自由地分享他们的想法和建议。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N888', word: 'precision', phonetic: '/prɪˈsɪʒ(ə)n/', meaning: 'n. 精确', sentence: 'The workers are trained to handle the equipment with precision to avoid any errors.', notes: '工人接受培训以精确操作设备，避免任何错误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N889', word: 'job shop', phonetic: '/ˈdʒɒb ʃɒp/', meaning: '( 定制 ) 专门车间', sentence: 'A job shop typically handles a wide variety of custom orders with unique specifications.', notes: '工作车间通常处理具有独特规格的各种各样的定制订单。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N890', word: 'limitation', phonetic: '/ˌlɪmɪˈteɪʃ(ə)n/', meaning: 'n. 限制', sentence: 'The available resources pose limitations on the production capacity, which may impact the delivery schedule.', notes: '可用资源对生产能力构成限制，这可能会影响交付时间表。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N891', word: 'distinction', phonetic: '/dɪˈstɪŋkʃn/', meaning: 'n. 特点 / 区别', sentence: 'The company\'s attention to detail makes a distinction in the quality and appearance of their products.', notes: '公司对细节的关注在其产品的质量和外观有了卓越特点。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N892', word: 'follow-up', phonetic: '/ˈfɒləʊ ʌp/', meaning: 'n. 后续行动', sentence: 'Regular follow-up meetings are held to monitor the progress of the project and address any issues that arise.', notes: '定期举行后续会议以监测项目进展并解决出现的任何问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N893', word: 'proximity', phonetic: '/prɒkˈsɪməti/', meaning: 'n. 靠近', sentence: 'The choice of the manufacturing site depends on its proximity to the sources of raw materials and the market.', notes: '制造地点的选择取决于它与原材料来源和市场的接近程度。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N894', word: 'continuity', phonetic: '/ˌkɒntɪˈnjuːəti/', meaning: 'n. 连续性', sentence: 'Regular maintenance of equipment is necessary to ensure the continuity of production and avoid downtime.', notes: '定期维护设备是确保生产连续性和避免停机的必要条件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N895', word: 'standardization', phonetic: '/ˌstændədaɪˈzeɪʃn/', meaning: 'n. 标准化', sentence: 'Standardization of components and materials simplifies the production process and reduces costs.', notes: '组件和材料的标准化简化了生产过程并降低了成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N896', word: 'conformity', phonetic: '/kənˈfɔːməti/', meaning: 'n. 符合', sentence: 'All components must undergo strict testing to ensure their conformity to the design requirements.', notes: '所有组件都必须经过严格测试，以确保它们符合设计要求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'extra_1524', word: 'worldwide', phonetic: '', meaning: '全球', sentence: '', notes: '', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'extra_1525', word: 'worn-out', phonetic: '', meaning: '磨損', sentence: '', notes: '', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'extra_1526', word: 'years', phonetic: '', meaning: '年', sentence: '', notes: '', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'extra_1527', word: 'zero', phonetic: '', meaning: '零', sentence: '', notes: '', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'extra_1528', word: 'zone', phonetic: '', meaning: '区域', sentence: '', notes: '', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'extra_practices', word: 'practices', phonetic: '', meaning: '实踐；做法', sentence: '', notes: '', status: 'new', created: 0, reviewCount: 0, lastReviewed: null }
];

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      // If localStorage has empty array, reload from DEFAULT_ENTRIES
      if (Array.isArray(parsed) && parsed.length === 0) {
        entries = DEFAULT_ENTRIES.slice();
        saveData(false);
      } else {
        entries = parsed;
      }
    } else {
      entries = DEFAULT_ENTRIES.slice();
      saveData(false);
    }
  } catch (e) { 
    entries = DEFAULT_ENTRIES.slice(); 
  }
  renderAll();
}

function saveData(show) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  renderAll();
  if (show !== false) showToast('已储存');
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function speak(text) {
  if (!window.speechSynthesis) { showToast('此装置不支援发音'); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function renderAll() {
  renderStats();
  renderList();
  renderStudy();
  renderQuiz();
}

function renderStats() {
  var total = entries.length, newC = 0, learning = 0, mastered = 0;
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].status === 'new') newC++;
    else if (entries[i].status === 'learning') learning++;
    else if (entries[i].status === 'mastered') mastered++;
  }
  document.getElementById('statNew').textContent = newC;
  document.getElementById('statLearning').textContent = learning;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('totalBadge').textContent = total;
  document.getElementById('progressFill').style.width = total ? Math.round((mastered / total) * 100) + '%' : '0%';
}

function renderList() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = document.getElementById('entryList');
  var empty = document.getElementById('emptyState');
  var filtered = entries;
  if (q) {
    filtered = entries.filter(function(e) {
      return (e.word || '').toLowerCase().indexOf(q) !== -1 || (e.meaning || '').toLowerCase().indexOf(q) !== -1 || (e.sentence || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = entries.length === 0 ? 'block' : 'none';
    if (entries.length > 0) list.innerHTML = '<div class="empty-state"><p>沒有符合搜尋的结果</p></div>';
    return;
  }
  empty.style.display = 'none';
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var e = filtered[i];
    var speakBtn = ' <button class="speak-btn" data-speak-sentence="' + escapeHtml(e.sentence) + '" style="font-size:12px;padding:2px 6px;background:#e8f0f8;border-radius:4px;border:none;cursor:pointer;">🔊</button>';
    html += '<div class="entry-card" data-edit-id="' + e.id + '">' +
      '<div class="word">' + escapeHtml(e.word) + ' <button class="speak-btn" data-speak="' + escapeHtml(e.word) + '">🔊</button></div>' +
      (e.phonetic ? '<div class="phonetic">' + escapeHtml(e.phonetic) + '</div>' : '') +
      '<div class="meaning">' + escapeHtml(e.meaning) + '</div>' +
      (e.sentence ? '<div class="meaning" style="margin-top:6px;font-style:italic">' + makeSentenceClickable(e.sentence, speakBtn) + '</div>' : '') +
      '<div class="meta">' +
        '<span class="status-tag ' + e.status + '">' + statusText(e.status) + '</span>' +
        '<span class="date-tag">背过 ' + (e.reviewCount || 0) + ' 次</span>' +
      '</div></div>';
  }
  list.innerHTML = html;
}

function lookupWord(word) {
  var w = word.toLowerCase().trim();
  return entries.find(function(e) {
    return e.word.toLowerCase() === w;
  });
}

function makeSentenceClickable(sentence, speakBtnHtml) {
  if (!sentence) return '';
  var words = sentence.split(/(\s+)/);
  var html = '';
  for (var i = 0; i < words.length; i++) {
    var word = words[i];
    if (/^\s+$/.test(word)) {
      html += word;
    } else {
      var cleanWord = word.replace(/[^a-zA-Z'-]/g, '');
      if (cleanWord) {
        html += '<span class="clickable-word" data-word="' + escapeHtml(cleanWord) + '">' + escapeHtml(word) + '</span>';
      } else {
        html += escapeHtml(word);
      }
    }
  }
  return html + (speakBtnHtml || '');
}

function showWordPopup(word, x, y) {
  var entry = lookupWord(word);
  var popup = document.getElementById('wordPopup');
  var popupWord = document.getElementById('popupWord');
  var popupPhonetic = document.getElementById('popupPhonetic');
  var popupMeaning = document.getElementById('popupMeaning');
  
  popupWord.textContent = word;
  if (entry) {
    popupPhonetic.textContent = entry.phonetic || '';
    popupMeaning.textContent = entry.meaning || '';
  } else {
    popupPhonetic.textContent = '';
    popupMeaning.textContent = '未找到词汇';
  }
  
  popup.style.display = 'block';
  popup.style.left = Math.min(x, window.innerWidth - 300) + 'px';
  popup.style.top = (y + 20) + 'px';
}

function hideWordPopup() {
  document.getElementById('wordPopup').style.display = 'none';
}

function escapeHtml(t) {
  if (!t) return '';
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function statusText(s) {
  return { new: '新词', learning: '学习中', mastered: '已掌握' }[s] || s;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  ['home','add','study','quiz'].forEach(function(v) {
    document.getElementById('view-' + v).style.display = v === tab ? 'block' : 'none';
  });
  if (tab === 'study') renderStudy();
  if (tab === 'quiz') renderQuiz();
}

function addEntry() {
  var word = document.getElementById('inputWord').value.trim();
  var meaning = document.getElementById('inputMeaning').value.trim();
  if (!word || !meaning) { showToast('请填写单词和意思'); return; }
  entries.unshift({
    id: genId(), word: word, phonetic: document.getElementById('inputPhonetic').value.trim(),
    meaning: meaning,
    sentence: document.getElementById('inputSentence').value.trim(),
    notes: document.getElementById('inputNotes').value.trim(),
    status: 'new', created: Date.now(), reviewCount: 0, lastReviewed: null
  });
  saveData();
  clearForm();
  showToast('已加入！');
  switchTab('home');
}

function addBulk() {
  var raw = document.getElementById('bulkInput').value.trim();
  if (!raw) { showToast('请貼上单词'); return; }
  var lines = raw.split(/\n/);
  var added = 0;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var parts = line.split(',');
    var word = parts[0].trim();
    var phonetic = parts[1] ? parts[1].trim() : '';
    var meaning = parts.slice(2).join(',').trim();
    if (!word) continue;
    entries.unshift({
      id: genId(), word: word, phonetic: phonetic, meaning: meaning || '',
      sentence: '', notes: '', status: 'new', created: Date.now(), reviewCount: 0, lastReviewed: null
    });
    added++;
  }
  if (added > 0) {
    saveData();
    document.getElementById('bulkInput').value = '';
    showToast('已导入 ' + added + ' 个词汇！');
    switchTab('home');
  } else {
    showToast('沒有解析到有效词汇');
  }
}

function clearForm() {
  document.getElementById('inputWord').value = '';
  document.getElementById('inputPhonetic').value = '';
  document.getElementById('inputMeaning').value = '';
  document.getElementById('inputSentence').value = '';
  document.getElementById('inputNotes').value = '';
}

function openEdit(id) {
  var e = entries.find(function(x) { return x.id === id; });
  if (!e) return;
  editingId = id;
  document.getElementById('editWord').value = e.word;
  document.getElementById('editPhonetic').value = e.phonetic || '';
  document.getElementById('editMeaning').value = e.meaning;
  document.getElementById('editSentence').value = e.sentence || '';
  document.getElementById('editNotes').value = e.notes || '';
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  var e = entries.find(function(x) { return x.id === editingId; });
  if (!e) return;
  e.word = document.getElementById('editWord').value.trim();
  e.phonetic = document.getElementById('editPhonetic').value.trim();
  e.meaning = document.getElementById('editMeaning').value.trim();
  e.sentence = document.getElementById('editSentence').value.trim();
  e.notes = document.getElementById('editNotes').value.trim();
  saveData();
  closeModal();
}

function deleteEntry() {
  if (!editingId) return;
  if (!confirm('確定删除这个词汇？')) return;
  entries = entries.filter(function(x) { return x.id !== editingId; });
  saveData();
  closeModal();
}

function renderStudy() {
  var area = document.getElementById('studyCardArea');
  var empty = document.getElementById('studyEmpty');
  if (entries.length === 0) { area.style.display = 'none'; empty.style.display = 'block'; return; }
  studyQueue = entries.slice().sort(function(a, b) {
    var p = { new: 0, learning: 1, mastered: 2 };
    return (p[a.status] || 0) - (p[b.status] || 0);
  });
  studyIndex = 0;
  showCard();
  area.style.display = 'flex';
  empty.style.display = 'none';
}

function showCard() {
  flipped = false;
  var e = studyQueue[studyIndex];
  document.getElementById('studyCount').textContent = (studyIndex + 1) + ' / ' + studyQueue.length;
  document.getElementById('frontWord').childNodes[0].nodeValue = e.word + ' ';
  document.getElementById('frontPhonetic').textContent = e.phonetic || '';
  document.getElementById('backMeaning').textContent = e.meaning;
  // Make sentence words clickable
  if (e.sentence) {
    var speakBtn = ' <button class="speak-btn speak-sentence-btn" style="font-size:14px;padding:2px 6px;background:#e8f0f8;border-radius:4px;border:none;cursor:pointer;">🔊</button>';
    document.getElementById('backSentence').innerHTML = makeSentenceClickable(e.sentence, speakBtn);
  } else {
    document.getElementById('backSentence').textContent = '';
  }
  var notesEl = document.getElementById('backNotes');
  if (e.notes) { notesEl.textContent = e.notes; notesEl.style.display = 'block'; }
  else { notesEl.style.display = 'none'; }
  document.getElementById('cardFront').style.display = 'block';
  document.getElementById('cardBack').style.display = 'none';
  document.getElementById('flipHint').textContent = '👆 点击卡片翻开';
  document.getElementById('cardActions').style.display = 'none';
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  document.getElementById('cardFront').style.display = 'none';
  document.getElementById('cardBack').style.display = 'block';
  document.getElementById('flipHint').textContent = '你记住了嗎？';
  document.getElementById('cardActions').style.display = 'grid';
}

function markCard(result) {
  var e = studyQueue[studyIndex];
  var entry = entries.find(function(x) { return x.id === e.id; });
  if (!entry) return;
  entry.reviewCount = (entry.reviewCount || 0) + 1;
  entry.lastReviewed = Date.now();
  if (result === 'again') entry.status = 'learning';
  else if (result === 'hard') entry.status = entry.status === 'new' ? 'learning' : entry.status;
  else if (result === 'good') { if (entry.reviewCount >= 3) entry.status = 'mastered'; else entry.status = 'learning'; }
  saveData();
  studyIndex++;
  if (studyIndex >= studyQueue.length) { showToast('🎉 本輪完成！'); studyIndex = 0; renderStudy(); return; }
  showCard();
}

function renderQuiz() {
  var area = document.getElementById('quizArea');
  var empty = document.getElementById('quizEmpty');
  if (entries.length < 4) { area.style.display = 'none'; empty.style.display = 'block'; return; }
  area.style.display = 'block'; empty.style.display = 'none';
  var shuffled = entries.slice().sort(function() { return Math.random() - 0.5; });
  quizQueue = shuffled.slice(0, Math.min(5, entries.length));
  quizIndex = 0;
  showQuiz();
}

function showQuiz() {
  var e = quizQueue[quizIndex];
  document.getElementById('quizCount').textContent = (quizIndex + 1) + ' / ' + quizQueue.length;
  document.getElementById('quizQuestion').childNodes[0].nodeValue = e.word + ' ';
  document.getElementById('quizPhonetic').textContent = e.phonetic || '';
  var resultDiv = document.getElementById('quizResult');
  resultDiv.style.display = 'none';
  resultDiv.textContent = '';
  resultDiv.style.border = 'none';
  var wrong = entries.filter(function(x) { return x.id !== e.id; }).slice().sort(function() { return Math.random() - 0.5; }).slice(0, 3);
  var options = wrong.concat([e]).slice().sort(function() { return Math.random() - 0.5; });
  currentQuiz = { correctId: e.id };
  var optsDiv = document.getElementById('quizOptions');
  var html = '';
  for (var i = 0; i < options.length; i++) {
    var o = options[i];
    html += '<button class="quiz-option" data-id="' + o.id + '">' + escapeHtml(o.meaning) + '</button>';
  }
  optsDiv.innerHTML = html;
  document.getElementById('quizNextBtn').disabled = true;
  document.getElementById('quizNextBtn').textContent = quizIndex + 1 >= quizQueue.length ? '完成测验' : '下一题';
}

function answerQuiz(id) {
  if (!currentQuiz) return;
  var correct = id === currentQuiz.correctId;
  var resultDiv = document.getElementById('quizResult');
  var btns = document.querySelectorAll('.quiz-option');
  for (var i = 0; i < btns.length; i++) {
    var btn = btns[i];
    btn.disabled = true;
    var isCorrect = btn.dataset.id === currentQuiz.correctId;
    var isSelected = btn.dataset.id === id;
    if (isCorrect) {
      btn.style.cssText = 'border-color:#4a9d6f;background:#e6f4ec;color:#2d7a4a;font-weight:600;display:block;width:100%;text-align:left;padding:14px 16px;border-radius:10px;font-size:15px;margin-bottom:10px;font-family:inherit;cursor:default;';
      btn.innerHTML = '✅ ' + btn.innerHTML;
    } else if (isSelected && !correct) {
      btn.style.cssText = 'border-color:#b54a4a;background:#fbeaea;color:#b54a4a;display:block;width:100%;text-align:left;padding:14px 16px;border-radius:10px;font-size:15px;margin-bottom:10px;font-family:inherit;cursor:default;';
      btn.innerHTML = '❌ ' + btn.innerHTML;
    } else {
      btn.style.opacity = '0.4';
    }
  }
  var entry = entries.find(function(x) { return x.id === currentQuiz.correctId; });
  if (entry) {
    entry.reviewCount = (entry.reviewCount || 0) + 1;
    entry.lastReviewed = Date.now();
    if (correct) {
      if (entry.reviewCount >= 3) entry.status = 'mastered'; else entry.status = 'learning';
      resultDiv.innerHTML = '✅ 正确！';
      resultDiv.style.cssText = 'display:block;text-align:center;padding:14px;margin:10px 0;border-radius:10px;font-size:18px;font-weight:600;background:#e6f4ec;color:#2d7a4a;border:2px solid #4a9d6f;';
    } else {
      entry.status = 'learning';
      resultDiv.innerHTML = '❌ 不对，正确答案是：<b>' + escapeHtml((entry.meaning || '').trim()) + '</b>';
      resultDiv.style.cssText = 'display:block;text-align:center;padding:14px;margin:10px 0;border-radius:10px;font-size:18px;font-weight:600;background:#fbeaea;color:#b54a4a;border:2px solid #b54a4a;';
    }
    saveData(false);
  }
  document.getElementById('quizNextBtn').disabled = false;
}

function nextQuiz() {
  quizIndex++;
  if (quizIndex >= quizQueue.length) { showToast('🎉 测验完成！'); quizIndex = 0; renderQuiz(); return; }
  showQuiz();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function bindEvents() {
  document.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() { switchTab(btn.dataset.tab); });
  });
  document.getElementById('btnSave').addEventListener('click', addEntry);
  document.getElementById('btnClear').addEventListener('click', clearForm);
  document.getElementById('btnBulk').addEventListener('click', addBulk);
  document.getElementById('btnAgain').addEventListener('click', function() { markCard('again'); });
  document.getElementById('btnHard').addEventListener('click', function() { markCard('hard'); });
  document.getElementById('btnGood').addEventListener('click', function() { markCard('good'); });
  document.getElementById('flashcard').addEventListener('click', flipCard);
  document.getElementById('btnModalClose').addEventListener('click', closeModal);
  document.getElementById('btnSaveEdit').addEventListener('click', saveEdit);
  document.getElementById('btnDelete').addEventListener('click', deleteEntry);
  document.getElementById('quizNextBtn').addEventListener('click', nextQuiz);
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('btnSpeakWord').addEventListener('click', function(e) { e.stopPropagation(); var w = studyQueue[studyIndex]; if(w) speak(w.word); });
  document.getElementById('btnSpeakQuiz').addEventListener('click', function(e) { e.stopPropagation(); var w = quizQueue[quizIndex]; if(w) speak(w.word); });
  // Event delegation for sentence speak button and clickable words in flashcard
  document.getElementById('cardBack').addEventListener('click', function(e) {
    var btn = e.target.closest('.speak-sentence-btn');
    if (btn) {
      e.stopPropagation();
      var w = studyQueue[studyIndex];
      if (w && w.sentence) speak(w.sentence);
      return;
    }
    var clickableWord = e.target.closest('.clickable-word');
    if (clickableWord) {
      e.stopPropagation();
      var word = clickableWord.dataset.word;
      var rect = clickableWord.getBoundingClientRect();
      showWordPopup(word, rect.left, rect.bottom);
      return;
    }
  });
  document.getElementById('entryList').addEventListener('click', function(e) {
    var spk = e.target.closest('.speak-btn');
    if (spk) { 
      e.stopPropagation(); 
      if (spk.dataset.speak) {
        speak(spk.dataset.speak); 
      } else if (spk.dataset.speakSentence) {
        speak(spk.dataset.speakSentence); 
      }
      return; 
    }
    var clickableWord = e.target.closest('.clickable-word');
    if (clickableWord) {
      e.stopPropagation();
      var word = clickableWord.dataset.word;
      var rect = clickableWord.getBoundingClientRect();
      showWordPopup(word, rect.left, rect.bottom);
      return;
    }
    var card = e.target.closest('.entry-card');
    if (card) openEdit(card.dataset.editId);
  });
  document.getElementById('quizOptions').addEventListener('click', function(e) {
    var btn = e.target.closest('.quiz-option');
    if (btn && !btn.disabled) answerQuiz(btn.dataset.id);
  });
  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === document.getElementById('editModal')) closeModal();
  });
  // Hide popup when clicking elsewhere
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.clickable-word') && !e.target.closest('.word-popup')) {
      hideWordPopup();
    }
  });
}

bindEvents();
loadData();
</script>
</body>
</html>
