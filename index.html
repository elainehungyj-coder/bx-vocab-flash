  { id: 'vocab_N244', word: 'distribution', phonetic: '/ˌdɪstrɪˈbjuːʃn/', meaning: 'n. 分配 / 分销', sentence: 'The distribution of raw materials, equipment, and labors is carefully managed to ensure smooth operations in the company.', notes: '精心管理原材料、设备和劳动力的分配，以确保公司的生产运', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N245', word: 'condition', phonetic: '/kənˈdɪʃn/', meaning: 'n. 条件', sentence: 'Ensuring proper working conditions is essential for the well-being of employees.', notes: '确保合适的工作条件对员工的福祉至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N246', word: 'technique', phonetic: '/tekˈniːk/', meaning: 'n. 技术 / 技巧', sentence: 'Our engineers are constantly exploring new techniques to improve production processes and enhance product quality.', notes: '我们的工程师不断探索新的技术手段，以改善生产流程并提升', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N247', word: 'control limit', phonetic: '/kənˈtrəʊl lɪmɪt/', meaning: '控制限度', sentence: 'Setting control limits helps monitor and maintain quality standards during production.', notes: '设置控制限度有助于在生产过程中监控和保持质量标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N248', word: 'discovery', phonetic: '/dɪˈskʌvəri/', meaning: 'n. 发现', sentence: 'Scientific discoveries contribute greatly to advancements in manufacturing processes.', notes: '科学发现对制造工艺的进步有巨大贡献。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N249', word: 'distance', phonetic: '/ˈdɪstəns/', meaning: 'n. 距离', sentence: 'The distance between workstations in the workshop is optimized to minimize unnecessary movement and improve workflow efficiency.', notes: '车间内工位之间的距离经过优化，以最大程度地减少不必要的移', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N250', word: 'validation', phonetic: '/ˌvælɪˈdeɪʃn/', meaning: 'n. 验证', sentence: 'Through rigorous validation, we verified the reliability and accuracy of our automated production system.', notes: '通过严格验证，确认了自动化生产系统的可靠性和准确性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N251', word: 'workmanship', phonetic: '/ˈwɜːkmənʃɪp/', meaning: 'n. 手艺', sentence: 'Skilled workmanship ensures the production of highquality products.', notes: '熟练的手艺确保高质量产品的生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N252', word: 'education', phonetic: '/ˌedʒuˈkeɪʃ(ə)n/', meaning: 'n. 教育', sentence: 'The education provided to our workforce equips them with the knowledge to operate complex machinery safely.', notes: '我们为对员工的教育使他们具备安全操作复杂机器的知识。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N253', word: 'necessity', phonetic: '/nəˈsesəti/', meaning: 'n. 必要（的事物）', sentence: 'Regular equipment maintenance is a necessity to ensure smooth operations and prevent breakdowns in the manufacturing process.', notes: '定期设备维护是确保生产运行顺利、防止制造过程中出现故障', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N254', word: 'feature', phonetic: '/ˈfiːtʃə(r)/', meaning: 'n. 特点', sentence: 'The advanced monitoring feature of the MES allows real-time tracking of production data, enabling prompt decision-making in the factory.', notes: 'MES 系统具备的先进监控特点实现了生产数据的实时跟踪，有助', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N255', word: 'mishandling', phonetic: '/ˌmɪsˈhændlɪŋ/', meaning: 'n. 处理不当', sentence: 'Avoiding mishandling of materials is important to prevent defectives and safety accidents.', notes: '避免物料处理不当有助于防止不良品和安全事故。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N256', word: 'agreement', phonetic: '/əˈɡriːmənt/', meaning: 'n. 协议 / 一致', sentence: 'An agreement was reached between the management and workers regarding the implementation of the new bonus scheme.', notes: '管理层和工人就新的奖金计划的实施达成了一致。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N257', word: 'human error', phonetic: '/ˈhjuːmən erə(r)/', meaning: '人为错误', sentence: 'Minimizing human errors is a priority through proper training and quality control measures.', notes: '通过适当培训和质量控制措施，将人为错误降低是优先任务。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N258', word: 'intensity', phonetic: '/ɪnˈtensəti/', meaning: 'n. 强度', sentence: 'Managing the intensity of production helps maintain quality and prevent burnout.', notes: '管理生产强度有助于保持质量并防止过度劳累。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N259', word: 'identification', phonetic: '/aɪˌdentɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 标识 / 身份', sentence: 'Clear identification of materials on the shopfloor helps maintain traceability and quality control.', notes: '在车间，明确的物料标识有助于保证追溯性和质量控制。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N260', word: 'accomplishment', phonetic: '/əˈkʌmplɪʃmənt/', meaning: 'n. 成就', sentence: 'The introduction of a new production technique was a significant accomplishment in improving efficiency.', notes: '引入一种新的生产技术是提高效率的一项重大成就。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N261', word: 'submission', phonetic: '/səbˈmɪʃn/', meaning: 'n. 提交 ( 的文件 )', sentence: 'The CEO wanted the submission of the voluntary resignation from the star salesman, but he messed it up, resulting in his dismissal.', notes: '这个 CEO 想要王牌售货员主动提交辞呈。却搞砸了，导致自己', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N262', word: 'standard deviation', phonetic: '/ˈstændəd diːviˌeɪʃn/', meaning: '标准差', sentence: 'Analyzing the standard deviation of product measurements helps identify quality variations in the manufacturing process.', notes: '分析产品测量数值的标准差有助于发现生产过程中的质量变化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N263', word: 'enterprise', phonetic: '/ˈentəpraɪz/', meaning: 'n. 企业', sentence: 'Implementing an enterprise resource planning (ERP) system streamlines operations and enhances productivity in the factory.', notes: '在工厂中实施企业资源计划系统可以优化运营，提高生产效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N264', word: 'responsibility', phonetic: '/rɪˌspɒnsəˈbɪləti/', meaning: 'n. 责任', sentence: 'The maintenance department takes responsibility for regular equipment checks and troubleshooting.', notes: '设备维护部门负责定期设备检查和故障排除工作。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N265', word: 'structure', phonetic: '/ˈstrʌktʃə(r)/', meaning: 'n. 结构', sentence: 'The organizational structure of the factory plays a vital role in coordinating different departments and teams effectively.', notes: '工厂的组织结构在有效协调不同部门和团队方面起着至关重要', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N266', word: 'escalation', phonetic: '/ˌeskəˈleɪʃ(ə)n/', meaning: 'n. 升级', sentence: 'Any issues that cannot be resolved at the lower levels will undergo an escalation process for further attention.', notes: '任何在较低层面无法解决的问题都将经过升级流程以引起更', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N267', word: 'contamination', phonetic: '/kənˌtæmɪˈneɪʃ(ə)n/', meaning: 'n. 污染', sentence: 'The contamination of raw materials during the manufacturing process can have serious consequences for product quality.', notes: '在制造过程中，原材料的污染可能对产品质量造成严重后果。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N268', word: 'benchmark', phonetic: '/ˈbentʃmɑːk/', meaning: 'n. 基准', sentence: 'By implementing lean manufacturing principles, the company aims to surpass industry benchmarks in efficiency.', notes: '通过实施精益生产，公司想在生产效率上超越行业基准水平。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N269', word: 'recruitment', phonetic: '/rɪˈkruːtmənt/', meaning: 'n. 招聘', sentence: 'The recruitment team utilizes various channels, such as job fairs and online platforms, to reach potential candidates.', notes: '招聘团队利用各种渠道，如招聘会和在线平台，以吸引潜在候', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N270', word: 'metrics', phonetic: '/ˈmetrɪks/', meaning: 'n.（考核）指标', sentence: 'The company uses metrics such as production output, defect rate, and customer satisfaction to evaluate performance.', notes: '公司使用产量、不良率和客户满意度等指标来评估绩效。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N271', word: 'automation', phonetic: '/ˌɔːtəˈmeɪʃ(ə)n/', meaning: 'n. 自动化', sentence: 'Automation has significantly improved production efficiency and reduced labor-intensive tasks in this company.', notes: '自动化技术显著提高了公司生产效率，减少了大量劳动密集型', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N272', word: 'transportation', phonetic: '/ˌtrænspɔːˈteɪʃ(ə)n/', meaning: 'n. 运送', sentence: 'Effective transportation logistics are essential for ensuring the timely delivery of raw materials and finished products.', notes: '有效物流运输对于确保原材料和成品的及时交付非常重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N273', word: 'evidence', phonetic: '/ˈevɪdəns/', meaning: 'n. 证据', sentence: 'Any quality issues need to be backed up with evidence to identify the root cause and implement corrective actions.', notes: '对于任何质量问题，确定根本原因需要有证据支持，并实施纠正措施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N274', word: 'statement', phonetic: '/ˈsteɪtmənt/', meaning: 'n. 声明 / 表达', sentence: 'The quality control team issued a statement confirming the compliance of the products with industry standards.', notes: '质量控制部门发布了一份声明，确认这些产品符合行业标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N275', word: 'urgency', phonetic: '/ˈɜːdʒənsi/', meaning: 'n. 紧急 ( 性 )', sentence: 'The urgency to meet customer demands has led the factory to prioritize production efficiency and on-time delivery.', notes: '满足客户需求的紧迫性促使工厂将生产效率和准时交付作为首', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N276', word: 'warning', phonetic: '/ˈwɔːnɪŋ/', meaning: 'n. 警告', sentence: 'The supervisor gave a warning to the worker about operating the machinery without enough training.', notes: '主管警告了工人，因其在没有足够培训的情况下操作机器。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N277', word: 'penalty', phonetic: '/ˈpenəlti/', meaning: 'n. 处罚', sentence: 'Based on the quality agreement, non-compliance with quality standards may result in penalties, such as fines or rework costs.', notes: '根据质量协议，不符合质量标准会导致罚款或返工成本等处罚。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N278', word: 'award', phonetic: '/əˈwɔːd/', meaning: 'n. 奖励', sentence: 'The factory received an award for its exceptional performance in meeting customer expectations and achieving high-quality standards.', notes: '该工厂因在满足客户期望和达到高质量标准方面表现出色而获了奖。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N279', word: 'symptom', phonetic: '/ˈsɪmptəm/', meaning: 'n. 症状 / 征兆', sentence: 'The sudden drop in productivity could be a symptom of underlying equipment malfunction.', notes: '生产力的突然下降可能是潜在设备故障的症状。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N280', word: 'containment', phonetic: '/kənˈteɪnmənt/', meaning: 'n. 抑制 / 围堵', sentence: 'The swift implementation of containment actions prevented more defective goods from being shipped out.', notes: '迅速实施的围堵措施阻止了更多不良产品的发货。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N281', word: 'behavior', phonetic: '/bɪˈheɪvjə(r)/', meaning: 'n. 行为', sentence: 'The monitoring system tracks the behavior of the assembly line workers to ensure safety protocols and disciplines are followed.', notes: '监控系统追踪装配线工人的行为，以确保遵守安全规程和纪', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N282', word: 'verification', phonetic: '/ˌverɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 验证 / 核查', sentence: 'The verification process ensures that products meet quality specifications and comply with industry standards.', notes: '验证过程确保产品符合质量规格和行业标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N283', word: 'morale', phonetic: '/məˈrɑːl/', meaning: 'n. 士气', sentence: 'The management actively monitors and addresses any issues that may affect the morale of the production team.', notes: '管理层积极监控并解决可能影响生产团队士气的问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N284', word: 'diagram', phonetic: '/ˈdaɪəɡræm/', meaning: 'n. 图表', sentence: 'The supervisor explained the workflow using a visual diagram to ensure clarity among the workers.', notes: '主管使用可视化图表来解释工作流程，以确保员工的清晰理解。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N285', word: 'deadline', phonetic: '/ˈdedlaɪn/', meaning: 'n. 截止日期', sentence: 'The project manager adjusted the sample build schedule to accommodate an earlier deadline from the customer.', notes: '项目经理调整了样品生产排程，适应客户提出的提前截止日期。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N286', word: 'implementation', phonetic: '/ˌɪmplɪmenˈteɪʃ(ə)n/', meaning: 'n. 实施 / 执行', sentence: 'The implementation of automated systems increased the hourly output and reduced human error.', notes: '自动化系统的实施提高了每小时产量并减少了人为错误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N287', word: 'candidate', phonetic: '/ˈkændɪdət/', meaning: 'n. 候选人', sentence: 'The candidate\'s qualifications and skills determine their suitability for a specific role in the factory.', notes: '候选人的资质和技能决定了他们在工厂是否适合特定职位。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N288', word: 'involvement', phonetic: '/ɪnˈvɒlvmənt/', meaning: 'n. 参与', sentence: 'Employee involvement in decision-making processes fosters a sense of ownership and commitment.', notes: '让员工参与决策过程能够培养其归属感和奉献精神。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N289', word: 'empowerment', phonetic: '/ɪmˈpaʊəmənt/', meaning: 'n. 授权', sentence: 'Empowerment initiatives give employees the authority and responsibility to make decisions and take actions.', notes: '授权方案赋予员工权力和责任，使其敢于决策并采取行动。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N290', word: 'conflict', phonetic: '/ˈkɒnflɪkt/', meaning: 'n. 争执 / 冲突', sentence: 'Conflicts in the workplace are resolved through open communication and mediation to ensure a harmonious work environment.', notes: '通过开放的沟通和调解来解决工作场所的冲突，以确保和谐的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N291', word: 'excellence', phonetic: '/ˈeksələns/', meaning: 'n. 卓越', sentence: 'Pursuing excellence is a core value that drives a company to improve its processes and products continuously.', notes: '追求卓越是公司的核心价值观，推动公司不断改进流程和产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N292', word: 'attendance', phonetic: '/əˈtendəns/', meaning: 'n. 出席 / 出勤', sentence: 'The factory management emphasized the importance of punctuality and attendance to ensure smooth production operations.', notes: '工厂管理层强调准时和出勤的重要性，以确保顺利的生产运营。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N293', word: 'permission', phonetic: '/pəˈmɪʃ(ə)n/', meaning: 'n. 许可', sentence: 'The production team must seek permission from the authorized engineers of the quality department before making any changes to the process.', notes: '生产部门在对生产工艺进行任何变更之前必须征得品质部授权工程师', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N294', word: 'administration', phonetic: '/ədˌmɪnɪˈstreɪʃ(ə)n/', meaning: 'n.( 行政 ) 管理', sentence: 'Effective administration is crucial in maintaining smooth communication and coordination between different departments.', notes: '有效的行政管理在维持部门间的顺畅沟通和协调中起着关键作', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N295', word: 'resignation', phonetic: '/ˌrezɪɡˈneɪʃ(ə)n/', meaning: 'n. 辞职', sentence: 'After receiving a job offer from a competitor, several employees submitted their resignations, causing the company to reevaluate its retention strategies.', notes: '在从竞争对手获得工作机会后，几名员工提交了辞职信。使得公司', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N296', word: 'purpose', phonetic: '/ˈpɜːpəs/', meaning: 'n. 目的', sentence: 'The purpose of quality control is to ensure that all products meet the required standards before they reach customers.', notes: '质量控制的目的是确保所有产品在到达客户手中之前符合其所', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N297', word: 'outsourcing', phonetic: '/ˈaʊtsɔːsɪŋ/', meaning: 'n. 外包', sentence: 'Outsourcing certain tasks can help the company focus on its core competencies and improve efficiency.', notes: '将一些任务外包出去可以帮助公司专注于其核心竞争力并提高', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N298', word: 'allowance', phonetic: '/əˈlaʊəns/', meaning: 'n. 津贴 / 补助', sentence: 'Employees receive an allowance for transportation expenses incurred during business-related travel.', notes: '员工因公务出差产生的交通费用可以获得补助。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N299', word: 'vicious cycle', phonetic: '/ˌvɪʃəs ˈsaɪk(ə)l/', meaning: '恶性循环', sentence: 'The high turnover rate in the factory created a vicious cycle, as inexperienced workers led to reduced productivity and further employee dissatisfaction.', notes: '工厂的高员工流动率产生恶性循环，因为经验不足的工人导致生产', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N300', word: 'spectrum', phonetic: '/ˈspektrəm/', meaning: 'n. 幅度 / 范围', sentence: 'The factory utilized a spectrum of cutting-edge technologies to optimize energy consumption and reduce environmental impact.', notes: '工厂利用一系列先进技术来优化能源消耗并降低环境影响。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N301', word: 'bottleneck', phonetic: '/ˈbɒtlnek/', meaning: 'n. 瓶颈', sentence: 'The line balance analysis helps us know the full picture of the resource allocation and find out the bottlenecks in the assembly line.', notes: '线平衡分析帮助我们了解资源分配的全貌，并找出装配线上的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N302', word: 'takt time', phonetic: '/ˈtakt ˌtaɪm/', meaning: '生产节拍', sentence: 'The takt time analysis revealed that our assembly line was operating below the desired pace, indicating a potential need for process improvement.', notes: '生产节拍分析显示我们的装配线产出低于期望节拍，这可能需要进', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N303', word: 'pioneer', phonetic: '/ˌpaɪəˈnɪə(r)/', meaning: 'n. 先驱', sentence: 'The company strives to be a pioneer in adopting innovative technologies and practices.', notes: '公司正努力成为在采用创新技术和实践方面的先驱者。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N304', word: 'severity', phonetic: '/sɪˈverəti/', meaning: 'n. 严重性', sentence: 'The severity of a quality issue determines the level of attention and resources allocated to address it.', notes: '质量问题的严重程度决定了解决问题所需的关注程度和资源分配。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N305', word: 'coordination', phonetic: '/kəʊˌɔːdɪˈneɪʃ(ə)n/', meaning: 'n. 协调 / 配合', sentence: 'Implementing a centralized production management system improved coordination among teams, enhancing efficiency and reducing errors.', notes: '实施中央生产管理系统改善了团队间的配合，提高效率并减少错误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N306', word: 'interaction', phonetic: '/ˌɪntərˈækʃ(ə)n/', meaning: 'n. 互动', sentence: 'Effective interaction between different departments promotes collaboration and smooth operations in the company.', notes: '不同部门之间的有效互动促进公司的合作和顺利运营。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N307', word: 'allocation', phonetic: '/ˌæləˈkeɪʃ(ə)n/', meaning: 'n. 分配', sentence: 'The production manager is responsible for the efficient allocation of resources, such as labor, materials, and equipment, to ensure on-time delivery.', notes: '生产经理负责高效分配资源，如劳动力、材料和设备，以确保按时交付。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N308', word: 'comparison', phonetic: '/kəmˈpærɪs(ə)n/', meaning: 'n. 比较', sentence: 'A comparison of productivity and quality metrics between different shifts helps identify areas for improvement.', notes: '对比不同班次生产率和质量指标有助于确定需要改善的地方。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N309', word: 'concentration', phonetic: '/ˌkɒns(ə)nˈtreɪʃ(ə)n/', meaning: 'n. 集中 / 专注', sentence: 'The concentration of resources on key production lines has helped streamline operations and improve overall efficiency.', notes: '资源集中在关键生产线上有助于优化运营，提高整体效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N310', word: 'scope', phonetic: '/skəʊp/', meaning: 'n. 范围', sentence: 'The engineers conducted a thorough analysis to determine the scope of the equipment upgrade needed to improve production efficiency.', notes: '工程师进行了全面分析，确定了提高生产效率所需的设备升级范围。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N311', word: 'destruction', phonetic: '/dɪˈstrʌkʃ(ə)n/', meaning: 'n. 销毁', sentence: 'Destruction of scrapped products is necessary to maintain quality standards and prevent them from reaching customers.', notes: '销毁报废产品是为了保持质量标准，防止其流出到客户手中。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N312', word: 'direction', phonetic: '/dəˈrekʃ(ə)n/', meaning: 'n. 方向 / 指示', sentence: 'The production team received clear direction from the management on the priorities and goals for the upcoming quarter.', notes: '生产团队从管理层得知明确的方向，以确定下一季度的优先事', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N313', word: 'expert', phonetic: '/ˈekspɜːt/', meaning: 'n. 专家', sentence: 'The company employs experts in various fields such as engineering, quality control, and supply chain management to ensure optimal performance.', notes: '公司聘用各个领域的专家，如工程、质量控制和供应链管理，', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N314', word: 'illumination', phonetic: '/ɪˌluːmɪˈneɪʃn/', meaning: 'n. 照明', sentence: 'Adequate illumination in the production areas helps ensure a safe working environment and accurate visual inspections.', notes: '生产区域充足的照明有助于确保安全的工作环境和准确的目视', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N315', word: 'indicator', phonetic: '/ˈɪndɪkeɪtə(r)/', meaning: 'n. 标志 / 指标', sentence: 'Key performance indicators (KPIs) are used to assess and monitor the factory\'s performance against set targets.', notes: '关键绩效指标用于评估和监测工厂绩效是否达到设定目标。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N316', word: 'surveillance', phonetic: '/sɜːˈveɪləns/', meaning: 'n. 监控', sentence: 'Surveillance cameras are installed in the factory to monitor safety compliance and avoid unauthorized activities.', notes: '工厂内安装监控摄像头，以监测安全合规和防止未经授权的活动。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N317', word: 'guarantee', phonetic: '/ˌɡærənˈtiː/', meaning: 'n. 保证', sentence: 'Meeting the production deadline is our guarantee to customers, reflecting our commitment to timely delivery.', notes: '满足生产截止日期是对客户的保证，体现了对准时交货的承诺。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N318', word: 'presentation', phonetic: '/ˌprez(ə)nˈteɪʃ(ə)n/', meaning: 'n. 陈述 / 演示', sentence: 'A well-prepared presentation can effectively communicate project updates and goals to the attendees in a meeting.', notes: '准备充分的会议演示可以有效地向与会者传达项目进度和目标。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N319', word: 'buffer', phonetic: '/ˈbʌfə(r)/', meaning: 'n. 缓冲 ( 产品 )', sentence: 'The operators closely monitor the buffer levels to prevent delays or shortages in the manufacturing process.', notes: '操作员密切监测缓冲区产品数量，防止制造过程中的延迟或短缺。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N320', word: 'conversation', phonetic: '/ˌkɒnvəˈseɪʃ(ə)n/', meaning: 'n. 交谈', sentence: 'The engineers engaged in a detailed technique conversation to troubleshoot the production line issues.', notes: '工程师们进行了详细的技术交谈，以解决生产线问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N321', word: 'backlog', phonetic: '/ˈbæklɒɡ/', meaning: 'n. 积压 ( 订单 )', sentence: 'The increased demand led to a backlog of orders, causing delays in production and delivery.', notes: '需求增加使得订单积压，导致生产和交货延迟。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N322', word: 'survey', phonetic: '/ˈsɜːveɪ/', meaning: 'n.( 民意 ) 调查', sentence: 'Regular surveys are conducted to collect employee feedback and identify improvement areas.', notes: '定期进行民意调查，收集员工意见反馈，找出需改进的领域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N323', word: 'compensation', phonetic: '/ˌkɒmpenˈseɪʃ(ə)n/', meaning: 'n. 补偿 / 报酬', sentence: 'Attractive compensation packages are offered to recruit and retain skilled talents.', notes: '提供有吸引力的薪酬待遇以招募和留住技能人才。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N324', word: 'appraisal', phonetic: '/əˈpreɪz(ə)l/', meaning: 'n. 评价', sentence: 'An annual performance appraisal evaluates employee performance and provides feedback for improvement.', notes: '年度绩效评价评估员工的表现，并提供改进的反馈。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N325', word: 'lesson learned', phonetic: '/ˈles(ə)n ˈlɜːnd/', meaning: '( 吸取的 ) 教训', sentence: 'Lessons learned from previous projects are shared and used to improve processes and avoid mistakes.', notes: '从以往项目中吸取教训并进行分享，用于改进流程和避免错误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N326', word: 'selection', phonetic: '/sɪˈlekʃ(ə)n/', meaning: 'n. 选择', sentence: 'The automated sorting system facilitates the accurate selection of these LEDs for different illumination intensities.', notes: '自动分拣系统便于准确选择不同照明强度的 LED。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N327', word: 'command', phonetic: '/kəˈmɑːnd/', meaning: 'n. 命令', sentence: 'Clear commands and instructions are given to employees to ensure work is carried out efficiently.', notes: '向员工提供明确的命令和指示，以确保工作高效进行。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N328', word: 'exception', phonetic: '/ɪkˈsepʃ(ə)n/', meaning: 'n. 例外 / 异常', sentence: 'Despite our rigorous quality control measures, occasional exceptions may require immediate attention and resolution.', notes: '尽管我们有严格的质量控制措施，偶尔也会出现异常情况，需要立', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N329', word: 'discussion', phonetic: '/dɪˈskʌʃ(ə)n/', meaning: 'n. 讨论', sentence: 'The cross-functional team held a productive discussion to address the production challenges and find solutions.', notes: '跨职能团队进行了富有成效的讨论，以解决生产遇到的挑战并找', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N330', word: 'disagreement', phonetic: '/ˌdɪsəˈɡriːmənt/', meaning: 'n. 分歧 / 争论', sentence: 'Disagreements are resolved through open dialogue and compromise to maintain a positive work environment.', notes: '通过开放对话和妥协来解决分歧，以保持良好的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N331', word: 'trend', phonetic: '/trend/', meaning: 'n. 趋势', sentence: 'Monitoring industry trends helps the factory anticipate changes and adapt to market demands.', notes: '监测行业趋势有助于工厂预测变化并适应市场需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N332', word: 'influence', phonetic: '/ˈɪnfluəns/', meaning: 'n. 影响', sentence: 'The supervisor\'s management style has a strong influence on the motivation and performance of the production team.', notes: '主管的管理风格对生产团队的激励和绩效有很大影响。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N333', word: 'sequence', phonetic: '/ˈsiːkwəns/', meaning: 'n. 顺序', sentence: 'Engineers must carefully analyze the sequence of assembly steps to optimize efficiency and minimize non-value-added activities.', notes: '工程师必须仔细分析装配步骤的顺序，以优化效率并减少非', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N334', word: 'dormitory', phonetic: '/ˈdɔːmətri/', meaning: 'n. 集体宿舍', sentence: 'As part of our employee welfare program, we have constructed a modern dormitory facility for our operations staff.', notes: '作为员工福利计划的一部分，我们为生产运营员工建造了一座', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N335', word: 'possibility', phonetic: '/ˌpɒsəˈbɪləti/', meaning: 'n. 可能性', sentence: 'Exploring new possibilities for process improvement is encouraged in the factory to foster innovation.', notes: '这家工厂鼓励探索改进流程的新的可能性，以促进创新。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N336', word: 'combination', phonetic: '/ˌkɒmbɪˈneɪʃ(ə)n/', meaning: 'n. 组合', sentence: 'The combination of different skills and expertise in a team contributes to the overall success of the company.', notes: '团队中不同技能和专业知识组合有助于公司获得整体成功。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N337', word: 'strength', phonetic: '/streŋθ/', meaning: 'n. 优势', sentence: 'The strength of our manufacturing process lies in our skilled workforce and state-of-the-art machinery.', notes: '我们制造过程的优势在于拥有熟练员工和先进的机器设备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N338', word: 'treatment', phonetic: '/ˈtriːtmənt/', meaning: 'n. 处理', sentence: 'The surface treatment process enhances the corrosion resistance of our metal components.', notes: '表面处理工艺提高了我们金属零件的耐腐蚀能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N339', word: 'adjustment', phonetic: '/əˈdʒʌstmənt/', meaning: 'n. 调整', sentence: 'Adjustments to production processes may be necessary to accommodate changes in customer requirements.', notes: '可能有必要调整生产流程以适应客户需求的变化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N340', word: 'accident', phonetic: '/ˈæksɪdənt/', meaning: 'n. 意外事故', sentence: 'In the event of an accident, immediate actions are taken to ensure the safety of employees and mitigate potential risks.', notes: '发生意外事故时，我们会立即采取措施确保员工安全，并减少', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N341', word: 'resilience', phonetic: '/rɪˈzɪliəns/', meaning: 'n. 韧性', sentence: 'The resilience of our supply chain is crucial in adapting to unforeseen disruptions and ensuring uninterrupted production.', notes: '我们供应链的韧性对于适应意外干扰和确保不间断生产至关重', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N342', word: 'endeavor', phonetic: '/ɪnˈdevə(r)/', meaning: 'n. 努力', sentence: 'Through our R&D endeavors, we strive to introduce cutting-edge technologies in our manufacturing process.', notes: '通过研发的努力，我们力图在制造过程中引入尖端技术。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N343', word: 'mitigation', phonetic: '/ˌmɪtɪˈɡeɪʃn/', meaning: 'n. 缓解 / 减轻', sentence: 'Our risk mitigation strategies include regular equipment maintenance to prevent unexpected breakdowns.', notes: '我们的风险减轻策略包括定期设备维护以防止意外故障。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N344', word: 'aspect', phonetic: '/ˈæspekt/', meaning: 'n. 方面', sentence: 'Every aspect of the production process is carefully planned and monitored to ensure quality and efficiency.', notes: '生产过程每个方面都经精心计划和监控，保证质量和效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N345', word: 'weakness', phonetic: '/ˈwiːknəs/', meaning: 'n. 劣势 / 缺点', sentence: 'The weakness in our supplier network has led to delays in raw material deliveries, impacting our production schedule.', notes: '我们供应商网络的劣势导致了原材料交付延迟，影响了我们的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N346', word: 'threat', phonetic: '/θret/', meaning: 'n. 威胁', sentence: 'The shortage of skilled labor is a potential threat to meeting production targets and maintaining consistent quality.', notes: '熟练工人短缺对于实现生产目标和保持质量一致是一个潜在威', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N347', word: 'recognition', phonetic: '/ˌrekəɡˈnɪʃn/', meaning: 'n. 认可', sentence: 'Employee recognition programs are implemented to acknowledge outstanding performance.', notes: '实施员工认可方案对出色的业绩进行表彰。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N348', word: 'foundation', phonetic: '/faʊnˈdeɪʃ(ə)n/', meaning: 'n. 基础', sentence: 'The foundation of the factory\'s success lies in its commitment to quality, innovation, and customer satisfaction.', notes: '工厂成功的基础在于其对质量、创新和客户满意度的承诺。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N349', word: 'impact', phonetic: '/ˈɪmpækt/', meaning: 'n. 冲击 / 影响', sentence: 'The sudden increase in raw material prices had a negative impact on our manufacturing costs and profit margins.', notes: '原材料价格的突然增加对我们的生产成本和利润率产生了负', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N350', word: 'agility', phonetic: '/əˈdʒɪləti/', meaning: 'n. 敏捷', sentence: 'Our company\'s success in a competitive market is attributed to our agility to adapt to changing customer demands.', notes: '公司在竞争激烈的市场中成功的原因在于我们能敏捷地应对多', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N351', word: 'sustainability', phonetic: '/səˌsteɪnəˈbɪləti/', meaning: 'n. 可持续性', sentence: 'The adoption of renewable energy sources and efficient waste management systems contributes to our sustainability goals.', notes: '采用可再生能源和高效废物管理系统有助于实现我们的持续性', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N352', word: 'society', phonetic: '/səˈsaɪəti/', meaning: 'n. 社会 / 社群', sentence: 'The company actively contributes to society by creating job opportunities and supporting local communities.', notes: '公司通过创造就业机会和支持当地社区积极为社会做贡献。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N353', word: 'determination', phonetic: '/dɪˌtɜːmɪˈneɪʃ(ə)n/', meaning: 'n. 决心', sentence: 'Determination and perseverance drive employees to overcome challenges and achieve goals.', notes: '决心和毅力驱使员工克服挑战并实现目标。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N354', word: 'outcome', phonetic: '/ˈaʊtkʌm/', meaning: 'n. 结果 / 成果', sentence: 'The outcome of our continuous improvement (CI) projects led to a significant reduction in production lead time.', notes: '我们持续改进项目的成果使得生产交货周期显著缩短。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N355', word: 'pursuit', phonetic: '/pəˈsjuːt/', meaning: 'n. 追求', sentence: 'Our relentless pursuit of customer satisfaction guides our decisions and actions in all aspects of operations.', notes: '我们对客户满意度的不懈追求指导着我们在运营各个方面的决', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N356', word: 'blueprint', phonetic: '/ˈbluːprɪnt/', meaning: 'n. 设计图 / 蓝图', sentence: 'Before starting production, we review the blueprint with our stakeholders to ensure alignment on the desired outcome.', notes: '在开始生产之前，我们与各相关方审查设计图以确保对预期结', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N357', word: 'generation', phonetic: '/ˌdʒenəˈreɪʃ(ə)n/', meaning: 'n.( 产品发展的 ) 代', sentence: 'The next generation of our product line will feature enhanced durability and improved performance based on customer feedback.', notes: '根据客户反馈，我们的下一代产品线将具有更强的耐用性和更', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N358', word: 'merit', phonetic: '/ˈmerɪt/', meaning: 'n. 优点 / 价值', sentence: 'Merit-based promotions and rewards motivate employees to perform at their best.', notes: '基于优点的晋升和奖励激励着员工发挥出最好水平。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N359', word: 'yield', phonetic: '/jiːld/', meaning: 'n. 产量', sentence: 'We closely monitor the yield of each production step to identify and address any bottlenecks or issues.', notes: '我们密切监控每个工位的产量，以识别和解决出现的瓶颈', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N360', word: 'margin', phonetic: '/ˈmɑːdʒɪn/', meaning: 'n. 利润', sentence: 'The margin between production costs and revenue is monitored to ensure profitability for the company.', notes: '监控生产成本与收入之间的利润，以确保公司的利润率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N361', word: 'comfort', phonetic: '/ˈkʌmfət/', meaning: 'n. 舒适', sentence: 'Engineers design production lines focusing on employee comfort, ensuring proper ventilation and temperature control.', notes: '工程师在设计生产线时注重员工的舒适度，确保适当的通风和', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N362', word: 'commodity', phonetic: '/kəˈmɒdəti/', meaning: 'n. 商品 / 必需品', sentence: 'Commodity prices and availability significantly impact the factory\'s production costs and supply chain.', notes: '商品价格和供应情况会显著影响工厂的生产成本和供应链。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N363', word: 'transparency', phonetic: '/trænsˈpærənsi/', meaning: 'n. 透明', sentence: 'Companies that prioritize transparency in their supply chain can address potential issues promptly.', notes: '重视供应链透明度的公司可以及时应对潜在问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N364', word: 'consideration', phonetic: '/kənˌsɪdəˈreɪʃ(ə)n/', meaning: 'n. 考虑因素', sentence: 'Environmental impact is a key consideration for sustainable manufacturing practices and reducing carbon footprint.', notes: '环境影响是可持续制造和减少碳排放的重要考虑因素。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N365', word: 'circumstance', phonetic: '/ˈsɜːkəmstəns/', meaning: 'n. 情况 / 境况', sentence: 'Assessing a quality issue\'s circumstances helps determine its root cause and appropriate actions.', notes: '评估与质量问题相关的各种情况有助于确定其根本原因和适当', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N366', word: 'contract', phonetic: '/ˈkɒntrækt/', meaning: 'n. 合同', sentence: 'Reviewing and negotiating contracts with vendors is essential to secure favorable pricing and delivery terms.', notes: '审查和协商与供应商的合同是确保有利价格和交货条件的关键。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N367', word: 'convenience', phonetic: '/kənˈviːniəns/', meaning: 'n. 便利', sentence: 'Modular designs allow for easy assembly and disassembly, providing convenience in production and maintenance.', notes: '模块化设计方便组装和拆卸，为生产和维护提供了便利。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N368', word: 'volume', phonetic: '/ˈvɒljuːm/', meaning: 'n. 总量', sentence: 'Analyzing demand forecasts helps determine the appropriate volume of raw materials needed for production.', notes: '分析需求预测有助于确定生产所需适量的原材料。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N369', word: 'consumer', phonetic: '/kənˈsjuːmə(r)/', meaning: 'n. 消费者', sentence: 'Conducting market research helps manufacturers identify consumer needs and tailor their products to meet demand.', notes: '进行市场调研有助于制造商了解消费者需求，并根据需求定制', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N370', word: 'adaptation', phonetic: '/ˌædæpˈteɪʃn/', meaning: 'n. 适应', sentence: 'The factory has made adaptations to its existing production lines to accommodate the new products.', notes: '工厂对现有生产线进行了调整，以适应新产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N371', word: 'competency', phonetic: '/ˈkɒmpɪtənsi/', meaning: 'n. 能力', sentence: 'Continuous training programs are essential to enhance employee competencies and adapt to technological advancements.', notes: '持续培训计划对提升员工能力和适应技术进步至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N372', word: 'workforce', phonetic: '/ˈwɜːkfɔːs/', meaning: 'n. 劳动力', sentence: 'A diverse and skilled workforce is a key asset for any manufacturing organization aiming for sustainable growth.', notes: '多样化且熟练的劳动力是任何追求可持续增长的制造组织的重', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N373', word: 'transaction', phonetic: '/trænˈzækʃ(ə)n/', meaning: 'n. 交易 / 处理', sentence: 'The company\'s ERP system tracks every transaction, from raw materials procurement to finished goods delivery.', notes: '公司的 ERP 系统跟踪了从原材料采购到成品交付的每一步处理', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N374', word: 'agency', phonetic: '/ˈeɪdʒənsi/', meaning: 'n. 代理商', sentence: 'The company uses a trustworthy agency to handle its logistics and distribution.', notes: '公司使用可信赖的代理商来负责物流和分销。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N375', word: 'norm', phonetic: '/nɔːm/', meaning: 'n. 规范', sentence: 'The factory follows strict norms for quality control and environmental protection.', notes: '工厂遵循严格的质量控制和环保规范。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N376', word: 'turnover', phonetic: '/ˈtɜːnəʊvə(r)/', meaning: 'n. 周转率', sentence: 'The company aims to increase inventory turnover by implementing a just-in-time production system.', notes: '公司旨在通过实施准时生产 (JIT) 系统提高库存周转率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N377', word: 'reality', phonetic: '/riˈæləti/', meaning: 'n. 现实', sentence: 'The reality is that we need to find a new reliable supplier as soon as possible.', notes: '现实问题是我们需要尽快找到新的可靠供应商。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N378', word: 'pollution', phonetic: '/pəˈluːʃ(ə)n/', meaning: 'n. 污染', sentence: 'The factory has taken effective steps to reduce pollution in compliance with environmental regulations.', notes: '工厂采取了有效措施以符合环境法规并减少污染。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N379', word: 'decade', phonetic: '/ˈdekeɪd/', meaning: 'n. 十年', sentence: 'The company\'s success over the past decade has been attributed to its steady and sustainable strategies.', notes: '公司过去十年的成功归功于其稳健和可持续的战略。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N380', word: 'theory', phonetic: '/ˈθɪəri/', meaning: 'n. 理论', sentence: 'Lean manufacturing principles are based on the theory that minimizing waste improves overall production efficiency.', notes: '精益生产原则的基础是最大限度减少浪费可以提高整体生产效', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N381', word: 'impression', phonetic: '/ɪmˈpreʃ(ə)n/', meaning: 'n. 印象', sentence: 'The automated assembly line ensures consistent product quality, leaving a favorable impression on customers.', notes: '自动化装配线确保质量的一致性，给客户留下良好印象。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N382', word: 'clarification', phonetic: '/ˌklærəfɪˈkeɪʃn/', meaning: 'n. 澄清 / 阐明', sentence: 'The engineering team provided a clarification on the manufacturing specifications to ensure accurate production.', notes: '工程团队阐明了制造规范，以确保生产准确无误。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N383', word: 'option', phonetic: '/ˈɒpʃ(ə)n/', meaning: 'n. 可选项', sentence: 'The production manager presented various cost-saving options to optimize the manufacturing process.', notes: '生产经理提出了各种节省成本的可选方案来优化生产过程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N384', word: 'opinion', phonetic: '/əˈpɪnjən/', meaning: 'n. 意见 / 观点', sentence: 'Management\'s opinion is that we should proceed with the project as planned.', notes: '管理层的意见是我们应按计划继续进行这个项目。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N385', word: 'participant', phonetic: '/pɑːˈtɪsɪpənt/', meaning: 'n. 参与者', sentence: 'The training program provided participants with hands-on experience to enhance their skills.', notes: '培训计划为参与者提供了实际经验，以提升他们的技能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N386', word: 'climate', phonetic: '/ˈklaɪmət/', meaning: 'n. 氛围 / 气候', sentence: 'The company\'s collaborative climate encourages employees to speak up and share ideas.', notes: '公司的合作氛围鼓励员工发表意见和分享想法。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N387', word: 'attention', phonetic: '/əˈtenʃ(ə)n/', meaning: 'n. 关注', sentence: 'The quality control team paid close attention to every detail during the trial run of this new model.', notes: '质量控制团队在这个新型号的试运行期间对每一个细节都非', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N388', word: 'agenda', phonetic: '/əˈdʒendə/', meaning: 'n. 议程', sentence: 'The secretary shared the agenda in advance to ensure every attendee was prepared for the management review.', notes: '秘书提前分享议程，确保每位与会者对管理评审做好准备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N389', word: 'signal', phonetic: '/ˈsɪɡnəl/', meaning: 'n. 信号', sentence: 'The flashing red signal on the machine indicated a fault and prompted the operator to stop production.', notes: '机器上闪烁的红色信号代表有故障，促使操作员停止生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N390', word: 'violation', phonetic: '/ˌvaɪəˈleɪʃ(ə)n/', meaning: 'n. 违规', sentence: 'The quality control team detected a violation in the production process, leading to a temporary halt in the assembly line.', notes: '质量控制团队发现了生产中的违规行为，装配线暂时停工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N391', word: 'barrier', phonetic: '/ˈbæriə(r)/', meaning: 'n. 屏障 / 阻碍物', sentence: 'A safety barrier was installed around the hazardous area to prevent accidents.', notes: '在危险区域周围安装了安全屏障，以防止事故发生。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N392', word: 'tolerance', phonetic: '/ˈtɒlərəns/', meaning: 'n. 公差 / 容忍', sentence: 'The machine\'s high precision requires a tolerance of only 0.01mm for accurate manufacturing.', notes: '机器的高精度要求仅为 0.01mm 公差，确保能准确制造产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N393', word: 'accommodation', phonetic: '/əˌkɒməˈdeɪʃ(ə)n/', meaning: 'n. 住宿', sentence: 'The accommodation facilities provided comfortable living quarters for the production workers.', notes: '住宿设施为生产工人提供了舒适的住处。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N394', word: 'absence', phonetic: '/ˈæbsəns/', meaning: 'n. 缺席', sentence: 'The absence of key personnel delayed the implementation of the pilot run to this new product.', notes: '重要人员的缺席致使这个新产品试产的延迟。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N395', word: 'architecture', phonetic: '/ˈɑːkɪtektʃə(r/', meaning: 'n. 建筑', sentence: 'The architecture of the factory was designed to maximize natural light and energy efficiency.', notes: '工厂的建筑设计旨在最大限度地利用自然光和能源效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N396', word: 'culture', phonetic: '/ˈkʌltʃə(r)/', meaning: 'n. 文化', sentence: 'The company\'s culture emphasizes teamwork, collaboration, and continuous improvement.', notes: '公司的文化强调团队合作、协作和持续改进。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N397', word: 'background', phonetic: '/ˈbækɡraʊnd/', meaning: 'n. 背景', sentence: 'The background noise on the shop floor made it challenging for workers to communicate.', notes: '车间的背景噪音使工人之间的沟通变得困难。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N398', word: 'canteen', phonetic: '/kænˈtiːn/', meaning: 'n. 食堂', sentence: 'The canteen provides nutritious meals for the employees during their lunch breaks.', notes: '食堂在午休时间为员工提供营养餐。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N399', word: 'cardboard', phonetic: '/ˈkɑːdbɔːd/', meaning: 'n. 纸板', sentence: 'The company implemented a recycling program to reduce waste, including recycling cardboard from packaging materials.', notes: '公司实施了回收计划，包括回收包装材料中的纸板，以减少废物。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N400', word: 'currency', phonetic: '/ˈkʌrənsi/', meaning: 'n. 货币', sentence: 'The currency exchange rate fluctuations affected the cost of imported raw materials.', notes: '货币汇率波动影响了进口原材料的成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N401', word: 'decoration', phonetic: '/ˌdekəˈreɪʃ(ə)n/', meaning: 'n. 装饰', sentence: 'The decoration of the product showroom displayed company’s capability for potential clients.', notes: '产品展厅的装饰为潜在客户展示了公司的生产能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N402', word: 'decrease', phonetic: '/ˈdiːkriːs/', meaning: 'n. 减少', sentence: 'A systematic analysis of the production line identified bottlenecks and inefficiencies, leading to a decrease in overall downtime.', notes: '对生产线的系统分析发现了瓶颈和低效，减少了总停机时间。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N403', word: 'increase', phonetic: '/ˈɪnkriːs/', meaning: 'n. 增加', sentence: 'The increase in demand in the upcoming quarter means we have to expand the production capacity.', notes: '下一个季度订单需求的增加意味着我们必须扩大产能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N404', word: 'economy', phonetic: '/ɪˈkɒnəmi/', meaning: 'n. 经济 / 节约', sentence: 'The economies of scale allowed the company to lower production costs significantly.', notes: '规模经济使公司能够大幅降低生产成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N405', word: 'departure', phonetic: '/dɪˈpɑːtʃə(r)/', meaning: 'n. 启程 / 离职', sentence: 'The supervisor made the necessary adjustments to the assembly stations following the departure of a skilled operator.', notes: '熟练操作员离职后，主管对装配工位进行了必要的调整。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N406', word: 'branch', phonetic: '/brɑːntʃ/', meaning: 'n. 分支机构', sentence: 'The branch office is responsible for managing sales and distribution in a specific region.', notes: '分支办事处负责管理特定区域的分销。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N407', word: 'destination', phonetic: '/ˌdestɪˈneɪʃn/', meaning: 'n. 目的地', sentence: 'The destination of this finished product was a warehouse located in Hong Kong.', notes: '这件成品的目的地是位于香港的仓库。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N408', word: 'figure', phonetic: '/ˈfɪɡə(r)/', meaning: 'n. 数字 / 图形', sentence: 'The figures on the production report indicated a steady increase in both FPY and efficiency.', notes: '生产报表中的数字显示了首次通过率和效率有了稳定增长。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N409', word: 'brochure', phonetic: '/ˈbrəʊʃə(r)/', meaning: 'n. 宣传册', sentence: 'The company\'s brochure provided detailed information about its product range and specifications.', notes: '公司的宣传册提供了关于其产品范围和规格的详细信息。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N410', word: 'electricity', phonetic: '/ɪˌlekˈtrɪsəti/', meaning: 'n. 电力', sentence: 'The uninterrupted supply of electricity was crucial for the continuous operation of the production line.', notes: '连续供电对于生产线的持续运行至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N411', word: 'disappointment', phonetic: '/ˌdɪsəˈpɔɪntmənt/', meaning: 'n. 失望', sentence: 'The customer\'s disappointment with the product quality was addressed promptly by the customer service team.', notes: '客户对产品质量的失望得到了客服团队的及时应对。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N412', word: 'inquiry', phonetic: '/ɪnˈkwaɪəri/', meaning: 'n. 询问', sentence: 'The inquiry about the pricing and availability of this product was responded to within 24 hours.', notes: '这个产品的定价和交付情况的询问 24 小时内得到了回复。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N413', word: 'discount', phonetic: '/ˈdɪskaʊnt/', meaning: 'n. 折扣', sentence: 'The bulk purchase of raw materials allowed us to negotiate a significant discount with the supplier.', notes: '通过大量采购原材料，我们与供应商谈了一笔可观的折扣。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N414', word: 'graphics', phonetic: '/ˈɡræfɪks/', meaning: 'n. 图形', sentence: 'The quality control department uses graphics to analyze production data and show quality performance trends.', notes: '品质部门使用图形分析生产数据并展示质量绩效的趋势。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N415', word: 'interval', phonetic: '/ˈɪntəv(ə)l/', meaning: 'n. 间隔', sentence: 'The interval between production runs allowed for machine maintenance and cleaning.', notes: '生产间隔可用于进行机器维护和清洁。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N416', word: 'invitation', phonetic: '/ˌɪnvɪˈteɪʃ(ə)n/', meaning: 'n. 邀请', sentence: 'The company sent out formal invitations to key suppliers for a strategic partnership meeting.', notes: '公司向关键供应商发正式邀请，请他们参加战略合作会议。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N417', word: 'amount', phonetic: '/əˈmaʊnt/', meaning: 'n. 数量', sentence: 'We have optimized our manufacturing processes to reduce the amount of waste generated during production.', notes: '我们优化了生产流程，减少了废料的数量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N418', word: 'announcement', phonetic: '/əˈnaʊnsmənt/', meaning: 'n. 公告', sentence: 'The HR department sent out an internal announcement about an upcoming training session on workplace safety.', notes: '人力资源部门发布了一份关于即将举行的安全生产培训的内', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N419', word: 'invention', phonetic: '/ɪnˈvenʃ(ə)n/', meaning: 'n. 发明', sentence: 'Our R&D team celebrated a breakthrough with the invention of a cutting-edge manufacturing technology.', notes: '我们的研发团队庆祝了在先进制造技术发明上取得的突破。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N420', word: 'location', phonetic: '/ləʊˈkeɪʃn/', meaning: 'n. 位置', sentence: 'The location of the factory in the industrial zone provided easy access to transportation networks.', notes: '这家工厂位于工业区，交通便利。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N421', word: 'comment', phonetic: '/ˈkɒment/', meaning: 'n. 评论 / 意见', sentence: 'The customer\'s comment about the product quality was taken into consideration for improvement.', notes: '客户对产品质量的意见被考虑用于下一步改善。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N422', word: 'litter', phonetic: '/ˈlɪtə(r)/', meaning: 'n..( 乱丢的 ) 垃圾', sentence: 'The litter on the shop floor was promptly cleaned up to maintain a clean and safe working environment.', notes: '车间的垃圾被迅速清理，以保持清洁和安全的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N423', word: 'composition', phonetic: '/ˌkɒmpəˈzɪʃ(ə)n/', meaning: 'n. 构成', sentence: 'The composition of the production team included individuals with diverse backgrounds and skills.', notes: '生产团队的构成包括具有不同背景和技能的个人。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N424', word: 'mechanic', phonetic: '/məˈkænɪk; mɪˈkænɪk/', meaning: 'n. 机械师 / 机修工', sentence: 'The mechanic fixed the machine breakdown swiftly to minimize production downtime.', notes: '机械师迅速修复了机器故障，最大程度减少了停线时间。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N425', word: 'exchange', phonetic: '/ɪksˈtʃeɪndʒ/', meaning: 'n. 交流 / 交换', sentence: 'The exchange of ideas and knowledge between departments enhanced collaboration and innovation.', notes: '部门间思想和知识的交流增强了合作和创新。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N426', word: 'complexity', phonetic: '/kəmˈpleksəti/', meaning: 'n. 复杂性', sentence: 'The complexity of the production process required specialized training for the operators.', notes: '生产过程的复杂性需要操作员接受专门的培训。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N427', word: 'addition', phonetic: '/əˈdɪʃ(ə)n/', meaning: 'n. 增加', sentence: 'The addition of automated robots increased the efficiency of the assembly line.', notes: '增加自动化机器人提高了装配线的效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N428', word: 'exhibition', phonetic: '/ˌeksɪˈbɪʃ(ə)n/', meaning: 'n. 展览', sentence: 'The exhibition showcased the company\'s latest products and innovations to potential customers.', notes: '该展览向潜在客户展示了公司的最新产品和创新成果。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N429', word: 'ambition', phonetic: '/æmˈbɪʃ(ə)n/', meaning: 'n. 雄心', sentence: 'Employees’ ambition for career growth was supported through training and development programs.', notes: '员工职业成长的雄心得到了培训和发展计划的支持。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N430', word: 'manpower', phonetic: '/ˈmænpaʊə(r)/', meaning: 'n. 人力', sentence: 'The company invested in additional manpower to meet the increased production demand.', notes: '公司投入了额外的人力来满足生产需求的增长。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N431', word: 'colleague', phonetic: '/ˈkɒliːɡ/', meaning: 'n. 同事', sentence: 'The colleague\'s support and cooperation contributed to the success of the project.', notes: '同事的支持和合作促成了项目的成功。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N432', word: 'collection', phonetic: '/kəˈlekʃ(ə)n/', meaning: 'n. 收集', sentence: 'The collection of data and feedback from customers helped the team improve product quality.', notes: '收集的客户数据和反馈帮助团队提高了产品质量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N433', word: 'well-being', phonetic: '/ˈwel biːɪŋ/', meaning: 'n. 福祉 / 幸福', sentence: 'The company\'s well-being programs prioritize employee health and work-life balance.', notes: '公司的福祉计划优先考虑员工的健康和工作生活平衡。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N434', word: 'diversity', phonetic: '/daɪˈvɜːsəti/', meaning: 'n. 多样性', sentence: 'The promotion of diversity and inclusion fosters a positive and inclusive work environment.', notes: '通过促进多样性和包容性营造一个积极和包容的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N435', word: 'perk', phonetic: '/pɜːk/', meaning: 'n. 额外待遇', sentence: 'Flexible working hours and remote work options are some of the perks offered to employees.', notes: '灵活工作时间和远程工作选项是给员工的额外待遇之一。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N436', word: 'assignment', phonetic: '/əˈsaɪnmənt/', meaning: 'n. 任务 / 分配', sentence: 'The assignment of tasks to team members was based on their skills and capabilities.', notes: '任务是根据团队成员的技能和能力分配的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N437', word: 'conclusion', phonetic: '/kənˈkluːʒn/', meaning: 'n. 结论', sentence: 'The data analysis led to the conclusion that production efficiency could be improved.', notes: '数据分析得出的结论是生产效率可以改进。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N438', word: 'conference', phonetic: '/ˈkɒnfərəns/', meaning: 'n. 会议', sentence: 'The conference provided a platform for industry experts to discuss the latest trends and opportunities.', notes: '会议为行业专家提供了一个讨论最新趋势和机会的平台。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N439', word: 'potential', phonetic: '/pəˈtenʃ(ə)l/', meaning: 'n. 潜力', sentence: 'The potential for business growth in the international market motivated the company to explore new opportunities.', notes: '国际市场业务增长的潜力促使公司探索新机遇。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N440', word: 'overload', phonetic: '/ˌəʊvəˈləʊd/', meaning: 'n. 超负荷', sentence: 'The overload on the production line led to delays in order fulfillment and increased lead times.', notes: '生产线的超负荷导致了订单履行的延误和交货时间的增加。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N441', word: 'dilemma', phonetic: '/dɪˈlemə/', meaning: 'n. 两难抉择', sentence: 'The management faced a dilemma when deciding between cost reduction and maintaining product quality.', notes: '管理层在降低成本和保持产品质量之间面临两难抉择。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N442', word: 'trade-off', phonetic: '/ˈtreɪd ɒf/', meaning: 'n. 权衡', sentence: 'A common trade-off in production scheduling is between maximizing equipment utilization and minimizing inventory levels.', notes: '在生产调度中，常见的权衡是在设备利用率最大化和库存水平', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N443', word: 'celebration', phonetic: '/ˌselɪˈbreɪʃn/', meaning: 'n. 庆祝', sentence: 'The safety and health committee decided to organize a small celebration for zero accidents in the past 800 days.', notes: '安全与健康委员会决定为过去 800 天零事故举办一场小型庆祝', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N444', word: 'ceremony', phonetic: '/ˈserəməni/', meaning: 'n. 仪式', sentence: 'The ceremony honored outstanding employees for their contributions to the production process.', notes: '这个仪式表彰了对生产过程做出贡献的优秀员工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N445', word: 'transfer', phonetic: '/ˈˈtrænsfɜː(r)/', meaning: 'n. 转移', sentence: 'The transfer of production lines to a new facility required careful planning and logistics coordination.', notes: '将生产线转移到新场地需要仔细的规划和良好的物流协调。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N446', word: 'mindset', phonetic: '/ˈmaɪndset/', meaning: 'n. 心态', sentence: 'A growth mindset is essential for employees to adapt to changes in the production environment.', notes: '成长心态对于员工适应生产环境中的变化至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N447', word: 'resistance', phonetic: '/rɪˈzɪstəns/', meaning: 'n. 阻力', sentence: 'Resistance to change is a common challenge when implementing new processes in manufacturing.', notes: '在生产中实施新工艺时，变革遇到阻力是一个常见的挑战。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N448', word: 'agent', phonetic: '/ˈeɪdʒənt/', meaning: 'n. 代理', sentence: 'The sales agent negotiated with the manufacturer to secure a favorable deal on behalf of their client.', notes: '销售代理通过与制造商协商，为客户争取到有利交易条件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N449', word: 'alarm', phonetic: '/əˈlɑːm/', meaning: 'n. 警报', sentence: 'The alarm system was activated to alert employees in case of emergencies or safety incidents.', notes: '紧急情况或安全事故发生时，警报系统被激活以提醒员工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N450', word: 'configuration', phonetic: '/kənˌfɪɡəˈreɪʃ(ə)n/', meaning: 'n. 配置', sentence: 'The configuration of the production equipment was optimized for maximum efficiency.', notes: '对生产设备进行了优化配置，以实现效率大化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N451', word: 'quantity', phonetic: '/ˈkwɒntəti/', meaning: 'n. 数量', sentence: 'The quantity of raw materials required for production was carefully measured and monitored.', notes: '生产所需的原材料数量经过仔细清点并受到监控。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N452', word: 'revision', phonetic: '/rɪˈvɪʒ(ə)n/', meaning: 'n. 修订', sentence: 'The revision of the production schedule considered the availability of raw materials and the current customer demand.', notes: '生产计划的修订考虑了原材料的可用性和当前客户需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N453', word: 'certificate', phonetic: '/səˈtɪfɪkət/', meaning: 'n. 证书', sentence: 'The certificate of compliance (CoC) ensured that the product met industry standards and regulations.', notes: '符合性证书确保产品符合行业标准和法规。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N454', word: 'chemicals', phonetic: '/ˈkemɪk(ə)lz/', meaning: 'n. 化学品', sentence: 'Chemicals used in the production process were handled and stored per safety protocols.', notes: '按照安全协议处理和储存生产过程中使用的化学品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N455', word: 'reservation', phonetic: '/ˌrezəˈveɪʃn/', meaning: 'n. 预定', sentence: 'The reservation for the meeting room was made in advance to ensure availability.', notes: '提前预定了会议室，以确保可用性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N456', word: 'representative', phonetic: '/ˌreprɪˈzentətɪv/', meaning: 'n. 代表', sentence: 'The sales representative maintained a strong relationship with key clients.', notes: '销售代表与关键客户保持紧密联系。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N457', word: 'termination', phonetic: '/ˌtɜːmɪˈneɪʃ(ə)n/', meaning: 'n. 终止', sentence: 'The termination of the contract was due to repeated breaches of quality standards by the vendor.', notes: '合作合同终止是由于这家供应商多次未达到质量标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N458', word: 'dismissal', phonetic: '/dɪsˈmɪs(ə)l/', meaning: 'n. 解雇', sentence: 'The employee\'s dismissal resulted from repeated discipline violations and poor performance.', notes: '这名员工被解雇是因为多次违反纪律和表现不佳。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N459', word: 'correction', phonetic: '/kəˈrekʃn/', meaning: 'n. 纠正', sentence: 'The IPQC identified a systematic error in the production line and recommended a correction to prevent future occurrences.', notes: 'IPQC 在生产线上发现了一个系统性错误，并提出了纠正措施以', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N460', word: 'profile', phonetic: '/ˈprəʊfaɪl/', meaning: 'n. 简介 / 概况', sentence: 'The employee profile includes information about their skills, experience, and qualifications.', notes: '员工简介包括他们的技能、经验和资格的有关信息。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N461', word: 'delegation', phonetic: '/ˌdelɪˈɡeɪʃn/', meaning: 'n. 授权 / 委派', sentence: 'The delegation of tasks within the team was based on individual strengths and expertise.', notes: '团队内的任务委派是基于个人的优势和专长。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N462', word: 'argument', phonetic: '/ˈɑːɡjumənt/', meaning: 'n. 争论', sentence: 'An argument arose during the meeting regarding production priorities and resource allocation.', notes: '会议中出现了关于生产优先级和资源分配的争论。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N463', word: 'atmosphere', phonetic: '/ˈætməsfɪə(r)/', meaning: 'n. 氛围', sentence: 'The atmosphere in the production facility is vibrant and fosters productivity and creativity.', notes: '生产现场的氛围充满活力，促进了生产力和创造力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N464', word: 'respect', phonetic: '/rɪˈspekt/', meaning: 'n. 尊重', sentence: 'The company emphasizes respect for all employees and promotes an open-door work environment.', notes: '公司强调对所有员工的尊重，并提倡一个开放的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N465', word: 'engagement', phonetic: '/ɪnˈɡeɪdʒmənt/', meaning: 'n. 参与', sentence: 'Employee engagement is a priority for the company, aiming to enhance job satisfaction and motivation.', notes: '员工参与是公司重中之重，以提高工作满意度和激励员工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N466', word: 'inclusion', phonetic: '/ɪnˈkluːʒn/', meaning: 'n. 包容', sentence: 'The company is committed to inclusion and diversity, ensuring equal opportunities for all employees.', notes: '公司致力于包容和多样性，确保所有员工享有平等机会。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N467', word: 'negotiation', phonetic: '/nɪˌɡəʊʃiˈeɪʃn/', meaning: 'n. 谈判', sentence: 'Negotiation with suppliers is crucial to secure favorable terms and pricing for raw materials.', notes: '与供应商的谈判对于获得采购原材料的有利条件至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N468', word: 'subordinate', phonetic: '/səˈbɔːdɪnət/', meaning: 'n. 下属', sentence: 'The production manager delegated tasks to subordinates, ensuring a well-coordinated and efficient workflow.', notes: '生产经理将任务委派给下属，确保了协调良好和高效的工作', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N469', word: 'peer', phonetic: '/pɪə(r)/', meaning: 'n. 平级 / 同辈', sentence: 'The company will conduct 360-degree feedback for middle-level managers, collecting comments from superiors, peers, and subordinates.', notes: '公司将进行中层管理人员的 360 度反馈，收集来自上级、平级和下', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N470', word: 'apology', phonetic: '/əˈpɒlədʒi/', meaning: 'n. 道歉', sentence: 'The quality manager issued an official apology to the affected customers for the recent product recall.', notes: '质量经理就最近产品召回向受影响的客户发出了正式道歉。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N471', word: 'superior', phonetic: '/suːˈpɪəriə(r)/', meaning: 'n. 上级', sentence: 'During the performance review, the employee\'s contributions and achievements were praised by their superior.', notes: '在绩效评估期间，该员工的贡献和成就得到了上级的赞扬。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N472', word: 'counterpart', phonetic: '/ˈkaʊntəpɑːt/', meaning: 'n. 对应方', sentence: 'The QA team collaborated closely with their supplier\'s quality control counterpart to ensure compliance with the standards and specifications.', notes: '质量保证团队与供应商的质量控制对应方紧密合作，确保符合标准', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N473', word: 'appointment', phonetic: '/əˈpɔɪntmənt/', meaning: 'n. 约定 / 任命', sentence: 'The QA department arranged an appointment with the customer to present the findings of the recent quality audit.', notes: 'QA 部门安排了与客户的会面，以展示最近质量审核的结果。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N474', word: 'alignment', phonetic: '/əˈlaɪnmənt/', meaning: 'n. 协调 / 一致', sentence: 'The successful launch of the new product was attributed to the careful alignment of production schedules.', notes: '新产品的成功推出归因于对生产日程的仔细协调。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N475', word: 'teamwork', phonetic: '/ˈtiːmwɜːk/', meaning: 'n. 团队合作', sentence: 'The cross-functional team demonstrated good teamwork in resolving a complex technical issue, leading to a quick production recovery.', notes: '跨职能团队在解决复杂技术问题方面表现出良好的团队合作，从而', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N476', word: 'team-building', phonetic: '/ˈtiːm bɪldɪŋ/', meaning: 'n. 团队建设', sentence: 'Regular team-building exercises can improve morale and cooperation within the operations team, leading to better performance.', notes: '定期的团建活动可以提高运营团队的士气和合作，从而取得更好的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N477', word: 'welfare', phonetic: '/ˈwelfeə(r)/', meaning: 'n. 福利', sentence: 'By investing in ergonomic workstations, the company aims to reduce the risk of injury and improve the overall welfare of its employees.', notes: '通过投资于人体工程学工作站，公司的目标是在减少受伤风险的同', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N478', word: 'uncertainty', phonetic: '/ʌnˈsɜːt(ə)nti/', meaning: 'n. 不确定性', sentence: 'The unpredictable nature of consumer demand and preferences adds uncertainty to production planning.', notes: '消费者需求和偏好的不可预测性给生产计划增加了不确定性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N479', word: 'observation', phonetic: '/ˌɒbzəˈveɪʃ(ə)n/', meaning: 'n. 观察', sentence: 'Through careful observation of the production line, the product engineer identified several bottlenecks and implemented process improvements.', notes: '通过对生产线的仔细观察，产品工程师发现了几个瓶颈并实施了流程', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N480', word: 'orientation', phonetic: '/ˌɔːriənˈteɪʃ(ə)n/', meaning: 'n. 定向培训 / 方向', sentence: 'The orientation program familiarizes new employees with company policies and safety guidelines.', notes: '定向培训计划使新员工熟悉公司政策和安全指南。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N481', word: 'handbook', phonetic: '/ˈhændbʊk/', meaning: 'n. 手册', sentence: 'The employee handbook provides guidelines and information on policies and procedures.', notes: '员工手册提供有关政策和工作流程的指南和信息。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N482', word: 'cycle time', phonetic: '/ˈsaɪkl taɪm/', meaning: '周期时间', sentence: 'Reducing cycle time enhances efficiency, enabling the production line to increase output and meet growing customer demand.', notes: '缩短周期时间可以提高效率，使生产线能够增加产量并满足不断增', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N483', word: 'storage', phonetic: '/ˈstɔːrɪdʒ/', meaning: 'n. 存储', sentence: 'The storage area was organized to ensure efficient retrieval and management of materials.', notes: '存储区域经过整理，以确保材料的有效查找和管理。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N484', word: 'channel', phonetic: '/ˈtʃæn(ə)l/', meaning: 'n. 渠道', sentence: 'Effective communication channels between production and sales teams are essential for aligning supply with demand.', notes: '生产和销售之间有效的沟通渠道对于供需一致至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N485', word: 'fulfillment', phonetic: '/fʊlˈfɪlmənt/', meaning: 'n. 履行', sentence: 'The company\'s investment in advanced warehouse management systems has improved order fulfillment capabilities.', notes: '公司投资了先进的仓库管理系统，提高了订单履行能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N486', word: 'scheme', phonetic: '/skiːm/', meaning: 'n. 方案', sentence: 'The updated bonus scheme motivates employees to achieve production targets and exceed expectations.', notes: '新的奖金方案激励员工达成生产目标并超越期望。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N487', word: 'attraction', phonetic: '/əˈtrækʃ(ə)n/', meaning: 'n. 吸引力', sentence: 'The company\'s innovative product designs and highquality standards serve as key attractions for customers.', notes: '公司的创新产品设计和高质量标准是吸引客户的关键因素。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N488', word: 'audience', phonetic: '/ˈɔːdiəns/', meaning: 'n. 受众', sentence: 'The new product launch campaign successfully reached a broad audience, through a combination of online and offline channels.', notes: '新产品发布活动成功地吸引了线上和线下渠道的广泛受众。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N489', word: 'framework', phonetic: '/ˈfreɪmwɜːk/', meaning: 'n. 框架', sentence: 'The framework of the production process provides a structured approach for optimization and improvement.', notes: '生产过程的框架为优化和改进提供了结构化的方法。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N490', word: 'division', phonetic: '/dɪˈvɪʒ(ə)n/', meaning: 'n. 分工', sentence: 'The division of responsibilities within the team enhances efficiency and accountability.', notes: '团队内的责任划分提高了效率和强化了责任。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N491', word: 'consultant', phonetic: '/kənˈsʌltənt/', meaning: 'n. 顾问', sentence: 'The consultant provided expert advice and guidance on process improvement in the production line.', notes: '顾问就生产线上的流程改进提供了专业建议和指导。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N492', word: 'mentor', phonetic: '/ˈmentɔː(r)/', meaning: 'n. 导师', sentence: 'Pairing new employees with experienced mentors helps to facilitate knowledge transfer and accelerate learning curves.', notes: '为新员工分配经验丰富的导师有助于促进知识传授并加速学习', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N493', word: 'majority', phonetic: '/məˈdʒɒrəti/', meaning: 'n. 大多数', sentence: 'The majority of employees supported the implementation of the new manufacturing execution system (MES).', notes: '大多数员工支持实施新的制造执行系统（MES）。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N494', word: 'humidity', phonetic: '/hjuːˈmɪdəti/', meaning: 'n. 湿度', sentence: 'The high humidity in the warehouse caused the packaging materials to warp and become unusable.', notes: '仓库内高湿度导致包装材料变形，变得无法使用。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N495', word: 'workload', phonetic: '/ˈwɜːkləʊd/', meaning: 'n. 工作量', sentence: 'Management decided to hire additional workers to help alleviate the heavy workload on the assembly line.', notes: '管理决定雇佣额外工人来减轻装配线上的繁重工作量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N496', word: 'heat', phonetic: '/hiːt/', meaning: 'n. 热量', sentence: 'The heat generated by the machines in the plant room required proper ventilation for safety.', notes: '机房机器产生的热量需要适当通风排出以确保安全。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N497', word: 'moisture', phonetic: '/ˈmɔɪstʃə(r)/', meaning: 'n. 湿气', sentence: 'The shopfloor employees were trained on proper storage and handling procedures for moisture-sensitive devices .', notes: '车间员工接受培训，学习湿气敏感元件的正确存储和处理。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N498', word: 'choice', phonetic: '/tʃɔɪs/', meaning: 'n. 选择', sentence: 'The company made the strategic choice to invest in new automated assembly lines for future development.', notes: '公司战略性选择投资于新的自动化装配线以促进未来发展。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N499', word: 'viscosity', phonetic: '/vɪˈskɒsəti/', meaning: 'n. 粘度', sentence: 'The viscosity of the conformal coating is one of the key factors to achieve the desired finish.', notes: '覆盖涂料的粘度是实现期望表面效果的关键因素之一。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N500', word: 'section', phonetic: '/ˈsekʃ(ə)n/', meaning: 'n.( 分 ) 部门', sentence: 'The section manager oversees the production process in their assigned area.', notes: '分部经理负责监督其指定区域内的生产过程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N501', word: 'shortage', phonetic: '/ˈʃɔːtɪdʒ/', meaning: 'n. 短缺', sentence: 'The shortage of raw materials impacted the production schedule and required proactive inventory management.', notes: '原料短缺影响了生产计划，需要进行主动有效的库存管理。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N502', word: 'tutor', phonetic: '/ˈtjuːtə(r)/', meaning: 'n. 导师', sentence: 'The tutor guided the production team on the best practices for quality control.', notes: '导师向生产团队提供了质量控制最佳实践方面的指导。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N503', word: 'adoption', phonetic: '/əˈdɒpʃn/', meaning: 'n. 采用', sentence: 'Our company is considering the adoption of a new software system to optimize inventory management.', notes: '我们公司正在考虑采用新软件系统以优化库存管理。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N504', word: 'interlock', phonetic: '/ˌɪntəˈlɒk/', meaning: 'n. 联锁', sentence: 'The interlock system ensures the machine stops automatically if any safety measure is breached.', notes: '联锁系统确保如果违反任何安全措施，机器将自动停止运行。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
