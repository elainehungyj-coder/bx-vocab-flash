<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="词汇记忆卡" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2338A0D4'/%3E%3Cstop offset='100%25' stop-color='%232D5A8A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cg fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='55' y='55' width='70' height='50' rx='8'/%3E%3Cpath d='M65 75h50M65 90h35'/%3E%3C/g%3E%3C/svg%3E" />
<title>词汇记忆卡</title>
<style>
:root {
  --bg: #faf9f7;
  --card: #ffffff;
  --primary: #2d5a8a;
  --primary-light: #e8f0f8;
  --accent: #4a9d6f;
  --accent-light: #e6f4ec;
  --warn: #c97b3a;
  --warn-light: #fdf3e8;
  --danger: #b54a4a;
  --danger-light: #fbeaea;
  --text: #1a1a1a;
  --text-sec: #666666;
  --text-light: #999999;
  --border: rgba(0,0,0,0.08);
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
#app { flex: 1; display: flex; flex-direction: column; max-width: 600px; width: 100%; margin: 0 auto; overflow: hidden; }
.header { padding: 16px 20px 8px; background: var(--card); border-bottom: 1px solid var(--border); z-index: 10; }
.header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
.subtitle { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.tabs { display: flex; gap: 4px; padding: 8px 16px 12px; background: var(--card); border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 10px 8px; border: none; border-radius: var(--radius-sm); background: transparent; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--text-sec); cursor: pointer; transition: all 0.2s; text-align: center; -webkit-appearance: none; }
.tab.active { background: var(--primary-light); color: var(--primary); }
.tab:active { transform: scale(0.96); }
.content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.content::-webkit-scrollbar { display: none; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--card); border-radius: var(--radius-sm); padding: 14px 8px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
.stat-card .num { font-size: 26px; font-weight: 600; line-height: 1; }
.stat-card .label { font-size: 11px; color: var(--text-sec); margin-top: 6px; }
.stat-card.new .num { color: var(--primary); }
.stat-card.learning .num { color: var(--warn); }
.stat-card.mastered .num { color: var(--accent); }
.section-title { font-size: 15px; font-weight: 600; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.entry-list { display: flex; flex-direction: column; gap: 10px; }
.entry-card { background: var(--card); border-radius: var(--radius-sm); padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s; position: relative; }
.entry-card:active { transform: scale(0.98); }
.entry-card .word { font-size: 16px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.entry-card .phonetic { font-size: 12px; color: var(--text-light); font-family: 'Georgia', 'Times New Roman', serif; margin-bottom: 4px; }
.entry-card .meaning { font-size: 13px; color: var(--text-sec); line-height: 1.5; }
.entry-card .meta { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.status-tag { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 500; }
.status-tag.new { background: var(--primary-light); color: var(--primary); }
.status-tag.learning { background: var(--warn-light); color: var(--warn); }
.status-tag.mastered { background: var(--accent-light); color: var(--accent); }
.date-tag { font-size: 10px; color: var(--text-light); }
.speak-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.speak-btn:active { background: var(--primary-light); transform: scale(0.9); }
.btn { border: none; border-radius: var(--radius-sm); padding: 12px 20px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; -webkit-appearance: none; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: white; }
.btn-accent { background: var(--accent); color: white; }
.btn-warn { background: var(--warn); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: transparent; color: var(--text-sec); border: 1px solid var(--border); }
.btn-block { width: 100%; }
.btn-lg { padding: 14px 24px; font-size: 15px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-sec); margin-bottom: 6px; }
.form-group input, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 15px; background: var(--card); color: var(--text); outline: none; -webkit-appearance: none; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.form-group textarea { min-height: 80px; resize: vertical; }
.flashcard-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
.flashcard { width: 100%; max-width: 360px; min-height: 240px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; position: relative; text-align: center; }
.flashcard:active { transform: scale(0.97); }
.flashcard .front-word { font-size: 28px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; }
.flashcard .front-phonetic { font-size: 14px; color: var(--text-light); font-family: 'Georgia', 'Times New Roman', serif; margin-bottom: 8px; }
.flashcard .front-hint { font-size: 12px; color: var(--text-light); }
.flashcard .back-meaning { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
.flashcard .back-sentence { font-size: 14px; color: var(--text-sec); line-height: 1.6; font-style: italic; }
.flashcard .back-notes { font-size: 12px; color: var(--text-light); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.flip-hint { font-size: 11px; color: var(--text-light); margin-top: 14px; }
.card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; margin-top: 20px; }
.card-actions .btn { font-size: 13px; padding: 14px 8px; }
.progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-sec); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 14px; margin: 0; }
.quiz-wrap { display: flex; flex-direction: column; height: 100%; padding: 20px; max-width: 400px; margin: 0 auto; width: 100%; }
.quiz-question { font-size: 22px; font-weight: 600; text-align: center; margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
.quiz-phonetic { font-size: 14px; color: var(--text-light); font-family: 'Georgia', 'Times New Roman', serif; text-align: center; margin-top: -12px; margin-bottom: 8px; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.quiz-option { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; font-family: inherit; font-size: 15px; text-align: left; cursor: pointer; transition: all 0.2s; -webkit-appearance: none; display: block; width: 100%; }
.quiz-option:hover { border-color: var(--primary); }
.quiz-option:active { transform: scale(0.98); }
.quiz-option.correct { border-color: var(--accent); background: var(--accent-light); color: #2d7a4a; font-weight: 600; }
.quiz-option.wrong { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal { background: var(--card); width: 100%; max-width: 600px; max-height: 85vh; border-radius: var(--radius) var(--radius) 0 0; padding: 20px; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h3 { margin: 0; font-size: 18px; }
.modal-close { background: none; border: none; font-size: 22px; color: var(--text-sec); cursor: pointer; padding: 4px; -webkit-appearance: none; }
.search-box { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; background: var(--card); margin-bottom: 12px; outline: none; -webkit-appearance: none; }
.search-box:focus { border-color: var(--primary); }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--primary-light); color: var(--primary); font-weight: 500; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; transition: all 0.3s ease; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.import-box { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; background: var(--card); margin-bottom: 12px; outline: none; min-height: 120px; resize: vertical; -webkit-appearance: none; }
.clickable-word { cursor: pointer; border-bottom: 1px dashed var(--primary); padding: 0 2px; }
.clickable-word:active { background: var(--primary-light); border-radius: 3px; }
.word-popup { position: fixed; z-index: 200; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; box-shadow: var(--shadow-lg); max-width: 280px; min-width: 150px; pointer-events: none; }
.word-popup .popup-word { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.word-popup .popup-phonetic { font-size: 12px; color: var(--text-light); font-family: 'Georgia', 'Times New Roman', serif; margin-bottom: 4px; }
.word-popup .popup-meaning { font-size: 13px; color: var(--text-sec); }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>📚 词汇记忆卡</h1>
    <div class="subtitle" id="headerSub">加入新词，开始背诵</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="home">📊 总览</button>
    <button class="tab" data-tab="add">➕ 新增</button>
    <button class="tab" data-tab="study">🎯 背诵</button>
    <button class="tab" data-tab="quiz">📝 测验</button>
  </div>

  <div class="content" id="view-home">
    <div class="stats-row">
      <div class="stat-card new"><div class="num" id="statNew">0</div><div class="label">新词</div></div>
      <div class="stat-card learning"><div class="num" id="statLearning">0</div><div class="label">学习中</div></div>
      <div class="stat-card mastered"><div class="num" id="statMastered">0</div><div class="label">已掌握</div></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="section-title">📋 全部词汇 <span class="badge" id="totalBadge">0</span></div>
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜尋词汇或意思..." />
    <div class="entry-list" id="entryList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon">📝</div><p>还沒有词汇，去「新增」加入第一个！</p>
    </div>
  </div>

  <div class="content" id="view-add" style="display:none">
    <div class="form-group"><label>单词 / 词组 *</label><input type="text" id="inputWord" placeholder="例如：serendipity" /></div>
    <div class="form-group"><label>音标</label><input type="text" id="inputPhonetic" placeholder="例如：/ˌsɛrənˈdɪpɪti/" /></div>
    <div class="form-group"><label>意思 / 解释 *</label><input type="text" id="inputMeaning" placeholder="例如：意外发現美好事物的能力" /></div>
    <div class="form-group"><label>例句</label><textarea id="inputSentence" placeholder="例如：Finding that old photo was pure serendipity."></textarea></div>
    <div class="form-group"><label>备註</label><textarea id="inputNotes" placeholder="同义词、用法提醒等..."></textarea></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-primary btn-block btn-lg" id="btnSave">💾 储存</button>
      <button class="btn btn-ghost btn-lg" id="btnClear">清除</button>
    </div>
    <div class="section-title" style="margin-top:24px">📥 批量导入</div>
    <div class="form-group"><label>貼上多个单词（每行一个，格式：单词,音标,意思）</label>
      <textarea class="import-box" id="bulkInput" placeholder="perspective,/pərˈspɛktɪv/,观点&#10;align,/əˈlaɪn/,对齐"></textarea>
    </div>
    <button class="btn btn-accent btn-block" id="btnBulk">📥 批量导入</button>
  </div>

  <div class="content" id="view-study" style="display:none;padding:0">
    <div class="flashcard-wrap" id="studyWrap">
      <div class="empty-state" id="studyEmpty"><div class="icon">🎯</div><p>沒有可背诵的词汇，先去新增一些！</p></div>
      <div id="studyCardArea" style="display:none;width:100%;align-items:center;flex-direction:column">
        <div style="font-size:12px;color:var(--text-light);margin-bottom:8px"><span id="studyCount">1 / 10</span></div>
        <div class="flashcard" id="flashcard">
          <div id="cardFront">
            <div class="front-word" id="frontWord">Word <button class="speak-btn" id="btnSpeakWord">🔊</button></div>
            <div class="front-phonetic" id="frontPhonetic"></div>
            <div class="front-hint">点击翻开答案</div>
          </div>
          <div id="cardBack" style="display:none">
            <div class="back-meaning" id="backMeaning">Meaning</div>
            <div class="back-sentence" id="backSentence">Sentence <button class="speak-btn" id="btnSpeakSentence" style="font-size:14px;padding:2px 6px;background:#e8f0f8;border-radius:4px;border:none;cursor:pointer;">🔊</button></div>
            <div class="back-notes" id="backNotes" style="display:none"></div>
          </div>
        </div>
        <div class="flip-hint" id="flipHint">👆 点击卡片翻开</div>
        <div class="card-actions" id="cardActions" style="display:none">
          <button class="btn btn-danger" id="btnAgain">🔄 再来</button>
          <button class="btn btn-warn" id="btnHard">🤔 困难</button>
          <button class="btn btn-accent" id="btnGood">✅ 记住</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content" id="view-quiz" style="display:none;padding:0">
    <div class="quiz-wrap" id="quizWrap">
      <div class="empty-state" id="quizEmpty"><div class="icon">📝</div><p>需要至少 4 个词汇才能开始测验</p></div>
      <div id="quizArea" style="display:none;width:100%">
        <div style="font-size:12px;color:var(--text-light);text-align:center;margin-top:10px"><span id="quizCount">1 / 5</span></div>
        <div class="quiz-question" id="quizQuestion">Question? <button class="speak-btn" id="btnSpeakQuiz">🔊</button></div>
        <div class="quiz-phonetic" id="quizPhonetic"></div>
        <div id="quizResult" style="display:none; text-align:center; padding:12px; margin:10px 0; border-radius:10px; font-size:16px; font-weight:600;"></div>
        <div class="quiz-options" id="quizOptions"></div>
        <button class="btn btn-primary btn-block" style="margin-top:16px" id="quizNextBtn" disabled>下一题</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header"><h3>✏️ 编辑词汇</h3><button class="modal-close" id="btnModalClose">&times;</button></div>
    <div class="form-group"><label>单词 / 词组</label><input type="text" id="editWord" /></div>
    <div class="form-group"><label>音标</label><input type="text" id="editPhonetic" /></div>
    <div class="form-group"><label>意思 / 解释</label><input type="text" id="editMeaning" /></div>
    <div class="form-group"><label>例句</label><textarea id="editSentence"></textarea></div>
    <div class="form-group"><label>备註</label><textarea id="editNotes"></textarea></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-primary btn-block" id="btnSaveEdit">💾 储存修改</button>
      <button class="btn btn-danger" id="btnDelete">🗑️ 删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="word-popup" id="wordPopup" style="display:none">
  <div class="popup-word" id="popupWord"></div>
  <div class="popup-phonetic" id="popupPhonetic"></div>
  <div class="popup-meaning" id="popupMeaning"></div>
</div>

<script>
const STORAGE_KEY = 'vocab_memo_entries_v2';
let entries = [];
let editingId = null;
let studyQueue = [];
let studyIndex = 0;
let quizQueue = [];
let quizIndex = 0;
let currentQuiz = null;
let flipped = false;

const DEFAULT_ENTRIES = [
  { id: 'vocab_N001', word: 'downtime', phonetic: '/ˈdaʊntaɪm/', meaning: 'n. 停机时间', sentence: 'We have to reduce machine downtime.', notes: '我们必须减少机器停机时间。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N002', word: 'efficiency', phonetic: '/ɪˈfɪʃ(ə)nsi/', meaning: 'n. 效率', sentence: 'We need to increase production efficiency.', notes: '我们需要提升生产效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N003', word: 'equipment', phonetic: '/ɪˈkwɪpmənt/', meaning: 'n. 设备', sentence: 'I am in charge of all the equipment on this shopfloor.', notes: '我负责这个车间的所有设备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N004', word: 'shopfloor', phonetic: '/ˌʃɒpˈflɔː(r)/', meaning: 'n. 车间', sentence: 'Please go to the shopfloor and get the real-time data.', notes: '请到车间去拿实时数据。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N005', word: 'changeover', phonetic: '/ˈtʃeɪndʒəʊvə(r)/', meaning: 'n. 型号转换', sentence: 'It\'s important to conduct a first article check for every model changeover.', notes: '每一次换型，做首件检验是非常重要的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N006', word: 'model', phonetic: '/ˈmɒd(ə)l/', meaning: 'n. 型号', sentence: 'This production line can assemble ten different models.', notes: '这条生产线可以组装十个不同型号的产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N007', word: 'assembly', phonetic: '/əˈsembli/', meaning: 'n. 组装', sentence: 'The capacity of this assembly line is 800 smartphones every day.', notes: '这条组装线的生产能力是每天 800 台智能手机。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N008', word: 'capacity', phonetic: '/kəˈpæsəti/', meaning: 'n. 生产能力', sentence: 'We don\'t have enough capacity to complete this order within one week.', notes: '我们没有足够的生产能力在一周内完成这张订单。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N009', word: 'inspection', phonetic: '/ɪnˈspekʃ(ə)n/', meaning: 'n. 检查', sentence: 'Visual inspection is a must before packing the finished goods.', notes: '在包装成品前必须进行目视检查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N010', word: 'warehouse', phonetic: '/ˈweəhaʊs/', meaning: 'n. 仓库', sentence: 'Please inspect these products before moving them to the warehouse.', notes: '把它们转移到仓库之前请检查这些产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N011', word: 'inventory', phonetic: '/ˈɪnvəntri/', meaning: 'n. 库存', sentence: 'We have to control the inventory level based on actual production demand.', notes: '我们必须根据实际生产需求来控制库存水平。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N012', word: 'process', phonetic: '/ˈprəʊses/', meaning: 'n. 工艺过程', sentence: 'The line leader must monitor all production processes.', notes: '生产线组长必须监控所有的生产工艺过程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N013', word: 'delivery', phonetic: '/dɪˈlɪvəri/', meaning: 'n. 交付', sentence: 'On-time delivery is a critical KPI for the production department.', notes: '准时交付是生产部的一个至关重要的 KPI（关键绩效指标）。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N014', word: 'procedure', phonetic: '/prəˈsiːdʒə(r)/', meaning: 'n. 流程 / 程序', sentence: 'There are tens of standard procedures to ensure smooth operations in this factory.', notes: '在这间工厂里，有几十个标准流程以保证顺利运营。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N015', word: 'schedule', phonetic: '/ˈʃedjuːl/', meaning: 'n. 排程', sentence: 'The planning team sends the production schedule to each assembly line before 9 o\'clock every morning.', notes: '计划部门在每天早上 9 点前将生产排程发给每一条组装线。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N016', word: 'flow chart', phonetic: '/ˈfləʊ tʃɑːt/', meaning: '流程图', sentence: 'The engineering team will define the flow chart for this new product before the trial run.', notes: '工程部门在试产前将确定这个新产品的工艺流程图。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N017', word: 'trial run', phonetic: '/ˈtraɪəl ˌrʌn/', meaning: '试产', sentence: 'We must review the trial run report to determine the corrective actions.', notes: '我们必须复盘这个试产报告，以确定纠正措施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N018', word: 'control plan', phonetic: '/kənˈtrəʊl ˌplæn/', meaning: '控制计划', sentence: 'The IPQC auditor uses the control plan to check every workstation.', notes: 'IPQC 稽核员用控制计划对每个工位进行检查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N019', word: 'audit', phonetic: '/ˈɔːdɪt/', meaning: 'n. 审核', sentence: 'We will face a customer audit next Monday, and we have to prepare it in advance.', notes: '下周一有一个客户来审核，我们必须提前做好准备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N020', word: 'product', phonetic: '/ˈprɒdʌkt/', meaning: 'n. 产品', sentence: 'Product design is the most important phase during the life cycle of any product.', notes: '任何产品的生命周期里，产品设计都是最重要的阶段。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N021', word: 'discipline', phonetic: '/ˈdɪsəplɪn/', meaning: 'n. 纪律', sentence: 'Most of the workers of this production line keep good discipline.', notes: '这条生产线的大部分工人都保持良好的纪律。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N022', word: 'engineering', phonetic: '/ˌendʒɪˈnɪərɪŋ/', meaning: 'n. 工程', sentence: 'The engineering team is led by a very famous expert in this field.', notes: '这个工程团队是由行业里一位有名的专家带领的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N023', word: 'purchasing', phonetic: '/ˈpɜːtʃəsɪŋ/', meaning: 'n. 采购', sentence: 'This factory has a dedicated purchasing team for indirect materials.', notes: '这家工厂有一个专门的采购团队负责间接物料。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N024', word: 'quality', phonetic: '/ˈkwɒləti/', meaning: 'n. 质量', sentence: 'Every factory must establish a suitable quality management system.', notes: '每一间工厂都必须建立一个合适的质量管理系统。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N025', word: 'supervisor', phonetic: '/ˈsuːpəvaɪzə(r)/', meaning: 'n. 主管', sentence: 'The supervisor of this shopfloor is very strict about working discipline.', notes: '这个车间的主管对工作纪律抓得很严。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N026', word: 'instruction', phonetic: '/ɪnˈstrʌkʃ(ə)n/', meaning: 'n. 指引', sentence: 'Every worker should follow the work instructions to ensure product quality.', notes: '每个工人都应该遵守作业指引（WI），以确保产品质量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N027', word: 'material', phonetic: '/məˈtɪəriəl/', meaning: 'n. 物料', sentence: 'These raw materials have to be stored in the warehouse with environmental control.', notes: '这些原材料必须存放在有环境控制的仓库里。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N028', word: 'lead time', phonetic: '/ˈliːd taɪm/', meaning: '交货周期', sentence: 'The purchasing team must monitor the delivery of the long lead time materials.', notes: '采购团队必须盯紧长交期物料的到货情况。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N029', word: 'maintenance', phonetic: '/ˈmeɪntənəns/', meaning: 'n. 维护保养', sentence: 'Regular maintenance of the equipment is the basic activity to keep its performance.', notes: '定期对设备进行保养是确保其性能的基础工作。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N030', word: 'performance', phonetic: '/pəˈfɔːməns/', meaning: 'n. 性能 / 绩效', sentence: 'These machines have excellent performance and reasonable prices.', notes: '这些机器拥有卓越的性能和合理的价格。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N031', word: 'overtime', phonetic: '/ˈəʊvətaɪm/', meaning: 'n. 加班', sentence: 'We must arrange 3 hours of overtime tonight to complete this urgent order.', notes: '今晚我们必须安排 3 小时加班来完成这张急单。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N032', word: 'facility', phonetic: '/fəˈsɪləti/', meaning: 'n. 设施', sentence: 'It\'s essential to have enough safety facilities in production areas.', notes: '在生产区域必须要有足够的安全设施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N033', word: 'safety', phonetic: '/ˈseɪfti/', meaning: 'n. 安全', sentence: 'It\'s the most important task to ensure safety at work.', notes: '确保安全生产是最重要的工作任务。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N034', word: 'fixture', phonetic: '/ˈfɪkstʃə(r)/', meaning: 'n. 夹具', sentence: 'We need to design a fixture to help the workers assemble these components.', notes: '我们需要设计一个夹具来帮助工人们组装这些零件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N035', word: 'component', phonetic: '/kəmˈpəʊnənt/', meaning: 'n. 零部件', sentence: 'The material handler has prepared all components for this production order.', notes: '物料员已经将这张生产工单的所有零部件都准备好了。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N036', word: 'tester', phonetic: '/ˈtestə(r)/', meaning: 'n. 测试机', sentence: '100% of these products have to be tested by the functional tester.', notes: '这些产品必须百分之百经过功能测试。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N037', word: 'function', phonetic: '/ˈfʌŋkʃ(ə)n/', meaning: 'n. 功能', sentence: 'One of the main functions of the Quality Department is process auditing.', notes: '品质部的一个主要功能是进行制程审核。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N038', word: 'technician', phonetic: '/tekˈnɪʃ(ə)n/', meaning: 'n. 技术员', sentence: 'Please arrange for a technician to fix the broken-down machine immediately.', notes: '请马上安排一名技术员去修复那台坏机器。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N039', word: 'line leader', phonetic: '/ˈlaɪn ˌliːdə(r)/', meaning: '组长 / 拉长 / 领班', sentence: 'The line leader is absent today, so you can get approval from your supervisor.', notes: '生产领班今天不在，可以找你的主管去审批。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N040', word: 'customer', phonetic: '/ˈkʌstəmə(r)/', meaning: 'n. 客户', sentence: 'Please set up a meeting to discuss the 8D report for the latest customer complaint.', notes: '请安排一次会议来讨论客户最新投诉的 8D 报告。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N041', word: 'engineer', phonetic: '/ˌendʒɪˈnɪə(r)/', meaning: 'n. 工程师', sentence: 'There are more than 30 engineers with rich experience in the R&D department.', notes: '研发部有超过 30 名经验丰富的工程师。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N042', word: 'supplier', phonetic: '/səˈplaɪə(r)/', meaning: 'n. 供应商', sentence: 'The IQC inspectors are responsible for quality checks on materials from different suppliers.', notes: 'IQC 检查员负责对来自不同供应商的材料进行质量检查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N043', word: 'complaint', phonetic: '/kəmˈpleɪnt/', meaning: 'n. 投诉', sentence: 'We received three complaints from the aftersales team last week.', notes: '上周我们收到了三个来自售后团队的投诉。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N044', word: 'electrician', phonetic: '/ɪˌlekˈtrɪʃ(ə)n/', meaning: 'n. 电工', sentence: 'Power supply issues must be handled by certified electricians.', notes: '电力供应问题必须由有资格的电工来处理。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N045', word: 'approval', phonetic: '/əˈpruːv(ə)l/', meaning: 'n. 批准', sentence: 'This application form has to be reviewed by the department manager with his approval.', notes: '这张申请表需要经部门经理的审核，并获得其批准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N046', word: 'objective', phonetic: '/əbˈdʒektɪv/', meaning: 'n. 目标', sentence: 'Increasing the hourly output of this product is one of your key objectives.', notes: '将这个产品的每小时产出提高是你的关键目标之一。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N047', word: 'solution', phonetic: '/səˈluːʃ(ə)n/', meaning: 'n. 解决方案', sentence: 'We have to find a solution to fix the malfunctioning tester within this week.', notes: '我们必须找到解决方案，在本周内修好有故障的测试机。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N048', word: 'manager', phonetic: '/ˈmænɪdʒə(r)/', meaning: 'n. 经理 / 管理者', sentence: 'As a manager, you should lead your team members to achieve all the objectives.', notes: '作为经理，你需要带领团队成员达成所有目标。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N049', word: 'output', phonetic: '/ˈaʊtpʊt/', meaning: 'n. 产出', sentence: 'Please keep your eyes on the output of this line, and report the results to me every two hours.', notes: '请盯紧这条生产线的产量，每两小时向我汇报一次。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N050', word: 'report', phonetic: '/rɪˈpɔːt/', meaning: 'n. 报告', sentence: 'All the weekly reports have to be submitted to your boss before next Tuesday.', notes: '所有的周报都必须在下周二之前提交给你的老板。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N051', word: 'certification', phonetic: '/ˌsɜːtɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 资质证书', sentence: 'The electrician has to obtain certification before performing electrical tasks.', notes: '电工必须在进行电气相关工作之前取得资质证书。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N052', word: 'issue', phonetic: '/ˈɪʃuː/', meaning: 'n. 议题 / 问题', sentence: 'The management review meeting will discuss solutions to all the open issues.', notes: '管理评审会将讨论所有未关闭问题的解决方案。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N053', word: 'defect', phonetic: '/ˈdiːfekt/', meaning: 'n. 缺陷', sentence: 'Pursuing zero defects is a fundamental concept for cost reduction.', notes: '追求零缺陷是降低成本的一个基本理念。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N054', word: 'communication', phonetic: '/kəˌmjuːnɪˈkeɪʃ(ə)n/', meaning: 'n. 沟通', sentence: 'Maintaining effective communication among team members is crucial for success.', notes: '团队成员之间保持有效沟通对成功至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N055', word: 'failure', phonetic: '/ˈfeɪljə(r)/', meaning: 'n. 失效 / 失败', sentence: 'Please provide a detailed analysis report for the testing failures.', notes: '请提供那些测试失效问题的详细分析报告。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N056', word: 'root cause', phonetic: '/ˈruːt kɔːz/', meaning: '根本原因', sentence: 'The functional failures have to be thoroughly analyzed, and the root causes must be identified.', notes: '必须彻底分析这些功能不良，确定根本原因。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N057', word: 'attachment', phonetic: '/əˈtætʃmənt/', meaning: 'n. 附件', sentence: 'Please find the half-year business report in the attachment of this e-mail.', notes: '请查收邮件，附件内容是半年业绩报告。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N058', word: 'shift', phonetic: '/ʃɪft/', meaning: 'n. 轮班 / 转换', sentence: 'We have planned two shifts of 11 hours each for the upcoming orders.', notes: '我们已经为将要来的订单安排了两班各 11 小时。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N059', word: 'setup', phonetic: '/ˈsetʌp/', meaning: 'n. 安装 / 设置', sentence: 'Only authorized engineers can modify the setup parameters of this machine.', notes: '只有授权的工程师可以更改这台机器的设置参数。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N060', word: 'shipment', phonetic: '/ˈʃɪpmənt/', meaning: 'n. 出货', sentence: 'Please ensure that the finished goods are ready for shipment before 5:30 this afternoon.', notes: '请确保今天下午五点半前做好成品，准备出货。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N061', word: 'service', phonetic: '/ˈsɜːvɪs/', meaning: 'n. 服务', sentence: 'The customer service team will oversee this order from start to shipment.', notes: '客户服务部门将跟进这张订单，从开始到出货。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N062', word: 'improvement', phonetic: '/ɪmˈpruːvmənt/', meaning: 'n. 改善', sentence: 'I would like to see further improvements in your work.', notes: '我需要你的工作有进一步改善。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N063', word: 'design', phonetic: '/dɪˈzaɪn/', meaning: 'n. 设计', sentence: 'A good design for assembly ensures smooth NPI for the manufacturing team.', notes: '优秀的组装设计为制造团队顺利进行新产品导入提供保证。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N064', word: 'supply chain', phonetic: '/səˈplaɪ tʃeɪn/', meaning: '供应链', sentence: 'Production plays a significant role in the entire supply chain.', notes: '生产是整个供应链中非常重要的一环。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N065', word: 'principle', phonetic: '/ˈprɪnsəp(ə)l/', meaning: 'n. 原则', sentence: 'We need to adhere to the PDCA principles in our daily work.', notes: '在日常工作中我们要遵守 PDCA 准则。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N066', word: 'finished goods', phonetic: '/ˈfɪnɪʃt ɡʊdz/', meaning: '成品', sentence: 'One of the fundamental 5S requirements is to designate a dedicated area for finished goods.', notes: '5S 的基本要求之一是要确定一个专门的成品放置区。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N067', word: 'method', phonetic: '/ˈmeθəd/', meaning: 'n. 方法', sentence: 'This problem-solving method aims to identify the root causes of abnormal phenomena.', notes: '这种解决问题的方法旨在找出异常现象的根本原因。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N068', word: 'development', phonetic: '/dɪˈveləpmənt/', meaning: 'n. 发展', sentence: 'Our factory provides abundant opportunities for personal development.', notes: '我们工厂提供大量的个人发展机会。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N069', word: 'project', phonetic: '/ˈprɒdʒekt/', meaning: 'n. 项目', sentence: 'Despite facing numerous challenges, we completed this project.', notes: '尽管面临许多挑战，我们成功完成了这个项目。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N070', word: 'employee', phonetic: '/ɪmˈplɔɪiː/', meaning: 'n. 员工', sentence: 'We are recruiting employees for our quality assurance team.', notes: '我们正在招聘质量保证团队的员工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N071', word: 'employer', phonetic: '/ɪmˈplɔɪə(r)/', meaning: 'n. 雇主', sentence: 'The company will immediately act on these safety findings as a responsible employer.', notes: '作为负责任的雇主，公司将立即行动以处理这些安全问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N072', word: 'application', phonetic: '/ˌæplɪˈkeɪʃ(ə)n/', meaning: 'n. 申请', sentence: 'Please ensure you submit the application form before taking annual leave.', notes: '请在休年假前提交申请。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N073', word: 'protection', phonetic: '/prəˈtekʃ(ə)n/', meaning: 'n. 保护', sentence: 'We cannot allow the operators to run these machines without personal protection.', notes: '我们不允许操作员在没有个人防护的情况下运行这些机器。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N074', word: 'first article', phonetic: '/ˌfɜːst ˈɑːtɪk(ə)l/', meaning: '首件', sentence: 'The first article check is vital to ensure readiness for 4M1E before production.', notes: '首件检查对于确保生产前的 4M1E 是否准备好是至关重要的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N075', word: 'line balance', phonetic: '/laɪn ˈbæləns/', meaning: '线平衡', sentence: 'Focusing on line balance will help us increase production efficiency.', notes: '关注生产线平衡将有助于提高生产效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N076', word: 'training', phonetic: '/ˈtreɪnɪŋ/', meaning: 'n. 培训', sentence: 'All employees must undergo adequate training before commencing work.', notes: '所有员工在开始工作之前都接受充分的培训。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N077', word: 'success', phonetic: '/səkˈses/', meaning: 'n. 成功', sentence: 'The automation upgrade to this assembly line was a big success.', notes: '这条组装线的自动化升级是一个巨大的成功。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N078', word: 'drawing', phonetic: '/ˈdrɔːɪŋ/', meaning: 'n. 图纸', sentence: 'All products must be measured in accordance with the updated drawings.', notes: '所有产品必须按照更新的图纸进行测量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N079', word: 'support', phonetic: '/səˈpɔːt/', meaning: 'n. 支持', sentence: 'The OQC auditors have the full support of the General Manager and can reject finished goods if necessary.', notes: 'OQC 检查员得到总经理的全力支持，必要时可以拒收成品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N080', word: 'feedback', phonetic: '/ˈfiːdbæk/', meaning: 'n. 反馈', sentence: 'We appreciate your feedback on the proposal regarding headcount reduction.', notes: '请给我们关于减少人数的提案提供您的反馈意见。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N081', word: 'scrap', phonetic: '/skræp/', meaning: 'n. 报废', sentence: 'To reduce the scrap rate, it is essential to handle all semiproducts with care.', notes: '为了降低报废率，必须小心取放所有半成品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N082', word: 'environment', phonetic: '/ɪnˈvaɪrənmənt/', meaning: 'n. 环境', sentence: 'Our factory needs to store the chemicals properly to comply with the protection policies of the environment.', notes: '为了遵守环境保护政策，我们工厂需要妥善存储化学品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N083', word: 'flexibility', phonetic: '/ˌfleksəˈbɪləti/', meaning: 'n. 灵活性', sentence: 'A certain level of flexibility is required to implement the production plan.', notes: '实施生产计划需要一定程度的灵活性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N084', word: 'measures', phonetic: '/ˈmeʒəz/', meaning: 'n. 措施', sentence: 'We must take preventive measures to reduce the defective rate for this new product.', notes: '我们必须采取预防措施来降低这个新产品的不良率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N085', word: 'corrective action', phonetic: '/kəˈrektɪv ˈækʃn/', meaning: '纠正措施', sentence: 'To avoid further customer complaints, corrective actions must be taken immediately.', notes: '为了避免更多的客户投诉，必须立即采取纠正措施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N086', word: 'contribution', phonetic: '/ˌkɒntrɪˈbjuːʃ(ə)n/', meaning: 'n. 贡献', sentence: 'Thanks for your valuable contribution to this crossdepartment project.', notes: '感谢您对这个跨部门项目的宝贵贡献。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N087', word: 'requirement', phonetic: '/rɪˈkwaɪəmənt/', meaning: 'n. 要求', sentence: 'This new automatic line will meet all our requirements: quality, UPH, and stability.', notes: '新的自动线将满足我们所有的要求，如质量、UPH 和稳定性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N088', word: 'regulation', phonetic: '/ˌreɡjuˈleɪʃ(ə)n/', meaning: 'n. 规定 / 制度', sentence: 'All employees must comply with the attendance regulations.', notes: '所有员工必须遵守考勤制度。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N089', word: 'capability', phonetic: '/ˌkeɪpəˈbɪləti/', meaning: 'n. 能力', sentence: 'This factory\'s manufacturing capability can meet all your requirements.', notes: '这家工厂的制造能力可以满足您的所有要求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N090', word: 'consumption', phonetic: '/kənˈsʌmpʃ(ə)n/', meaning: 'n. 消耗', sentence: 'The electricity consumption was abnormal last month, so please investigate it to find out the root cause.', notes: '上个月的电力消耗不正常，请深入调查并找出根本原因。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N091', word: 'consumables', phonetic: '/kənˈsjuːməblz/', meaning: 'n. 耗材', sentence: 'The warehouse keepers need to monitor the consumables and ensure sufficient stock.', notes: '仓库管理员需要监控耗材并确保有足够的库存。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N092', word: 'fixed asset', phonetic: '/fɪkst ˈæset/', meaning: '固定资产', sentence: 'The depreciation of fixed assets must be considered when calculating the production cost.', notes: '计算生产成本时必须考虑固定资产的折旧。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N093', word: 'stationery', phonetic: '/ˈsteɪʃənri/', meaning: 'n. 文具', sentence: 'The production clerk will assist line leaders in ordering stationery twice per month.', notes: '生产文员将每月协助拉长订购两次文具。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N094', word: 'power supply', phonetic: '/ˈpaʊə(r) səˈplaɪ/', meaning: '电力供应 / 电源', sentence: 'Around 20% of the downtime last month was caused by a shortage in the power supply.', notes: '上个月约有 20% 的停机时间是由于电力供应不足造成的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N095', word: 'annual leave', phonetic: '/ˌænjuəl ˈliːv/', meaning: '年假', sentence: 'It would be better to devise a plan for your subordinates to take annual leave more evenly.', notes: '最好为你的下属制定一个更均衡的年假计划。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N096', word: 'standard', phonetic: '/ˈstændəd/', meaning: 'n. 标准', sentence: 'This batch of incoming components doesn’t meet acceptable standards, so we will reject it.', notes: '这批来料零件不符合接收标准，所以我们将拒收。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N097', word: 'demand', phonetic: '/dɪˈmɑːnd/', meaning: 'n. 需求', sentence: 'I suggest that we need to hire at least 30 workers to meet the sales demand next month.', notes: '我建议我们要至少请 30 名工人来满足下个月的销售需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N098', word: 'feasibility', phonetic: '/ˌfiːzəˈbɪləti/', meaning: 'n. 可行性', sentence: 'We should conduct a feasibility study before implementing the new layout of the production area.', notes: '在实施生产区域的新布局之前，我们应该进行可行性研究。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N099', word: 'industry', phonetic: '/ˈɪndəstri/', meaning: 'n. 工业 / 行业', sentence: 'Working in the automotive industry, having solid knowledge of the IATF16949 system helps us achieve more.', notes: '在汽车行业有扎实的 IATF16949 知识有助于我们取得更多成就。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N100', word: 'decision', phonetic: '/dɪˈsɪʒ(ə)n/', meaning: 'n. 决定', sentence: 'We need to make a decision regarding whether to invest in more automation or hire more workers.', notes: '我们需要做个决定，是增加自动化投入还是请更多工人。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N101', word: 'logistics', phonetic: '/ləˈdʒɪstɪks/', meaning: 'n. 物流', sentence: 'Some cost saving can be achieved by improving the logistics procedures.', notes: '通过改进物流程序，可以节约一些成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N102', word: 'promotion', phonetic: '/prəˈməʊʃ(ə)n/', meaning: 'n. 晋升 / 促销', sentence: 'Your promotion to Senior Engineer will be effective from next month.', notes: '你将晋升为高级工程师，从下个月开始生效。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N103', word: 'document', phonetic: '/ˈdɒkjumənt/', meaning: 'n. 文件', sentence: 'The DCC manages all controlled documents following the requirements of the ISO9001 system.', notes: '文控中心根据 ISO9001 体系的要求管理所有受控文件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N104', word: 'organization', phonetic: '/ˌɔːɡənaɪˈzeɪʃn/', meaning: 'n. 组织', sentence: 'This organization chart shows the personnel structure of operations management.', notes: '这张组织结构图展示了运营管理的人员结构。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N105', word: 'commitment', phonetic: '/kəˈmɪtmənt/', meaning: 'n. 承诺', sentence: 'Our company keeps a commitment to providing quality products at a reasonable price.', notes: '我们公司承诺以合理的价格提供优质产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N106', word: 'evaluation', phonetic: '/ɪˌvæljuˈeɪʃn/', meaning: 'n. 评估', sentence: 'We need to carry out a thorough evaluation of the new ERP system.', notes: '我们需要对新的 ERP 系统进行彻底的评估。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N107', word: 'challenge', phonetic: '/ˈtʃælɪndʒ/', meaning: 'n. 挑战', sentence: 'We are facing the biggest challenge of raw material shortages, so we must plan our production carefully.', notes: '我们面临的最大挑战是原料短缺，因此需要精心计划生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N108', word: 'layout', phonetic: '/ˈleɪaʊt/', meaning: 'n. 布局', sentence: 'The first task to set up the production floor is designing the detailed layout.', notes: '建立生产车间的首要任务是设计详细的布局。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N109', word: 'optimization', phonetic: '/ˌɒptɪmaɪˈzeɪʃən/', meaning: 'n. 优化', sentence: 'The first pass yield (FPY) is above 98% after the optimization of the machine’s parameters.', notes: '在对机器参数进行优化后，一次通过率超过了 98%。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N110', word: 'advantage', phonetic: '/ədˈvɑːntɪdʒ/', meaning: 'n. 优势', sentence: 'This upgraded model of the punching machine has several advantages over the previous models.', notes: '这款升级版冲压机相比以前的型号有一些优势。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N111', word: 'variation', phonetic: '/ˌveəriˈeɪʃ(ə)n/', meaning: 'n. 变异', sentence: 'Reducing variations in production processes is the key to ensuring stable output and quality.', notes: '减少生产过程中的变异是确保稳定产出和质量的关键。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N112', word: 'productivity', phonetic: '/ˌprɒdʌkˈtɪvəti/', meaning: 'n. 生产力', sentence: 'To compete with our rivals, we must maintain high manufacturing productivity levels.', notes: '为了与对手竞争，我们必须保持高水平的制造生产力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N113', word: 'investigation', phonetic: '/ɪnˌvestɪˈɡeɪʃ(ə)n/', meaning: 'n. 调查', sentence: 'The investigation continued for nearly a week to find out the root causes.', notes: '为了找出根本原因，调查持续了将近一周。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N114', word: 'sampling check', phonetic: '/ˈsɑːmplɪŋ tʃek/', meaning: '抽样检查', sentence: 'The goods inwards inspection conducts a sampling check based on a certain level of AQL.', notes: '货物入库检验按照一定水平的 AQL 进行抽样检查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N115', word: 'definition', phonetic: '/ˌdefɪˈnɪʃ(ə)n/', meaning: 'n. 定义', sentence: 'By definition, anything that customers won\'t pay for is waste, diminishing value to the customer and reducing profitability.', notes: '根据定义，顾客不愿意为其支付的任何东西都是浪费，它们降', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N116', word: 'waste', phonetic: '/weɪst/', meaning: 'n. 浪费', sentence: 'Lean management focuses on eliminating all waste in all value chain areas.', notes: '精益管理专注于消除价值链各个环节中的所有浪费。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N117', word: 'utilization', phonetic: '/ˌjuːtəlaɪˈzeɪʃn/', meaning: 'n. 利用', sentence: 'The engineering team is working on the project to increase the utilization rate of the key equipment.', notes: '工程团队正在努力提高关键设备的利用率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N118', word: 'satisfaction', phonetic: '/ˌsætɪsˈfækʃ(ə)n/', meaning: 'n. 满意', sentence: 'The first shipment of this new product was achieved to the customer\'s satisfaction.', notes: '这个新产品的第一批出货让顾客很满意。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N119', word: 'fluctuation', phonetic: '/ˌflʌktʃuˈeɪʃ(ə)n/', meaning: 'n. 波动', sentence: 'The fluctuation in POs from customers has become more and more unpredictable.', notes: '顾客订单的波动变得越来越不可预测。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N120', word: 'value', phonetic: '/ˈvæljuː/', meaning: 'n. 价值', sentence: 'One of the primary objectives of the lean management is to create value for customers.', notes: '精益管理的首要目标之一是为客户创造价值。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N121', word: 'resource', phonetic: '/rɪˈsɔːs/', meaning: 'n. 资源', sentence: 'Operations management uses resources to create outputs that fulfill defined market requirements.', notes: '运营管理利用各种资源来制造满足市场要求的产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N122', word: 'detail', phonetic: '/ˈdiːteɪl/', meaning: 'n. 细节', sentence: 'To thoroughly analyze the failures, a good quality engineer should have an eye for detail.', notes: '为了对失效进行彻底分析，一名优秀的质量工程师应该注重细节。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N123', word: 'assessment', phonetic: '/əˈsesmənt/', meaning: 'n. 评估', sentence: 'We have to make a quick assessment of the situation and make a decision to determine the labor plan for the next 3 months.', notes: '我们需快速评估当前情况，并决定未来 3 个月的劳动力计划。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N124', word: 'traceability', phonetic: '/ˌtreɪsəˈbɪləti/', meaning: 'n. 可追溯性', sentence: 'One of the main functions of the MES is complete traceability of every product.', notes: 'MES 的主要功能之一是对每个产品进行完整的追溯。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N125', word: 'knowledge', phonetic: '/ˈnɒlɪdʒ/', meaning: 'n. 知识', sentence: 'Every process engineer should have solid knowledge of industrial engineering.', notes: '每个工艺工程师都应该拥有扎实的工业工程知识。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N126', word: 'dimension', phonetic: '/daɪˈmenʃ(ə)n/', meaning: 'n. 尺寸', sentence: 'This carton box with dimensions of 300mm (L)* 250mm (W)*180mm (H) is suitable for our new product.', notes: '这个尺寸的纸箱 ( 长 300mm 宽 250mm 高 180mm) 适用于我们的新产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N127', word: 'forecast', phonetic: '/ˈfɔːkɑːst/', meaning: 'n. 预测', sentence: 'The main production plan is following the order forecast from our key customers.', notes: '主生产计划与我们的重要客户的订单预测相一致。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N128', word: 'approach', phonetic: '/əˈprəʊtʃ/', meaning: 'n. 方法', sentence: 'The company takes a positive approach to dealing with the headwind in the current uncertain economic circumstances.', notes: '公司采取积极的方法来应对当前不确定经济环境中的不利情况。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N129', word: 'achievement', phonetic: '/əˈtʃiːvmənt/', meaning: 'n. 成就', sentence: 'The annual appraisal focuses on your achievements in team building, KPIs, and continuous improvement.', notes: '年度评估会关注你在团队建设、KPI 和持续改进方面的成就。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N130', word: 'analysis', phonetic: '/əˈnæləsɪs/', meaning: 'n. 分析', sentence: 'A detailed analysis of the testing data is needed. Therefore, we can have a judgment on this new tester.', notes: '对测试数据进行详细分析是必不可少的。这样，我们可以对这', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N131', word: 'preparation', phonetic: '/ˌprepəˈreɪʃ(ə)n/', meaning: 'n. 准备', sentence: 'Safety training for new employees is a good preparation for their daily work.', notes: '为新员工提供安全培训是为他们的日常工作做准备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N132', word: 'calculation', phonetic: '/ˌkælkjuˈleɪʃ(ə)n/', meaning: 'n. 计算', sentence: 'A simple calculation cannot obtain the results of gage repeatability and reproducibility (GR&R).', notes: '测量重复性和再现性的结果不能通过简单的计算而获得。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N133', word: 'qualification', phonetic: '/ˌkwɒlɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 资质', sentence: 'We are looking for candidates with qualifications in lean management and the Six Sigma approach.', notes: '我们正在找在精益管理和六西格玛两方面有资质的候选人。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N134', word: 'investment', phonetic: '/ɪnˈvestmənt/', meaning: 'n. 投资', sentence: 'The investment proposal for these new machines will be approved if the payback period is less than 3 years.', notes: '如果投资回收期少于 3 年，新机器的投资提案将获得批准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N135', word: 'introduction', phonetic: '/ˌɪntrəˈdʌkʃn/', meaning: 'n. 导入 / 介绍', sentence: 'The quality engineers have to be involved in the details of process design during the new product introduction period.', notes: '质量工程师在新产品导入期间必须参与到过程设计细节中。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N136', word: 'budget', phonetic: '/ˈbʌdʒɪt/', meaning: 'n. 预算', sentence: 'The average weekly OT hours should be considered when we draw up the annual labor budget for next year.', notes: '在制定明年的劳动力预算时，应考虑每周的平均加班时间。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N137', word: 'proposal', phonetic: '/prəˈpəʊz(ə)l/', meaning: 'n. 提案', sentence: 'The equipment engineer is to put forward a new proposal for resolving the misalignment problem of the aged machine.', notes: '设备工程师将提出一项新提案，解决老机器对位不准问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N138', word: 'revenue', phonetic: '/ˈrevənjuː/', meaning: 'n.（营业）收入', sentence: 'The past year was a boom year for our company, with record sales revenue since 2010.', notes: '过去一年是公司繁荣的一年，销售收入创了 2010 年以来的记录。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N139', word: 'expertise', phonetic: '/ˌekspɜːˈtiːz/', meaning: 'n. 专业知识', sentence: 'It\'s a specialist job that requires expertise in both electronics and mechanics.', notes: '这是一项需要在电子和机械两方面都具备专业知识的工作。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N140', word: 'expectation', phonetic: '/ˌekspekˈteɪʃ(ə)n/', meaning: 'n. 期望', sentence: 'Your actual performance in the past six months exceeded my expectations. Thanks for your efforts.', notes: '过去六个月你的实际表现超出了我的期望。感谢你的努力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N141', word: 'committee', phonetic: '/kəˈmɪti/', meaning: 'n. 委员会', sentence: 'The health and safety committee will organize a fire drill this month end.', notes: '健康与安全委员会将在本月末组织一次消防演习。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N142', word: 'progress', phonetic: '/ˈprəʊɡres/', meaning: 'n. 进展', sentence: 'We are making good progress on the improvement of materials and WIPs handling.', notes: '我们在改善材料和在制品的搬运方面取得很好的进展。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N143', word: 'motivation', phonetic: '/ˌməʊtɪˈveɪʃ(ə)n/', meaning: 'n. 动力 / 激励', sentence: 'We need to implement an effective motivation scheme to encourage all employees to pursue continuous improvement.', notes: '我们需要实施有效的激励计划，鼓励所有员工持续改善。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N145', word: 'preventive action', phonetic: '/prɪˈventɪv ˈækʃ(ə)n/', meaning: '预防措施', sentence: 'To regain customer trust, we must implement preventive actions to eliminate this type of failure before this Friday.', notes: '为了重新赢得客户的信任，我们必须在本周五之前采取预防措', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N146', word: 'fast response', phonetic: '/ˌfɑːst rɪˈspɒns/', meaning: '快速响应', sentence: 'In the event of issues occurring in production areas, it is crucial to follow a procedure of fast response and escalation.', notes: '在生产区域出现问题时，遵照流程进行快速响应和问题升级非', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N148', word: 'guideline', phonetic: '/ˈɡaɪdlaɪn/', meaning: 'n. 指引', sentence: 'This workflow mapping provides essential guidelines to support you in your work.', notes: '这个工作流程图为您的工作供了必要的指引。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N149', word: 'elimination', phonetic: '/ɪˌlɪmɪˈneɪʃn/', meaning: 'n. 消除', sentence: 'We should adhere to RoHS requirements by using Pbfree materials for elimination of lead in these products.', notes: '我们应遵守 RoHS 要求，使用无铅材料消除这些产品中的铅。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N150', word: 'specification', phonetic: '/ˌspesɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 规格', sentence: 'These products were rejected by FQC due to noncompliance with the specifications.', notes: '这些产品由于不符合规格而被 FQC 拒收。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N151', word: 'deviation', phonetic: '/ˌdiːviˈeɪʃn/', meaning: 'n. 偏离 / 违背', sentence: 'Any deviation from the WIs must be reviewed and approved by the heads of Production, Engineering, and Quality.', notes: '与作业指导书不同的任何偏离须由生产、工程和质量部门的负', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N154', word: 'leadership', phonetic: '/ˈliːdəʃɪp/', meaning: 'n. 领导力', sentence: 'Strong leadership at the top management level is pivotal to successfully implementing lean production.', notes: '高层管理者强大的领导力对于成功实施精益生产至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N156', word: 'authority', phonetic: '/ɔːˈθɒrəti/', meaning: 'n. 授权 / 权威', sentence: 'Line-stop authority is not limited to the quality department; others can halt production when defined events occur.', notes: '停线权限不仅限于质量部门，其他人在特定事件发生时也可以', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N160', word: 'measurement', phonetic: '/ˈmeʒəmənt/', meaning: 'n. 测量（结果）', sentence: 'By utilizing the new CMM, we can obtain more accurate measurements for this plastic part.', notes: '通过使用新三次元，我们可获得这个塑料零件更准确的测量结果。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N163', word: 'strategy', phonetic: '/ˈstrætədʒi/', meaning: 'n. 战略 / 策略', sentence: 'Based on the company’s strategy, our production capacity will triple by the end of next year.', notes: '根据公司的战略，我们的生产能力将在明年年底翻三倍。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N164', word: 'benefit', phonetic: '/ˈbenɪfɪt/', meaning: 'n. 好处', sentence: 'In this way, both the warehouse and production lines will get maximum benefit from the process of material handover.', notes: '用这种方法进行物料交接，仓库和生产线都将获得最大好处。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N166', word: 'operation', phonetic: '/ˌɒpəˈreɪʃ(ə)n/', meaning: 'n. 操作 / 运作', sentence: 'The operation of the machinery requires well-trained operators.', notes: '这些设备的操作需要经过良好培训的操作员。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N168', word: 'manufacturer', phonetic: '/ˌmænjuˈfæktʃərə(r)/', meaning: 'n. 制造商', sentence: 'The manufacturer of this product is known for their highquality standards.', notes: '这个产品的制造商以其高质量标准而闻名。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N170', word: 'infrastructure', phonetic: '/ˈɪnfrəstrʌktʃə(r)/', meaning: 'n. 基础设施', sentence: 'The updated HR system is designed to seamlessly integrate with the current organizational chart and infrastructure.', notes: '更新的人力资源系统旨在与当前组织结构和基础设施无缝集成。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N176', word: 'concept', phonetic: '/ˈkɒnsept/', meaning: 'n. 概念 / 理念', sentence: 'The concept of lean manufacturing focuses on minimizing waste.', notes: '精益制造的概念侧重于减少浪费。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N177', word: 'experience', phonetic: '/ɪkˈspɪəriəns/', meaning: 'n. 经验 / 经历', sentence: 'Our team has extensive experience in optimizing production processes.', notes: '我们团队在优化生产流程方面经验丰富。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N178', word: 'reduction', phonetic: '/rɪˈdʌkʃ(ə)n/', meaning: 'n. 减少', sentence: 'We achieved a significant reduction in production costs through these CI projects.', notes: '我们通过这些持续改进项目实现了生产成本的大幅降低。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N180', word: 'cost saving', phonetic: '/ˈkɒst ˌseɪvɪŋ/', meaning: '节约成本', sentence: 'Implementing this new technology will lead to substantial cost savings.', notes: '实施这项新技术将带来可观的成本节约。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N182', word: 'interview', phonetic: '/ˈɪntəvjuː/', meaning: 'n. 面试 / 会见', sentence: 'We will conduct interviews to hire qualified candidates for the production team.', notes: '我们将进行面试以聘请合格的生产团队候选人。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N184', word: 'priority', phonetic: '/praɪˈɒrəti/', meaning: 'n. 优先事项', sentence: 'Ensuring product quality is our top priority.', notes: '确保产品质量是我们的首要任务。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N187', word: 'effort', phonetic: '/ˈefət/', meaning: 'n. 努力', sentence: 'We need everyone\'s effort to achieve our production targets.', notes: '为了实现我们的生产目标，需要大家的共同努力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N188', word: 'element', phonetic: '/ˈelɪmənt/', meaning: 'n. 要素', sentence: 'Each element of the production process needs to be optimized for efficiency.', notes: '生产过程的每个要素都需要优化以提高效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N189', word: 'experiment', phonetic: '/ɪkˈsperɪmənt/', meaning: 'n. 实验', sentence: 'We will conduct experiments in the laboratory to test new product formulations.', notes: '我们将在实验室中进行实验，测试新产品配方。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N192', word: 'awareness', phonetic: '/əˈweənəs/', meaning: 'n. 意识', sentence: 'Increasing safety awareness is a priority in our factory.', notes: '提高安全意识是我们工厂的优先事项。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N193', word: 'property', phonetic: '/ˈprɒpəti/', meaning: 'n. 财产', sentence: 'Protecting intellectual property is crucial in the manufacturing industry.', notes: '在制造业中，保护知识产权至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N194', word: 'situation', phonetic: '/ˌsɪtʃuˈeɪʃ(ə)n/', meaning: 'n. 情况', sentence: 'We need to assess the current situation to identify areas for improvement.', notes: '我们需要评估当前情况，以确定改进的领域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N195', word: 'frequency', phonetic: '/ˈfriːkwənsi/', meaning: 'n. 频率', sentence: 'The frequency of quality inspections has been increased to ensure product consistency.', notes: '为了确保产品一致性，已增加质量检查的频率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N196', word: 'description', phonetic: '/dɪˈskrɪpʃn/', meaning: 'n. 描述', sentence: 'The R&D team needs to provide a detailed description of the product specifications for manufacturing.', notes: '研发团队需要为制造提供产品规格的详细描述。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N197', word: 'assistance', phonetic: '/əˈsɪstəns/', meaning: 'n. 协助 / 援助', sentence: 'We appreciate the assistance provided by our suppliers during production.', notes: '我们感谢供应商在生产过程中提供的援助。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N198', word: 'role model', phonetic: '/ˈrəʊl ˌmɒd(ə)l/', meaning: '榜样', sentence: 'Our goal is to be a role model for sustainable manufacturing practices.', notes: '我们的目标是成为可持续制造实践的榜样。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N199', word: 'innovation', phonetic: '/ˌɪnəˈveɪʃ(ə)n/', meaning: 'n. 创新', sentence: 'Innovation is crucial for staying ahead of the competition in the manufacturing industry.', notes: '创新对于在制造业中保持领先地位至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N200', word: 'disposal', phonetic: '/dɪˈspəʊz(ə)l/', meaning: 'n. 处理', sentence: 'Proper disposal of waste materials is crucial to minimize environmental impact.', notes: '妥善处理废料对于减少环境影响至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N201', word: 'energy', phonetic: '/ˈenədʒi/', meaning: 'n. 能源 / 能量', sentence: 'Implementing energy-saving measures is important for sustainable manufacturing practices.', notes: '我实施节能措施对于可持续制造实践很重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N202', word: 'spare part', phonetic: '/ˈspeə(r) ˌpɑːt/', meaning: '备件', sentence: 'We need a certain level of spare parts to minimize downtime in case of equipment failure.', notes: '为了在设备故障时减少停机时间，我们需要一定量的备件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N203', word: 'confidence', phonetic: '/ˈkɒnfɪdəns/', meaning: 'n. 信心', sentence: 'Having confidence in our products\' quality is vital for customer satisfaction and company reputation.', notes: '对我们产品质量的信心对于客户满意和公司声誉至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },

  { id: 'vocab_N206', word: 'expenditure', phonetic: '/ɪkˈspendɪtʃə(r)/', meaning: 'n. 支出', sentence: 'We need to carefully manage our expenditures to control costs.', notes: '我们需要精心管理开支以控制成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N207', word: 'variety', phonetic: '/vəˈraɪəti/', meaning: 'n. 多样化', sentence: 'Our product line offers a variety of options to meet the preferences of different customers.', notes: '我们的产品系列提供各种选项，以满足不同客户的需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N208', word: 'pressure', phonetic: '/ˈpreʃə(r)/', meaning: 'n. 压力', sentence: 'The pressure to meet production targets is high, but we are confident in our team\'s abilities.', notes: '满足生产目标的压力很大，但我们对团队的能力充满信心。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N209', word: 'profit', phonetic: '/ˈprɒfɪt/', meaning: 'n. 利润', sentence: 'Our goal is to increase profit by optimizing our manufacturing processes.', notes: '通过优化制造过程，我们的目标是增加利润。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N210', word: 'fabrication', phonetic: '/ˌfæbrɪˈkeɪʃ(ə)n/', meaning: 'n. 制作', sentence: 'The fabrication of this component requires precise measurements and skilled craftsmanship.', notes: '该组件的制作需要精确的测量和熟练的工艺。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N211', word: 'workflow', phonetic: '/ˈwɜːkfləʊ/', meaning: 'n. 工作流程', sentence: 'Streamlining the workflow will help improve efficiency in the production line.', notes: '优化工作流程将有助于提高生产线的效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N212', word: 'discrepancy', phonetic: '/dɪˈskrepənsi/', meaning: 'n. 差异', sentence: 'Any discrepancy in the manufacturing process needs to be addressed in time and resolved thoroughly.', notes: '制造过程中的任何差异都需要及时处置和彻底解决。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N213', word: 'duration', phonetic: '/djuˈreɪʃn/', meaning: 'n. 持续 ( 时间 )', sentence: 'The duration of each production cycle depends on the product\'s complexity and the processes\' efficiency.', notes: '每个生产周期的持续时间取决于产品复杂性和生产流程的效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N214', word: 'constraint', phonetic: '/kənˈstreɪnt/', meaning: 'n. 约束 / 限制', sentence: 'Budget constraints to effective operations require careful resource allocation and cost control.', notes: '对高效运营的预算限制需要精心分配资源和成本控制。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N215', word: 'explanation', phonetic: '/ˌekspləˈneɪʃ(ə)n/', meaning: 'n. 解释', sentence: 'A clear explanation of the manufacturing steps is essential for training new employees.', notes: '清楚解释制造步骤对于培训新员工来说是必不可少的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N216', word: 'characteristic', phonetic: '/ˌkærəktəˈrɪstɪk/', meaning: 'n. 特征', sentence: 'Understanding the characteristics of raw materials is important for process design and quality control.', notes: '了解原材料的特征对于工艺设计和质量控制很重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N217', word: 'judgement', phonetic: '/ˈdʒʌdʒmənt/', meaning: 'n. 判断', sentence: 'Good judgement from the Production Planner is necessary when making decisions that impact production priorities.', notes: '生产计划员在做影响生产先后顺序的决策时需要明智的判断。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N218', word: 'variable', phonetic: '/ˈveəriəb(ə)l/', meaning: 'n. 变量', sentence: 'Managing variables in the production process is important to maintain consistency.', notes: '管理生产过程中的变量对于保持一致性很重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N219', word: 'durability', phonetic: '/ˌdjʊərəˈbɪləti/', meaning: 'n. 耐久性', sentence: 'The durability of our products ensures customer satisfaction and trust in our brand.', notes: '我们产品的耐久性确保客户满意度和对我们品牌的信任。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N220', word: 'recovery', phonetic: '/rɪˈkʌvəri/', meaning: 'n. 恢复', sentence: 'Creating a robust recovery plan is essential to minimize downtime in accidental situations.', notes: '制定全面的恢复计划对发生意外时最大程度减少停机非常重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N221', word: 'availability', phonetic: '/əˌveɪləˈbɪləti/', meaning: 'n. 可用性', sentence: 'It is crucial for uninterrupted production to ensure the availability of raw materials and right equipment.', notes: '确保原材料和正确设备的可用性对于不间断生产至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N222', word: 'attitude', phonetic: '/ˈætɪtjuːd/', meaning: 'n. 态度', sentence: 'Maintaining a positive attitude contributes to a productive and harmonious work environment.', notes: '保持积极的态度有助于高产与和谐的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N223', word: 'detection', phonetic: '/dɪˈtekʃ(ə)n/', meaning: 'n. 探测 / 发现', sentence: 'Early detection of defects helps prevent quality issues in the final product.', notes: '早期发现缺陷有助于预防最终产品质量问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N224', word: 'individual', phonetic: '/ˌɪndɪˈvɪdʒuəl/', meaning: 'n. 个体', sentence: 'Each individual in this cross-functional team has unique skills and contributes to the overall success.', notes: '这个跨部门团队中每个人都有独特技能，为整体成功做出贡献。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N225', word: 'perspective', phonetic: '/pəˈspektɪv/', meaning: 'n. 视角', sentence: 'As a manager, considering different perspectives during decision-making leads to better outcomes.', notes: '作为管理者，在决策过程中从不同视角考虑可带来更好的结果。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N226', word: 'acceptance', phonetic: '/əkˈseptəns/', meaning: 'n. 接受 / 认可', sentence: 'It requires effective communication to achieve acceptance of a new performance appraisal system.', notes: '让大家认可一个新的绩效评估系统需要有效的沟通。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N227', word: 'proportion', phonetic: '/prəˈpɔːʃ(ə)n/', meaning: 'n. 比例', sentence: 'It is key for the consistent quality to ensure the right proportion of the two different liquids of this compound.', notes: '确保混合物中两种不同液体的正确比例是保持质量一致的关键。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N228', word: 'staff', phonetic: '/stɑːf/', meaning: 'n.( 全体 ) 员工', sentence: 'We assigned dedicated staff to monitor the details of the entire PPAP build and report the findings in the timely manner.', notes: '我们安排了专职人员来监控整个 PPAP 的细节，并及时报告问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N229', word: 'consequence', phonetic: '/ˈkɒnsɪkwəns/', meaning: 'n. 结果 / 后果', sentence: 'Understanding the consequence of quality defects motivates us to strive for excellence.', notes: '了解质量缺陷的后果激励我们追求卓越。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N230', word: 'emphasis', phonetic: '/ˈemfəsɪs/', meaning: 'n. 强调 / 重要性', sentence: 'There has been a shift of emphasis from chasing low cost to exceeding customer expectations.', notes: '重点已经发生转变，不再追求低成本，而是超越顾客的期望。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N231', word: 'prototype', phonetic: '/ˈprəʊtətaɪp/', meaning: 'n. 原型 / 样机', sentence: 'We are developing a prototype for a new product design.', notes: '我们正在开发一个新产品设计的原型。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N232', word: 'assurance', phonetic: '/əˈʃʊərəns/', meaning: 'n. 保证', sentence: 'In our factory, quality assurance procedures are implemented strictly to ensure product reliability.', notes: '在工厂里，我们严格执行质保程序以确保产品的可靠性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N233', word: 'focus', phonetic: '/ˈfəʊkəs/', meaning: 'n. 重点 / 关注点', sentence: 'Our primary focus is on consistently delivering high-quality, reliable and innovative products that exceed customer expectations.', notes: '我们的主要关注点是持续提供高质量、可靠和创新的产品，超', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N234', word: 'demonstration', phonetic: '/ˌdemənˈstreɪʃ(ə)n/', meaning: 'n. 演示 / 展示', sentence: 'Providing a comprehensive demonstration of our manufacturing capabilities helps us win new clients.', notes: '全面展示我们的制造能力有助于赢得新客户。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N235', word: 'consistency', phonetic: '/kənˈsɪstənsi/', meaning: 'n. 一致性', sentence: 'Consistency in quality control processes ensures that every product leaving the factory meets the customer acceptance criteria.', notes: '保持质量控制流程的一致性，确保离开工厂的每个产品都符合', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N236', word: 'exhaust', phonetic: '/ɪɡˈzɔːst/', meaning: 'n. 排气', sentence: 'Based on the regulations, proper exhaust systems have to be installed to maintain a safe and healthy work environment.', notes: '根据规定，必须安装适当的排气系统以维持一个安全和健康的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N237', word: 'producer', phonetic: '/prəˈdjuːsə(r)/', meaning: 'n. 生产者', sentence: 'As a producer, we are committed to delivering innovative and reliable products.', notes: '作为生产商，我们致力于提供创新和可靠的产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N238', word: 'integration', phonetic: '/ˌɪntɪˈɡreɪʃ(ə)n/', meaning: 'n. 整合', sentence: 'Integration of robotics and automation systems optimizes production processes and improves overall efficiency in the factory.', notes: '机器人和自动化系统的整合优化工厂生产流程，提高整体效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N239', word: 'classification', phonetic: '/ˌklæsɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 分类', sentence: 'Accurate classification of raw materials and products helps streamline inventory management.', notes: '准确地对原材料和产品分类有助于简化库存管理。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N240', word: 'problem-solving', phonetic: '/ˈprɒbləm sɒlvɪŋ/', meaning: 'n. 解决问题', sentence: 'For process engineers, effective problem-solving skills are necessary to address production challenges.', notes: '对于工艺工程师来说，有效的解决问题的能力对于应对生产中的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N241', word: 'enhancement', phonetic: '/ɪnˈhɑːnsmənt/', meaning: 'n. 增强 / 改进', sentence: 'Continuous enhancement of our manufacturing processes is essential for staying competitive.', notes: '持续改进我们的制造过程对于保持竞争力至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N242', word: 'decision-making', phonetic: '/dɪˈsɪʒn meɪkɪŋ/', meaning: 'n. 决策', sentence: 'Effective decision-making plays a pivotal role in optimizing production schedules and resource allocation in the factory.', notes: '有效决策在工厂生产计划和资源分配的优化中起关键作用。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N243', word: 'statistics', phonetic: '/stəˈtɪstɪks/', meaning: 'n. 统计', sentence: 'Analyzing statistics helps identify areas for improvement in the production line.', notes: '分析统计数据有助于确定生产线上的改进领域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
