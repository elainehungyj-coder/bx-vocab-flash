  { id: 'vocab_N505', word: 'manner', phonetic: '/ˈmænə(r)/', meaning: 'n. 方式', sentence: 'The operators were trained to operate the equipment in a safe and efficient manner.', notes: '操作员接受培训，学习如何以安全高效的方式操作设备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N506', word: 'item', phonetic: '/ˈaɪtəm/', meaning: 'n. 物品', sentence: 'A barcode system is used to track the movement of items throughout the manufacturing process.', notes: '条形码系统用于跟踪整个制造过程中物品的移动。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N507', word: 'coordinator', phonetic: '/kəʊˈɔːdɪneɪtə(r)/', meaning: 'n. 协调员', sentence: 'Our coordinator plays a key role in managing communication between suppliers, workers, and management.', notes: '我们的协调员在管理供应商、工人和管理层之间的沟通中扮演', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N508', word: 'sponsor', phonetic: '/ˈspɒnsə(r)/', meaning: 'n. 赞助者', sentence: 'Our sponsor\'s financial support has allowed us to invest in advanced technology for production.', notes: '赞助者的财务支持使我们得以投资于先进技术用于生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N509', word: 'champion', phonetic: '/ˈtʃæmpiən/', meaning: 'n. 拥护者 / 冠军', sentence: 'The team leader acts as a champion for implementing quality control measures on the assembly line.', notes: '团队领导是实施装配线上质量控制措施的拥护者。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N510', word: 'black belt', phonetic: '/ˈblæk belt/', meaning: '（六西格玛）黑带', sentence: 'Employees who achieve the black belt certification are experts in process improvement and problem-solving.', notes: '获得黑带认证的员工是流程改进和问题解决方面的专家。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N511', word: 'green belt', phonetic: '/ˈɡriːn belt/', meaning: '（六西格玛）绿带', sentence: 'The green belt trainees are learning lean manufacturing principles to optimize production processes.', notes: '绿带学员正在学习精益生产原则以用于优化生产流程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N512', word: 'transformation', phonetic: '/ˌtrænsfəˈmeɪʃ(ə)n/', meaning: 'n. 转型 / 转变', sentence: 'Continuous improvement initiatives are driving the transformation of our production lines to meet market demands.', notes: '持续改进举措正推动我们生产线的转型，以满足市场需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N513', word: 'interruption', phonetic: '/ˌɪntəˈrʌpʃ(ə)n/', meaning: 'n. 中断', sentence: 'The unexpected power outage caused a significant interruption in our production process, resulting in downtime.', notes: '意外停电导致我们生产过程大量中断，产生很多停工时间。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N514', word: 'factor', phonetic: '/ˈfæktə(r)/', meaning: 'n. 因素', sentence: 'The availability of raw materials is a critical factor in determining the production output.', notes: '原材料的可用性是决定生产产量的关键因素之一。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N515', word: 'delay', phonetic: '/dɪˈleɪ/', meaning: 'n. 延迟', sentence: 'The unexpected machine breakdown caused a significant delay in meeting production deadlines.', notes: '意外机器故障导致严重延迟，无法按时完成生产任务。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N516', word: 'reference', phonetic: '/ˈrefrəns/', meaning: 'n. 参考', sentence: 'Engineers often consult IPC standards as a reference when designing new manufacturing processes.', notes: '工程师在设计新的生产流程时经常参考 IPC 标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N517', word: 'checklist', phonetic: '/ˈtʃeklɪst/', meaning: 'n. 检查表', sentence: 'Each machine operator is required to complete a safety checklist before starting their shift.', notes: '每个机器操作员在开班生产前都要用检查表进行安全检查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N518', word: 'auditor', phonetic: '/ˈɔːdɪtə(r)/', meaning: 'n. 审核员', sentence: 'The internal auditor reviewed the company\'s manufacturing operations to ensure compliance with the ISO9001 requirements.', notes: '内审员审核公司制造运作情况，以确保符合 ISO9001 要求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N519', word: 'error proofing', phonetic: '/ˈerə(r) ˌpruːfɪŋ/', meaning: '防错', sentence: 'Implementing error-proofing techniques in the assembly line helps prevent defects and improve product quality.', notes: '在装配线上实施防错技术有助于预防缺陷并提高产品质量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N520', word: 'leveling', phonetic: '/ˈlev(ə)lɪŋ/', meaning: 'n. 均衡', sentence: 'Implementing schedule leveling strategies minimizes fluctuations in production and optimizes resource utilization.', notes: '实施均衡排产方案可以减少生产波动并优化资源利用。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N521', word: 'torque', phonetic: '/tɔːk/', meaning: 'n. 扭矩', sentence: 'The process engineer adjusted the torque settings to ensure proper fastening of components.', notes: '工艺工程师调整了扭矩设置以确保零部件正确固定。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N522', word: 'punctuality', phonetic: '/ˌpʌŋktʃuˈæləti/', meaning: 'n. 准时性', sentence: 'The assembly line workers must adhere to strict punctuality to avoid production delays.', notes: '装配线工人被要求严格遵守守时规定，以避免生产延迟。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N523', word: 'six sigma', phonetic: '/sɪks ˈsɪɡmə/', meaning: '六西格玛', sentence: 'Six Sigma focuses on reducing process variation and enhancing process control, which can significantly reduce defects in production lines.', notes: '六西格玛方法专注于减少过程变异和增强过程控制，这可以显著减少', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N524', word: 'range', phonetic: '/reɪndʒ/', meaning: 'n. 范围', sentence: 'The new machine has a wide range of capabilities, allowing for increased stability and efficiency.', notes: '新机器具有广泛的性能范围，可提高稳定性和效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N525', word: 'fault', phonetic: '/fɔːlt/', meaning: 'n. 故障 / 错误', sentence: 'The production line was halted due to a fault in the conveyor belt system.', notes: '由于传送带系统出现故障，生产线被迫停工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N526', word: 'fiscal year', phonetic: '/ˈfɪsk(ə)l ˈjɪə(r)/', meaning: '财政年度', sentence: 'Planning for capital investments in new equipment is a key part of the fiscal year budgeting process.', notes: '规划对新设备的投资是财政年度预算过程的关键部分。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N527', word: 'probability', phonetic: '/ˌprɒbəˈbɪləti/', meaning: 'n. 概率', sentence: 'The probability of a machine breakdown increases with age and lack of maintenance.', notes: '机器故障的概率随着使用年限的增长和缺乏维护而增加。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N528', word: 'occurrence', phonetic: '/əˈkʌrəns/', meaning: 'n..( 事件 ) 发生', sentence: 'An unexpected occurrence of a chemical spill required immediate evacuation from the production facility.', notes: '发生了化学品泄漏意外，需立即将人员从生产区疏散出去。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N529', word: 'research', phonetic: '/rɪˈsɜːtʃ /', meaning: 'n. 研究', sentence: 'Ongoing research on automation systems aims to streamline the assembly workflow.', notes: '对自动化系统进行的持续研究旨在简化装配工作流程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N530', word: 'practice', phonetic: '/ˈpræktɪs/', meaning: 'n. 实践 / 做法', sentence: 'Regular safety training and fire drills are common practices in the factory to prevent accidents and minimize potential loss.', notes: '为了防止事故并使潜在损失最小化，在工厂中定期进行安全培', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N531', word: 'network', phonetic: '/ˈnetwɜːk/', meaning: 'n. 网络', sentence: 'The company\'s global network of distributors ensures efficient delivery of products worldwide.', notes: '公司在全球的经销商网络确保产品在全球范围内高效交付。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N532', word: 'risk', phonetic: '/rɪsk/', meaning: 'n. 风险', sentence: 'Manufacturers are implementing risk management strategies to address uncertainties in raw material prices.', notes: '制造商正在实施风险管理策略，以应对原材料价格方面的不', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N533', word: 'summary', phonetic: '/ˈsʌməri/', meaning: 'n. 总结', sentence: 'The supervisor gave a summary of the achievements and issues on the previous day before starting production.', notes: '主管在开始生产之前简要总结了前一天的成绩和问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N534', word: 'assumption', phonetic: '/əˈsʌmpʃn/', meaning: 'n. 假设', sentence: 'The pilot run revealed that the initial assumption about production efficiency was incorrect.', notes: '试产显示出最初关于生产效率的假设是错误的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N535', word: 'lack', phonetic: '/læk/', meaning: 'n. 缺乏', sentence: 'Poor planning resulted in a lack of raw materials for the delivery of some urgent orders at the month\'s end.', notes: '糟糕的计划导致月底一些紧急订单因原料不足而影响交付。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N536', word: 'throughput', phonetic: '/ˈθruːpʊt/', meaning: 'n. 生产量', sentence: 'A bottleneck in the assembly line was identified as the cause of decreased throughput.', notes: '装配线中的瓶颈工序是导致生产量下降的原因之一。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N537', word: 'spreadsheet', phonetic: '/ˈspredʃiːt/', meaning: 'n. 电子表格', sentence: 'A customized spreadsheet was created to calculate the cost of production for each product.', notes: '一个定制化的电子表格用于计算每种产品的生产成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N538', word: 'simulation', phonetic: '/ˌsɪmjuˈleɪʃ(ə)n/', meaning: 'n. 模拟', sentence: 'A simulation was conducted to test different scenarios and identify potential bottlenecks for this new product.', notes: '对新产品进行不同情景的模拟测试，识别可能存在的瓶颈。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N539', word: 'importance', phonetic: '/ɪmˈpɔːt(ə)ns/', meaning: 'n. 重要性', sentence: 'The importance of meeting deadlines was emphasized to ensure timely delivery of products to customers.', notes: '强调遵守截止日期的重要性，确保及时将产品交付给客户。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N540', word: 'topic', phonetic: '/ˈtɒpɪk/', meaning: 'n. 话题', sentence: 'The meeting agenda included a discussion on the topic of implementing automation in the factory.', notes: '会议议程包括讨论在工厂中实施自动化技术这个话题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N541', word: 'chapter', phonetic: '/ˈtʃæptə(r)/', meaning: 'n. 篇章', sentence: 'The acquisition of a competitor signaled the beginning of a new chapter in the industry landscape.', notes: '收购竞争对手标志着公司在行业格局中一个新篇章的开始。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N542', word: 'stage', phonetic: '/steɪdʒ/', meaning: 'n. 阶段', sentence: 'The prototype is currently in the testing stage before sending to the customer for final confirmation.', notes: '该原型目前处于测试阶段，待发送给客户进行最终确认。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N543', word: 'phase', phonetic: '/feɪz/', meaning: 'n. 阶段', sentence: 'This project is currently in the planning phase, with production scheduled to start next month.', notes: '该项目目前处于规划阶段，预计下个月开始生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N544', word: 'stakeholder', phonetic: '/ˈsteɪkhəʊldə(r)/', meaning: 'n. 利益相关者', sentence: 'Engaging with stakeholders helps to ensure that the manufacturing process meets the needs and expectations of all parties involved.', notes: '利益相关者的参与有助于确保制造过程满足所有参与方的需求和期', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N645', word: 'similarity', phonetic: '/ˌsɪməˈlærəti/', meaning: 'n. 相似性', sentence: 'Analyzing data on product performance can reveal similarities across different production lines.', notes: '分析产品性能数据可以揭示不同生产线之间的相似性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N546', word: 'routing', phonetic: '/ˈruːtɪŋ/', meaning: 'n. 路径规划', sentence: 'Engineers are constantly analyzing and improving product routing to enhance workflow.', notes: '工程师们不断分析和改进产品路径规划以改善生产流程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N547', word: 'initiative', phonetic: '/ɪˈnɪʃətɪv/', meaning: 'n. 措施 / 主动性', sentence: 'Employees are encouraged to take the initiative in suggesting improvements to the production process.', notes: '鼓励员工主动提出改进生产流程的建议。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N548', word: 'perception', phonetic: '/pəˈsepʃ(ə)n/', meaning: 'n. 认知', sentence: 'The company\'s reputation for high-quality products has shaped consumer perception of its brand.', notes: '公司以高质量产品闻名，这塑造了消费者对其品牌的认知。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N549', word: 'relation', phonetic: '/rɪˈleɪʃ(ə)n/', meaning: 'n. 关系', sentence: 'The company values its long-term client relations and strives to meet their needs.', notes: '公司重视与客户的长期关系，并努力满足其特定需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N550', word: 'ratio', phonetic: '/ˈreɪʃiəʊ/', meaning: 'n. 比率', sentence: 'The company aims to improve the ratio of output to energy consumption through sustainable practices.', notes: '公司旨在通过可持续行动以提高产出与能源消耗的比率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N551', word: 'firm', phonetic: '/fɜːm/', meaning: 'n. 企业', sentence: 'The firm specializes in the production of precision components for the aerospace industry.', notes: '该企业专门从事航空航天行业精密零部件生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N552', word: 'content', phonetic: '/ˈkɒntent/', meaning: 'n. 内容', sentence: 'Regular audits are conducted to verify the accuracy and completeness of content in manufacturing documentation.', notes: '定期审核以验证制造文件中内容的准确性和完整性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N553', word: 'warranty', phonetic: '/ˈwɒrənti/', meaning: 'n. 保修', sentence: 'The warranty does not cover damages caused by improper use or neglectful handling.', notes: '保修不包括由不当使用或疏忽处置引起的损坏。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N554', word: 'vehicle', phonetic: '/ˈviːəkl/', meaning: 'n. 车辆', sentence: 'The company invested in a fleet of automatic guided vehicles (AGVs) to improve productivity and reduce manual labor.', notes: '公司投资购买一批自动引导车（AGV）以提高生产效率并减少劳', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N555', word: 'carrier', phonetic: '/ˈkæriə(r)/', meaning: 'n. 载具', sentence: 'This factory uses a specialized carrier to transport fragile or sensitive components during manufacturing.', notes: '该工厂使用专用载具在制造过程中运输易碎或敏感组件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N556', word: 'boundary', phonetic: '/ˈbaʊndri/', meaning: 'n. 边界', sentence: 'Clear boundaries are marked on the factory floor to designate different work areas for production processes.', notes: '在工厂地面上标明清晰边界，指定不同生产流程工作区域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N557', word: 'field', phonetic: '/fiːld/', meaning: 'n. 领域 / 现场', sentence: 'The quality control team conducts inspections in the field to ensure products meet standards before distribution.', notes: 'QC 团队在现场进行检查，以确保产品在发货前符合标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N558', word: 'consignee', phonetic: '/ˌkɒnsaɪˈniː/', meaning: 'n. 收货人', sentence: 'The consignee\'s contact information is crucial for coordinating the shipment and delivery of manufactured goods.', notes: '收货人的联系信息对协调制造商品的装运和交付至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N559', word: 'segment', phonetic: '/ˈseɡmənt/', meaning: 'n. 部分', sentence: 'Each segment of the assembly line is responsible for a specific task in the production of the final product.', notes: '流水线的各个部分负责最终产品生产中的特定任务。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N560', word: 'commerce', phonetic: '/ˈkɒmɜːs/', meaning: 'n. 商业', sentence: 'Developing strong relationships with key partners is vital for manufacturers looking to expand their presence in global commerce.', notes: '与关键合作伙伴建立牢固关系对于希望扩大全球商业版图的制造商至', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N561', word: 'diagnosis', phonetic: '/ˌdaɪəɡˈnəʊsɪs/', meaning: 'n. 诊断', sentence: 'The diagnosis of the machinery issue revealed a faulty component that needed immediate replacement.', notes: '对机器问题进行诊断发现了一个需要立即更换的故障零件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N562', word: 'dispute', phonetic: '/dɪˈspjuːt/', meaning: 'n. 争议', sentence: 'Effective communication and clear agreements can help prevent disputes among team members on the production floor.', notes: '有效沟通和明确的协商一致有助于防止生产现场团队成员之', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N563', word: 'license', phonetic: '/ˈlaɪs(ə)ns/', meaning: 'n. 许可证', sentence: 'The manufacturer faced penalties for operating without a proper license from the environmental regulatory authority.', notes: '该制造商因未取得环境监管机构的合法许可证而面临处罚。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N564', word: 'subsidy', phonetic: '/ˈsʌbsədi/', meaning: 'n. 补贴', sentence: 'The government provided a subsidy to high-tech companies to promote growth and innovation.', notes: '政府向高科技公司提供补贴以促进它们成长和创新。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N565', word: 'subsidiary', phonetic: '/səbˈsɪdiəri/', meaning: 'n. 子公司', sentence: 'Each subsidiary operates independently but follows the overall production strategy set by the parent company.', notes: '每个子公司都独立运作，但遵循母公司定的整体生产策略。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N566', word: 'repair', phonetic: '/rɪˈpeə(r)/', meaning: 'n. 修理', sentence: 'Regular inspections can identify potential repair needs before they become major issues.', notes: '定期检查能在出现重大问题之前识别出潜在的维修需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N567', word: 'rework', phonetic: '/ˈriːˌwɜːk/', meaning: 'n. 重做 / 返工', sentence: 'The rework rate has been steadily decreasing over the past few months.', notes: '过去几个月里，返工率已经逐步下降。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N568', word: 'customization', phonetic: '/ˌkʌstəmaɪˈzeɪʃən/', meaning: 'n. 定制', sentence: 'The company offers extensive customization options to meet the diverse needs of customers.', notes: '该公司提供广泛的定制选项，以满足客户的多样化需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N569', word: 'stimulation', phonetic: '/ˌstɪmjuˈleɪʃ(ə)n/', meaning: 'n. 激励 / 刺激', sentence: 'Employee motivation and job satisfaction are often driven by stimulation in the workplace.', notes: '工作场所的激励通常会驱动员工积极性和提高工作满意度。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N570', word: 'uniform', phonetic: '/ˈjuːnɪfɔːm/', meaning: 'n. 制服', sentence: 'The company provides uniforms to its employees for safety and identification purposes.', notes: '公司为员工提供制服，以确保安全和识别身份。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N571', word: 'promise', phonetic: '/ˈprɒmɪs/', meaning: 'n. 承诺', sentence: 'The development of sustainable manufacturing practices offers the promise of a greener future.', notes: '可持续制造实践的发展为更环保的未来带来承诺。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N572', word: 'basis', phonetic: '/ˈbeɪsɪs/', meaning: 'n. 基础 / 方式', sentence: 'The quality of the product is checked on a regular basis to ensure it meets the required standards.', notes: '产品质量会定期检查，以确保符合标准要求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N573', word: 'message', phonetic: '/ˈmesɪdʒ/', meaning: 'n. 消息', sentence: 'The supervisor left a message for the line leaders to meet early to discuss the new production schedule.', notes: '主管给生产线领班留了条信息，要求他们提前来讨论新的生产', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N574', word: 'visual aids', phonetic: '/ˈvɪʒuəl eɪdz/', meaning: '视觉辅助工具', sentence: 'The production manager uses visual aids like flowcharts and Gantt charts to schedule the manufacturing process.', notes: '生产经理用流程图和甘特图等视觉辅助工具安排制造过程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N575', word: 'roadmap', phonetic: '/\'rəudmæp/', meaning: 'n. 路线图', sentence: 'Based on the roadmap, we can identify potential challenges and take proactive measures.', notes: '根据这份路线图，我们可以识别潜在挑战并采取积极措施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N576', word: 'routine', phonetic: '/ruːˈtiːn/', meaning: 'n. 日常工作', sentence: 'The maintenance schedule is part of the daily routine to keep the machinery in good condition.', notes: '维保任务是日常工作的一部分，以保持机器良好运行状态。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N577', word: 'timeline', phonetic: '/ˈtaɪmlaɪn/', meaning: 'n. 时间表', sentence: 'The manufacturing team is working hard to complete the production within the given timeline.', notes: '制造团队正努力工作，确保在要求的时间期限内完成生产。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N578', word: 'injury', phonetic: '/ˈɪndʒəri/', meaning: 'n. 伤害', sentence: 'The company has implemented strict safety measures to minimize the risk of injuries.', notes: '公司已实施严格的安全措施，以最大限度地减少受伤风险。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N579', word: 'catalog', phonetic: '/ˈkætəlɒɡ/', meaning: 'n. 产品目录', sentence: 'The manufacturer released a new catalog featuring their latest products and innovations.', notes: '这家制造商发布了一份新的产品目录，展示了他们的最新产品', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N580', word: 'term', phonetic: '/tɜːm/', meaning: 'n. 期限 / 术语 / 条款', sentence: 'The company offers a wide range of products to meet the diverse needs of customers in the short term.', notes: '公司提供的产品涵盖广泛，满足客户短期内的多样化需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N581', word: 'modification', phonetic: '/ˌmɒdɪfɪˈkeɪʃ(ə)n/', meaning: 'n. 修改', sentence: 'Any modification to the product specifications must be approved by the quality control department.', notes: '对产品规格的任何修改都必须得到质量控制部门的批准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N582', word: 'logo', phonetic: '/ˈləʊɡəʊ/', meaning: 'n..( 公司 ) 标识', sentence: 'The company hired an amateur designer to create a new logo, but the result was unsatisfactory.', notes: '公司请了一位业余设计师创建新标识，但结果并不满意。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N583', word: 'portion', phonetic: '/ˈpɔːʃ(ə)n/', meaning: 'n. 部分', sentence: 'The new machine can handle a larger portion of the production workload, increasing efficiency.', notes: '这台新机器可以处理大部分的生产工作，提高效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N584', word: 'bankruptcy', phonetic: '/ˈbæŋkrʌptsi/', meaning: 'n. 破产', sentence: 'The bankruptcy of a major supplier has disrupted the production schedule of several manufacturers.', notes: '一家主要供应商的破产扰乱了一些制造商的生产计划。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N585', word: 'aim', phonetic: '/eɪm/', meaning: 'n. 目的', sentence: 'The design aim of this new product is to provide a more user-friendly experience for our customers.', notes: '这新产品的设计目的是为客户提供更友好的用户体验。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N586', word: 'brand', phonetic: '/brænd/', meaning: 'n. 品牌', sentence: 'The brand equity of our company is built on our reputation for quality, innovation, and reliability.', notes: '我们公司的品牌资产建立在质量、创新和可靠性声誉之上。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N587', word: 'insight', phonetic: '/ˈɪnsaɪt/', meaning: 'n. 洞察力', sentence: 'The customer feedback gave us insight into their needs and expectations, enabling us to better meet their requirements.', notes: '客户反馈让我们深入了解他们的需求和期望，使我们能够更好', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N588', word: 'relocation', phonetic: '/ˌriːləʊˈkeɪʃn/', meaning: 'n. 搬迁', sentence: 'The relocation of the production line to a larger facility will allow us to increase our output and meet the growing demand.', notes: '将生产线搬迁到更大的设施将使我们能够增加产量并满足不断', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N589', word: 'retail', phonetic: '/ˈriːteɪl/', meaning: 'n. 零售', sentence: 'The company is constantly exploring new retail channels to expand our market share and increase sales.', notes: '公司不断探索新零售渠道，以扩大市场份额并增加销售额。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N590', word: 'tour', phonetic: '/tʊə(r)/', meaning: 'n. 参观 / 旅行', sentence: 'We organized a factory tour for our clients to showcase our state-of-the-art facilities and production capabilities.', notes: '我们为客户组织了一次工厂参观，展示我们最先进的设施和生', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N591', word: 'vision', phonetic: '/ˈvɪʒn/', meaning: 'n. 愿景', sentence: 'The new manufacturing plant is designed to meet our long-term vision of increased production capacity.', notes: '新的工厂旨在满足我们增加生产能力的长期愿景。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N592', word: 'mission', phonetic: '/ˈmɪʃ(ə)n/', meaning: 'n. 使命', sentence: 'mission of delivering products on time and within budget.', notes: '运营团队致力于实现公司按时按预算交付产品的使命。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N593', word: 'water spider', phonetic: '/ˈwɔːtə(r) spaɪdə(r)/', meaning: '水蜘蛛 ( 物料协调员 )', sentence: 'The water spider coordinates with different departments to ensure material availability on production lines.', notes: '水蜘蛛与不同部门协调，确保生产线上的物料供应。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N594', word: 'incoterm', phonetic: '/ˈɪnkəʊˌtɜːm/', meaning: 'n. 国际贸易术语', sentence: 'The choice of incoterm can significantly impact the cost and delivery time of the manufactured goods.', notes: '国际贸易术语的选择对成品的成本和交货时间有重大影响。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N595', word: 'milk run', phonetic: '/ˈmɪlk rʌn/', meaning: '循环取货', sentence: 'The use of milk runs has helped us to streamline our logistics processes and achieve just-in-time delivery of raw materials.', notes: '循环取货的使用帮助我们简化了物流流程，实现了原材料的准', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N596', word: 'retrieval', phonetic: '/rɪˈtriːv(ə)l/', meaning: 'n. 检索', sentence: 'The retrieval of historical data is essential for analyzing trends and making informed decisions in manufacturing.', notes: '历史数据的检索对分析趋势和在制造中做出明智决策至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N597', word: 'kaizen', phonetic: '/ˌkaɪˈzen/', meaning: 'n. 改善', sentence: 'The goal of kaizen is to eliminate waste and increase productivity by making small, incremental changes to the manufacturing process.', notes: '改善的目标是通过对制造过程进行小的、渐进的改变来消除浪费并', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N598', word: 'incentive', phonetic: '/ɪnˈsentɪv/', meaning: 'n. 激励措施', sentence: 'The company offers financial incentives to encourage employees to come up with innovative ideas for process improvements.', notes: '公司提供经济激励措施，鼓励员工提出新的流程改进想法。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N599', word: 'conveyor', phonetic: '/kənˈveɪə(r)/', meaning: 'n. 传送带', sentence: 'Conveyors can be designed to handle a wide range of materials, including heavy loads, fragile items, and bulk materials.', notes: '传送带可以设计用于处理各种材料，包括重物、易碎物品和散', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N600', word: 'false call', phonetic: '/fɔːls ˈkɔːl/', meaning: '误报', sentence: 'False calls are a common problem in manufacturing, often caused by faulty sensors or incorrect data.', notes: '误报是制造常见问题，通常由故障传感器或错误数据引起。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N601', word: 'creativity', phonetic: '/ˌkriːeɪˈtɪvəti/', meaning: 'n. 创造力', sentence: 'Creativity is needed to solve complex manufacturing problems and find efficient solutions.', notes: '解决复杂的制造问题并找到有效的解决方案需要创造力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N602', word: 'patent', phonetic: '/ˈpeɪt(ə)nt; ˈpæt(ə)nt/', meaning: 'n. 专利', sentence: 'Obtaining patents can give a company a competitive advantage in the marketplace by protecting its intellectual property.', notes: '获得专利可通过保护知识产权为公司在市场提供竞争优势。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N603', word: 'pallet', phonetic: '/ˈpælət/', meaning: 'n. 托盘 / 卡板', sentence: 'The forklift is used to move the pallets from one location to another in the warehouse.', notes: '叉车用于在仓库中将托盘从一个位置移动到另一个位置。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N604', word: 'container', phonetic: '/kənˈteɪnə(r)/', meaning: 'n. 集装箱', sentence: 'The finished products are packed in containers for shipment overseas.', notes: '成品包装在集装箱中运往海外。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N605', word: 'housekeeping', phonetic: '/ˈhaʊskiːpɪŋ/', meaning: 'n. 内务管理', sentence: 'A clean and organized workplace is achieved through effective housekeeping practices.', notes: '通过有效内务管理实践，有了一个清洁有序的工作场所。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N606', word: 'prediction', phonetic: '/prɪˈdɪkʃ(ə)n/', meaning: 'n. 预测', sentence: 'The accuracy of the prediction depends on the quality and quantity of the input data.', notes: '预测的准确性取决于输入数据的质量和数量。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N607', word: 'voltage', phonetic: '/ˈvəʊltɪdʒ/', meaning: 'n. 电压', sentence: 'The voltage of the power supply must be within the specified range for the equipment to function properly.', notes: '电源电压必须在指定范围内，设备才能正常运行。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N608', word: 'cleanliness', phonetic: '/ˈklenlinəs/', meaning: 'n. 清洁', sentence: 'Regular cleaning ensures the cleanliness of the equipment and prolongs its lifespan.', notes: '定期清洁确保设备清洁并延长其使用寿命。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N609', word: 'particle', phonetic: '/ˈpɑːtɪk(ə)l/', meaning: 'n. 微粒', sentence: 'Fine particles can cause problems in the manufacturing process if not properly controlled.', notes: '如果控制不当，细颗粒可能会在制造过程中引起问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N610', word: 'overview', phonetic: '/ˈəʊvəvjuː/', meaning: 'n. 概述', sentence: 'A detailed overview of the manufacturing facility gives insights into its capabilities and limitations.', notes: '对制造设施的详细概述可以深入了解其能力和局限性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N611', word: 'draft', phonetic: '/drɑːft/', meaning: 'n. 草稿', sentence: 'The manufacturing engineer makes adjustments to the draft of the assembly instructions based on feedback from the workers.', notes: '制造工程师根据工人的反馈对装配说明的草图进行调整。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N612', word: 'coating', phonetic: '/ˈkəʊtɪŋ/', meaning: 'n. 涂层', sentence: 'We need to ensure a uniform coating thickness to achieve the desired functional and cosmetic performance.', notes: '我们需要确保均匀的涂层厚度以达到所需功能和外观性能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N613', word: 'box build', phonetic: '/ˈbɒks bɪld/', meaning: '整机组装', sentence: 'Our team has extensive experience in box build and can handle projects of any size.', notes: '我们团队在整机组装方面有丰富的经验，可以处理任何规模的项目。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N614', word: 'truth', phonetic: '/truːθ/', meaning: 'n. 真相', sentence: 'Discovering the truth behind a manufacturing defect requires a thorough investigation.', notes: '发现制造缺陷背后的真相需要进行彻底的调查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N615', word: 'flaw', phonetic: '/flɔː/', meaning: 'n. 缺点 / 瑕疵', sentence: 'A flaw in the material can cause the final product to fail prematurely on the end-user side.', notes: '材料中的瑕疵可能导致成品在用户处过早失效。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N616', word: 'retention', phonetic: '/rɪˈtenʃ(ə)n/', meaning: 'n. 保留', sentence: 'We need to focus on employee development to increase retention in the long term.', notes: '我们需要关注员工发展以长期提升保留率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N617', word: 'silicon', phonetic: '/ˈsɪlɪkən/', meaning: 'n. 硅', sentence: 'The properties of silicon make it an ideal material for many electronic applications.', notes: '硅的特性使其成为许多电子应用的理想材料。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N618', word: 'discharge', phonetic: '/ˈdɪstʃɑːdʒ/', meaning: 'n. 释放', sentence: 'Electrostatic discharge can damage sensitive electronic components during manufacturing.', notes: '静电放电可能会在制造过程中损坏敏感的电子元件。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N619', word: 'chance', phonetic: '/tʃɑːns/', meaning: 'n. 机会', sentence: 'The chance of meeting the deadline depends on our team\'s efficiency and coordination.', notes: '按时完成的机会取决于我们团队的效率和协作。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N620', word: 'compound', phonetic: '/ˈkɒmpaʊnd/', meaning: 'n. 化合物 / 混合物', sentence: 'The compound used in this manufacturing process is known for its high strength and durability.', notes: '在这制造过程中使用的化合物以其高强度和耐久性而闻名。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N621', word: 'Pareto Chart', phonetic: '/pa\'reɪtəʊ tʃɑːt/', meaning: 'n. 柏拉图', sentence: 'The Pareto Chart helps us visualize the distribution of defects and focus on the areas that need attention.', notes: '柏拉图帮助我们可视化缺陷分布，并关注需要关注的领域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N622', word: 'vibration', phonetic: '/vaɪˈbreɪʃ(ə)n/', meaning: 'n. 振动', sentence: 'Vibration sensors are installed to detect any abnormal vibrations in the production process.', notes: '安装振动传感器以检测生产过程中的任何异常振动。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N623', word: 'hazard', phonetic: '/ˈhæzəd/', meaning: 'n. 危险 / 危害', sentence: 'Based on the safety regulations, machinery hazards need to be identified and mitigated to avoid injuries.', notes: '根据安全规定，我们必须识别和减轻机械危险，以避免受伤。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N624', word: 'fatigue', phonetic: '/fəˈtiːɡ/', meaning: 'n. 疲劳', sentence: 'The material\'s fatigue resistance is an important factor in its suitability for manufacturing.', notes: '材料的抗疲劳性是其是否适用于制造的重要因素。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N625', word: 'screening', phonetic: '/ˈskriːnɪŋ/', meaning: 'n. 筛选', sentence: 'Screening tests are conducted to identify any potential defects in the components.', notes: '进行筛选测试以识别组件中的任何潜在缺陷。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N626', word: 'parameter', phonetic: '/pəˈræmɪtə(r)/', meaning: 'n. 参数', sentence: 'We must ensure that all parameters are within the specified range to meet the required standards.', notes: '我们必须确保所有参数都在指定范围内，满足要求的标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N627', word: 'workstation', phonetic: '/ˈwɜːksteɪʃn/', meaning: 'n. 工位', sentence: 'Each workstation is equipped with the necessary tools, equipment and safety facilities.', notes: '每个工作站都配备了必要的工具、设备和安全设施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N628', word: 'scenario', phonetic: '/səˈnɑːriəʊ/', meaning: 'n. 场景', sentence: 'We need to be flexible to adapt to unexpected scenarios in the manufacturing process.', notes: '我们需要灵活适应制造过程中意想不到的情况。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N629', word: 'upstream', phonetic: '/ˌʌpˈstriːm/', meaning: 'adj. 上游的', sentence: 'We are constantly looking for ways to improve the upstream supply chain to enhance our competitiveness.', notes: '我们一直在寻找改善上游供应链的方法以增强竞争力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N630', word: 'downstream', phonetic: '/ˌdaʊnˈstriːm/', meaning: 'adj. 下游的', sentence: 'The company is collaborating with downstream partners to expand its market reach.', notes: '该公司正在与下游合作伙伴合作以扩大其市场覆盖范围。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N631', word: 'contrast', phonetic: '/ˈkɒntrɑːst/', meaning: 'n. 对比', sentence: 'By making a contrast, we can identify the advantages and disadvantages of each option.', notes: '通过进行对比，我们可以识别每个选项的优缺点。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N632', word: 'batch', phonetic: '/bætʃ/', meaning: 'n. 批量', sentence: 'The batch size depends on the customer demand and production capacity.', notes: '批量大小取决于客户需求和生产能力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N633', word: 'hierarchy', phonetic: '/ˈhaɪərɑːki/', meaning: 'n. 层级结构', sentence: 'A clear hierarchy is necessary for efficient management in the factory.', notes: '在工厂中，清晰的层级结构对于高效管理是必要的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N634', word: 'depot', phonetic: '/ˈdepəʊ/', meaning: 'n. 仓库', sentence: 'The company has several depots strategically located to meet the demand in different regions.', notes: '公司在不同地区战略性地设有几个仓库，以满足需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N635', word: 'surplus', phonetic: '/ˈsɜːpləs/', meaning: 'n. 剩余', sentence: 'Surplus materials from the production process can be recycled or sold.', notes: '生产过程中的剩余材料可以回收或出售。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N636', word: 'import', phonetic: '/ˈɪmpɔːt/', meaning: 'n. 进口', sentence: 'The company relies on imports of raw materials to meet production needs.', notes: '该公司依赖进口原材料来满足生产需求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N637', word: 'export', phonetic: '/ɪkˈspɔːt; ˈekspɔːt/', meaning: 'n. 出口', sentence: 'The increase in export orders has led to an expansion of our production capacity.', notes: '出口订单的增加导致了我们生产能力的扩大。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N638', word: 'task', phonetic: '/tɑːsk/', meaning: 'n. 任务', sentence: 'The project manager is responsible for coordinating tasks and resources to ensure timely completion.', notes: '项目经理负责协调任务和资源，以确保按时完成。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N639', word: 'media', phonetic: '/ˈmiːdiə/', meaning: 'n. 媒体', sentence: 'Social media is an important tool for promoting our products and reaching potential customers.', notes: '社交媒体是推广我们的产品和接触潜在客户的重要工具。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N640', word: 'stock taking', phonetic: '/ˈstɒk teɪkɪŋ/', meaning: '盘点', sentence: 'The stock taking process revealed some discrepancies in the inventory levels.', notes: '盘点过程揭示了库存水平上的一些差异。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N641', word: 'order', phonetic: '/ˈɔːdə(r)/', meaning: 'n. 订单', sentence: 'We need to expedite the processing of this order to meet the customer\'s deadline.', notes: '我们需要加快处理这个订单，以满足客户的截止日期。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N642', word: 'receipt', phonetic: '/rɪˈsiːt/', meaning: 'n. 收据', sentence: 'We need to keep the receipt for the purchase of this equipment for warranty purposes.', notes: '我们需要保留购买该设备的收据以备保修之用。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N643', word: 'refurbishment', phonetic: '/ˌriːˈfɜːbɪʃmənt/', meaning: 'n. 翻新', sentence: 'After the refurbishment, the facility will meet the latest safety and environmental standards.', notes: '翻新后，该设施将符合最新的安全和环境标准。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N644', word: 'return', phonetic: '/rɪˈtɜːn/', meaning: 'n. 退货 / 归还', sentence: 'The return process should be streamlined to minimize customer inconvenience.', notes: '退货流程应简化以最大程度减少客户的不便。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N645', word: 'update', phonetic: '/ˈʌpdeɪt/', meaning: 'n. 更新', sentence: 'The update of the product design has received positive feedback from customers.', notes: '关于产品设计的更新收到了客户的积极反馈。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N646', word: 'position', phonetic: '/pəˈzɪʃ(ə)n/', meaning: 'n. 职位 / 位置', sentence: 'We are currently in the process of filling several key positions in the manufacturing department.', notes: '我们目前正在为制造部门填补几个关键职位。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N647', word: 'effectiveness', phonetic: '/ɪˈfektɪvnəs/', meaning: 'n. 有效性', sentence: 'The team is analyzing the data to determine the effectiveness of the marketing campaign.', notes: '团队正在分析数据以确定营销活动的有效性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N648', word: 'schematics', phonetic: '/skiːˈmætɪks/', meaning: 'n. 原理图', sentence: 'The engineer is studying the schematics of the new product to identify any design flaws.', notes: '工程师正在研究新产品的原理图，以找出任何设计缺陷。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N649', word: 'terminal', phonetic: '/ˈtɜːmɪn(ə)l/', meaning: 'n. 终端', sentence: 'Employees need to swipe their badges at the time clock terminal to record their working hours.', notes: '员工需要在考勤终端刷卡，以记录他们的工作时间。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N650', word: 'advertisement', phonetic: '/ədˈvɜːtɪsmənt/', meaning: 'n. 广告', sentence: 'Our company is considering launching a new advertisement to attract more customers.', notes: '我们公司正在考虑推出新的广告来吸引更多客户。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N651', word: 'instrument', phonetic: '/ˈɪnstrəmənt/', meaning: 'n. 仪器 / 器械', sentence: 'The engineer calibrates the instruments before starting the production to guarantee precise results.', notes: '工程师在开始生产前校准仪器，以保证精确的结果。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N652', word: 'poster', phonetic: '/ˈpəʊstə(r)/', meaning: 'n. 海报', sentence: 'The safety poster reminds workers to follow proper procedures and wear protective gear.', notes: '安全海报提醒工人遵循正确的程序并穿戴防护装备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N653', word: 'program', phonetic: '/ˈprəʊɡræm/', meaning: 'n. 程序 / 计划', sentence: 'The company\'s environmental program includes measures to reduce waste and emissions.', notes: '公司的环境计划包括减少浪费和排放的措施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N654', word: 'advice', phonetic: '/ədˈvaɪs/', meaning: 'n. 建议', sentence: 'Can you give me some advice on how to reduce the production cost?', notes: '你能给我一些关于如何降低生产成本的建议吗？', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N655', word: 'form', phonetic: '/fɔːm/', meaning: 'n. 表格 / 形式', sentence: 'We should follow the standard form when filling out the production report.', notes: '我们在填写生产报告时应遵循标准格式。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N656', word: 'notice', phonetic: '/ˈnəʊtɪs/', meaning: 'n. 通告', sentence: 'The notice board in the production area displays the latest production schedule and announcements.', notes: '生产区的公告板展示了最新的生产计划和公告。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N657', word: 'carton', phonetic: '/ˈkɑːtn/', meaning: 'n. 纸箱', sentence: 'The carton packaging protects the products during transportation and storage.', notes: '纸箱包装在运输和储存过程中保护产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N658', word: 'offer', phonetic: '/ˈɒfə(r)/', meaning: 'n. 出价 / 提议', sentence: 'The offer of a discount on bulk orders encouraged customers to place larger orders.', notes: '批量订单的折扣提议鼓励客户下更大的订单。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N659', word: 'quotation', phonetic: '/kwəʊˈteɪʃ(ə)n/', meaning: 'n. 报价', sentence: 'We need to prepare a competitive quotation to win the contract.', notes: '我们需要准备一份有竞争力的报价来赢得合同。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N660', word: 'sign', phonetic: '/saɪn/', meaning: 'n. 标志', sentence: 'We need to put up signs to warn workers of the potential hazards in the workplace.', notes: '们需要张贴标志以警示工人工作场所的潜在危险。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N661', word: 'piece', phonetic: '/piːs/', meaning: 'n. 件 / 部件', sentence: 'Can you label each piece with its corresponding part number for easy identification?', notes: '你能为每个部件贴上相应的零件编号以便于识别吗？', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N662', word: 'examination', phonetic: '/ɪɡˌzæmɪˈneɪʃ(ə)n/', meaning: 'n. 检查', sentence: 'The product undergoes a rigorous examination before it is released to the market.', notes: '产品在投放市场前要经过严格的检查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N663', word: 'capital', phonetic: '/ˈkæpɪt(ə)l/', meaning: 'n. 资本 / 资金', sentence: 'The company needs to raise additional capital to expand its production facilities.', notes: '公司需要筹集额外的资金来扩大生产设施。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N664', word: 'contact', phonetic: '/ˈkɒntækt/', meaning: 'n. 联系', sentence: 'The sales team has been in contact with potential customers to promote our new products.', notes: '销售团队一直与潜在客户保持联系，以推广我们的新产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N665', word: 'folder', phonetic: '/ˈfəʊldə(r)/', meaning: 'n. 文件夹', sentence: 'The folder containing the production schedule is updated regularly to reflect any changes.', notes: '包含生产计划的文件夹会定期更新，以反映任何变化。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N666', word: 'partner', phonetic: '/ˈpɑːtnə(r)/', meaning: 'n. 伙伴', sentence: 'The company is looking for a reliable partner to collaborate on a new project.', notes: '公司正在寻找一个可靠的合作伙伴来合作开展一个新项目。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N667', word: 'prize', phonetic: '/praɪz/', meaning: 'n. 奖项', sentence: 'The team that completed the project ahead of schedule received a bonus as a prize.', notes: '提前完成项目的团队获得了奖金作为奖励。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N668', word: 'surprise', phonetic: '/səˈpraɪz/', meaning: 'n. 意外 / 惊讶', sentence: 'The arrival of a new order with a tight deadline was a surprise, but the team managed to meet it.', notes: '新订单到来，交货期很紧。这让人意外，但团队设法完成了。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N669', word: 'craft', phonetic: '/krɑːft/', meaning: 'n. 工艺 / 手艺', sentence: 'The company invests in training to improve the craft skills of its employees.', notes: '公司投资培训以提高员工的工艺技能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N670', word: 'display', phonetic: '/dɪˈspleɪ/', meaning: 'n. 展示', sentence: 'The display of new products at the international trade fair attracted a lot of attention.', notes: '在国际贸易博览会上展示的新产品吸引了很多关注。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N671', word: 'image', phonetic: '/ˈɪmɪdʒ/', meaning: 'n. 形象', sentence: 'by focusing on innovation, quality, and customer service.', notes: '公司致力于通过专注创新、质量和客服来提升其品牌形象。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N672', word: 'series', phonetic: '/ˈsɪəriːz/', meaning: 'n. 系列', sentence: 'The manufacturing process involves a series of complex steps that require precise coordination.', notes: '制造过程涉及一系列复杂的步骤，需要精确的协调。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N673', word: 'breakdown', phonetic: '/ˈbreɪkdaʊn/', meaning: 'n. 分解', sentence: 'The cost breakdown shows the distribution of expenses in the manufacturing process.', notes: '成本分解显示了制造过程中费用的分布情况。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N674', word: 'curing', phonetic: '/ˈkjʊərɪŋ/', meaning: 'n. 固化', sentence: 'The curing temperature needs to be controlled precisely to avoid over-curing or under-curing.', notes: '固化温度需要精确控制，以避免过度固化或固化不足。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N675', word: 'virus', phonetic: '/ˈvaɪrəs/', meaning: 'n. 病毒', sentence: 'Workers are required to wear masks and follow social distancing guidelines to minimize the risk of virus transmission.', notes: '工人被要求戴口罩并遵循社交距离准则，以最大程度地降低病', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N676', word: 'badge', phonetic: '/bædʒ/', meaning: 'n. 徽章 / 工牌', sentence: 'The safety officer issues badges to visitors to ensure they are authorized to be in the restricted area.', notes: '安全主任向访客发放徽章，确保他们被授权进入限制区域。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N677', word: 'account', phonetic: '/əˈkaʊnt/', meaning: 'n. 账户', sentence: 'The finance department prepares an account statement showing the company\'s financial performance.', notes: '财务部门准备一份账户报表，展示公司的财务业绩。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N678', word: 'ban', phonetic: '/bæn/', meaning: 'n. 禁止', sentence: 'The environmental protection agency has proposed a ban on the discharge of untreated wastewater from factories.', notes: '环境保护机构提议禁止工厂排放未经处理的废水。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N679', word: 'compromise', phonetic: '/ˈkɒmprəmaɪz/', meaning: 'n. 妥协', sentence: 'To improve efficiency, the production line was reconfigured with a compromise on space utilization.', notes: '为提高效率，产线做了重新配置，在空间利用上做出了妥协。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N680', word: 'confirmation', phonetic: '/ˌkɒnfəˈmeɪʃ(ə)n/', meaning: 'n. 确认', sentence: 'After the prototype was tested, the engineers received a confirmation that it was ready for mass production.', notes: '原型经过测试后，工程师们收到了确认信息，表明它已准备好', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N681', word: 'hint', phonetic: '/hɪnt/', meaning: 'n. 暗示', sentence: 'The production manager dropped a hint that there could be a change in the production schedule.', notes: '生产经理暗示可能会改变生产计划。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N682', word: 'objection', phonetic: '/əbˈdʒekʃ(ə)n/', meaning: 'n. 异议 / 反对', sentence: 'The production team had an objection to the proposed process changes, arguing that it would increase costs.', notes: '生产部对工艺流程更建议提出异议，认为这会增加成本。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N683', word: 'outline', phonetic: '/ˈaʊtlaɪn/', meaning: 'n. 大纲 / 梗概', sentence: 'The marketing team developed an outline of the product launch strategy to guide the promotional efforts.', notes: '营销团队制定了产品发布策略的大纲，以指导促销工作。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N684', word: 'remark', phonetic: '/rɪˈmɑːk/', meaning: 'n. 评价 / 评论', sentence: 'The customer\'s positive remarks about our products have significantly boosted our sales.', notes: '客户对我们产品的积极评价大大提高了我们的销售额。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N685', word: 'symbol', phonetic: '/ˈsɪmb(ə)l/', meaning: 'n. 符号 / 标志', sentence: 'The safety symbol on the machine alerts operators to potential hazards.', notes: '机器上的安全标志提醒操作员注意潜在的危险。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N686', word: 'extent', phonetic: '/ɪkˈstent/', meaning: 'n. 程度', sentence: 'The engineer evaluated the extent to which the new design would improve the product\'s performance.', notes: '工程师评估了新设计对产品性能的改善程度。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N687', word: 'minority', phonetic: '/maɪˈnɒrəti/', meaning: 'n. 少数', sentence: 'Only a minority of the production lines were operating at full capacity.', notes: '只有少数生产线在满负荷运行。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N688', word: 'scale', phonetic: '/skeɪl/', meaning: 'n. 规模', sentence: 'To increase the scale of production, we need to invest in new equipment and technology.', notes: '为了扩大生产规模，我们需要投资新设备和技术。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N689', word: 'credit', phonetic: '/ˈkredɪt/', meaning: 'n. 信用', sentence: 'A good credit score can open up more opportunities for business growth and expansion.', notes: '良好的信用评分可以为业务增长和扩张打开更多机会。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N690', word: 'seminar', phonetic: '/ˈsemɪnɑː(r)/', meaning: 'n. 研讨会', sentence: 'The company arranged a seminar on safety in the workplace to raise awareness among employees.', notes: '公司安排了关于工作场所安全的研讨会，以提高员工的意识。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N691', word: 'venue', phonetic: '/ˈvenjuː/', meaning: 'n. 场地', sentence: 'The company is looking for a suitable venue to hold its annual product exhibition.', notes: '公司正在寻找一个合适的场地来举办年度产品展览。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N692', word: 'debit', phonetic: '/ˈdebɪt/', meaning: 'n. 借方 / 借记', sentence: 'The purchasing department received a debit note from the vendor for the incorrect shipment of materials.', notes: '采购部门收到了供应商的借记通知单，用于收取材料发货错误', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N693', word: 'insurance', phonetic: '/ɪnˈʃʊərəns/', meaning: 'n. 保险', sentence: 'The company decided to increase the insurance coverage for its facilities to mitigate potential risks.', notes: '公司决定增加其设施的保险范围，以减轻潜在风险。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N694', word: 'payment', phonetic: '/ˈpeɪmənt/', meaning: 'n. 付款', sentence: 'The company is negotiating with the supplier about the payment terms for the next batch of goods.', notes: '公司正在与供应商就下一批货物的付款条件进行谈判。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N695', word: 'carbon', phonetic: '/ˈkɑːbən/', meaning: 'n. 碳', sentence: 'The manufacturing process emits a significant amount of carbon dioxide into the atmosphere.', notes: '生产过程向大气中排放了大量的二氧化碳。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N696', word: 'estimate', phonetic: '/ˈestɪmət; ˈestɪmeɪt/', meaning: 'n. 估计', sentence: 'The engineer provided an estimate of the project\'s cost, including materials, labor, and equipment.', notes: '工程师提供了项目成本的估计，包括材料、劳动力和设备。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N697', word: 'prevention', phonetic: '/prɪˈvenʃn/', meaning: 'n. 预防', sentence: 'Employee training on proper handling and storage of materials is important for the prevention of damage and waste.', notes: '对员工进行正确处理和存储材料的培训对于预防损坏和浪费很', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N698', word: 'courage', phonetic: '/ˈkʌrɪdʒ/', meaning: 'n. 勇气', sentence: 'It takes a lot of courage for the engineers to implement innovative designs in the manufacturing process.', notes: '工程师们需要很大的勇气在制造过程中实施创新设计。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N699', word: 'faith', phonetic: '/feɪθ/', meaning: 'n. 信心 / 信任', sentence: 'The customers have faith in the brand\'s reputation for delivering quality products consistently.', notes: '客户因该品牌一贯提供优质产品的声誉而充满信心。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N700', word: 'honor', phonetic: '/ˈɒnə(r)/', meaning: 'n. 荣誉 / 荣幸', sentence: 'The engineer takes pride and honor in designing innovative solutions for the manufacturing process.', notes: '工程师为设计制造过程的创新解决方案而感到自豪和荣幸。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N701', word: 'inspiration', phonetic: '/ˌɪnspəˈreɪʃ(ə)n/', meaning: 'n. 灵感', sentence: 'The art exhibition provided inspiration for the design of the packaging of our latest product.', notes: '艺术展览为我们最新产品的包装设计提供了灵感。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N702', word: 'decline', phonetic: '/dɪˈklaɪn/', meaning: 'n. 下降', sentence: 'The company is facing a decline in market share due to intense competition.', notes: '由于激烈的竞争，公司面临市场份额的下降。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N703', word: 'passion', phonetic: '/ˈpæʃ(ə)n/', meaning: 'n. 热情', sentence: 'The designer\'s passion for creativity is reflected in the unique and stylish designs of the products.', notes: '设计师对创造力的热情反映在产品独特而时尚的设计中。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N704', word: 'opponent', phonetic: '/əˈpəʊnənt/', meaning: 'n. 对手', sentence: 'In order to succeed, we need to understand our opponents\' strategies and weaknesses.', notes: '为了取得成功，我们需要了解对手的策略和弱点。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N705', word: 'victory', phonetic: '/ˈvɪktəri/', meaning: 'n. 胜利', sentence: 'The workers\' hard work and dedication led to the victory in achieving the production target.', notes: '工人们的辛勤工作和奉献精神导致了实现生产目标的胜利。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N706', word: 'backup', phonetic: '/ˈbækʌp/', meaning: 'n. 备份', sentence: 'A regular backup of the production software is necessary to avoid any data corruption or loss.', notes: '定期备份生产软件是必要的，以避免任何数据损坏或丢失。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N707', word: 'database', phonetic: '/ˈdeɪtəbeɪs/', meaning: 'n. 数据库', sentence: 'We need to update the database with the latest production data to ensure accurate reporting.', notes: '我们需要用最新生产数据更新数据库，以确保准确的报告。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N708', word: 'retirement', phonetic: '/rɪˈtaɪəmənt/', meaning: 'n. 退休', sentence: 'The retirement of the senior engineer has sparked a search for a successor with the right skills.', notes: '高级工程师的退休引发了对具有适当技能的继任者的搜寻。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N709', word: 'advance', phonetic: '/ədˈvɑːns/', meaning: 'n. 进步', sentence: 'The advance in robotics has revolutionized the assembly line in the manufacturing sector.', notes: '机器人技术的进步彻底改变了制造业的装配线。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N710', word: 'association', phonetic: '/əˌsəʊsiˈeɪʃn; əˌsəʊʃiˈeɪʃn/', meaning: 'n. 关联', sentence: 'The association between the quality of raw materials and the final product is directly proportional.', notes: '原材料质量和最终产品之间的关联是成正比的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N711', word: 'battle', phonetic: '/ˈbæt(ə)l/', meaning: 'n. 战斗 / 拼搏', sentence: 'The battle to reduce production costs while maintaining quality is a constant struggle for manufacturers.', notes: '在保持质量同时降低生产成本是制造商们不断面临的挑战。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N712', word: 'belongings', phonetic: '/bɪˈlɒŋɪŋz/', meaning: 'n. 所有物', sentence: 'The company provided lockers for the workers to safeguard their belongings while they are at work.', notes: '公司为工人提供了储物柜，以在工作时保护他们的物品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N713', word: 'breakthrough', phonetic: '/ˈbreɪkθruː/', meaning: 'n. 突破', sentence: 'The company\'s recent breakthrough in material science has led to the development of stronger and lighter products.', notes: '公司最近在材料科学的突破引起更坚固、更轻产品的开发。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N714', word: 'centigrade', phonetic: '/ˈsentɪɡreɪd/', meaning: 'n. 摄氏温度', sentence: 'The material can withstand temperatures up to 1000 degrees centigrade without deformation.', notes: '这种材料可以承受高达 1000 摄氏度的温度而不变形。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N715', word: 'chaos', phonetic: '/ˈkeɪɒs/', meaning: 'n. 混乱', sentence: 'The introduction of new technology without adequate training led to chaos among the workers.', notes: '在没有充分培训的情况下引入新技术导致工人之间的混乱。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N716', word: 'claim', phonetic: '/kleɪm/', meaning: 'n.( 权利 ) 要求', sentence: 'The workers\' claim for better working conditions was finally addressed by the management.', notes: '工人们对更好工作条件的要求最终得到了管理层的解决。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N717', word: 'clause', phonetic: '/klɔːz/', meaning: 'n. 条款', sentence: 'The employment contract includes a clause that defines the employee\'s responsibilities and duties.', notes: '雇佣合同包含一个条款，定义了员工的责任和职责。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N718', word: 'coaching', phonetic: '/ˈkəʊtʃɪŋ/', meaning: 'n. 辅导', sentence: 'The supervisor provides on-the-job coaching to improve the workers\' skills and productivity.', notes: '主管提供在职辅导，以提高工人的技能和生产力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N719', word: 'coincidence', phonetic: '/kəʊˈɪnsɪdəns/', meaning: 'n. 巧合', sentence: 'It was a coincidence that the machine broke down just as the production deadline was approaching.', notes: '就在生产截止日期临近时，机器坏了，这真是个巧合。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N720', word: 'recession', phonetic: '/rɪˈseʃ(ə)n/', meaning: 'n.( 经济 ) 衰退', sentence: 'Many manufacturing companies are struggling to survive during this recession due to reduced orders.', notes: '在这次经济衰退期间，由于订单减少，许多制造公司正在努力', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N721', word: 'contractor', phonetic: '/kənˈtræktə(r); ˈkɒntræktə(r)/', meaning: 'n. 承包商', sentence: 'The contractor is responsible for the construction of the new factory building.', notes: '承包商负责新工厂大楼的施工。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N722', word: 'insulation', phonetic: '/ˌɪnsjuˈleɪʃ(ə)n/', meaning: 'n. 绝缘', sentence: 'The quality of insulation plays a crucial role in the performance and durability of the final product.', notes: '绝缘质量对最终产品的性能和耐久性起着至关重要的作用。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N723', word: 'confusion', phonetic: '/kənˈfjuːʒn/', meaning: 'n. 混淆 / 困惑', sentence: 'We need to clarify the instructions to avoid confusion among the workers on the production line.', notes: '我们需要澄清说明，以避免生产线上的工人产生混淆。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N724', word: 'depression', phonetic: '/dɪˈpreʃn/', meaning: 'n. 萧条 / 沮丧', sentence: 'The company experienced a period of depression due to a decline in sales and increased competition.', notes: '由于销售下降和竞争加剧，公司经历了一段萧条时期。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N725', word: 'dialog', phonetic: '/ˈdaɪəlɒɡ/', meaning: 'n. 对话', sentence: 'We need to have an open dialog with our suppliers to address any issues related to the supply chain.', notes: '我们需要与供应商进行开放的对话，以解决与供应链相关的任', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N726', word: 'disaster', phonetic: '/dɪˈzɑːstə(r)/', meaning: 'n. 灾难', sentence: 'The power outage was a disaster for the production line, halting operations for several hours.', notes: '停电对生产线来说是一场灾难，它使生产停止了几个小时。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N727', word: 'earnings', phonetic: '/ˈɜːnɪŋz/', meaning: 'n. 收入 / 利润', sentence: 'The company\'s earnings have been steadily increasing due to the successful implementation of cost-cutting measures.', notes: '由于成功实施成本削减措施，公司的盈利一直在稳步增长。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N728', word: 'ease', phonetic: '/iːz/', meaning: 'n. 容易 / 便利', sentence: 'The company\'s focus on ergonomics has resulted in a workspace that offers greater ease and comfort to the employees.', notes: '公司对人体工程学的关注导致了一个为员工提供更大便利和舒适的', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N729', word: 'equality', phonetic: '/iˈkwɒləti/', meaning: 'n. 平等', sentence: 'Equality in pay and benefits is crucial for maintaining a motivated and productive workforce.', notes: '薪酬和福利的平等对于维持一支有积极性和高效的劳动力至', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N730', word: 'estate', phonetic: '/ɪˈsteɪt/', meaning: 'n. 住宅区 / 财产', sentence: 'For convenience, the workers\' housing estate was located near the manufacturing site.', notes: '工人的住宅区位于制造现场附近，方便他们上下班。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N731', word: 'evolution', phonetic: '/ˌiːvəˈluːʃ(ə)n/', meaning: 'n. 演变', sentence: 'The manufacturing industry is experiencing a rapid evolution driven by technological advancements.', notes: '制造业正在经历由技术进步推动的快速演变。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N732', word: 'existence', phonetic: '/ɪɡˈzɪstəns/', meaning: 'n. 存在', sentence: 'The existence of advanced technology enables the production of complex and innovative products.', notes: '先进技术的存在使复杂和创新产品的生产成为可能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N733', word: 'expansion', phonetic: '/ɪkˈspænʃ(ə)n/', meaning: 'n. 扩张', sentence: 'The expansion of the product line has led to increased sales and market share.', notes: '产品线的扩张引起了销售额和市场份额的增加。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N734', word: 'expression', phonetic: '/ɪkˈspreʃ(ə)n/', meaning: 'n. 表达 / 表情', sentence: 'The company\'s values are reflected in the expression of its corporate culture.', notes: '公司的价值观体现在其企业文化的表述中。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N735', word: 'folks', phonetic: '/fəʊks/', meaning: 'n. 人们', sentence: 'We need to communicate with the folks on the shop floor to understand their concerns.', notes: '我们需要与车间的员工沟通，了解他们的关注点。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N736', word: 'fortune', phonetic: '/ˈfɔːtʃuːn/', meaning: 'n. 财富', sentence: 'The new product was a huge success, bringing in a fortune for the company and its shareholders.', notes: '新产品取得了巨大的成功，为公司及其股东带来了财富。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N737', word: 'gender', phonetic: '/ˈdʒendə(r)/', meaning: 'n. 性别', sentence: 'All companies should strive to eliminate gender bias in recruitment and promotion.', notes: '所有公司都应努力消除招聘和晋升中的性别偏见。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N738', word: 'growth', phonetic: '/ɡrəʊθ/', meaning: 'n. 成长 / 增长', sentence: 'The company\'s strategic plan focuses on achieving sustainable growth in the automotive business.', notes: '公司的战略计划侧重于实现汽车业务的可持续增长。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N739', word: 'habit', phonetic: '/ˈhæbɪt/', meaning: 'n. 习惯', sentence: 'Adhering to strict quality control procedures is a habit that guarantees the consistency and reliability of the products.', notes: '坚持严格的质量控制程序是一种习惯，可确保产品的一致性', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N740', word: 'headquarters', phonetic: '/ˌhedˈkwɔːtəz/', meaning: 'n. 总部', sentence: 'The headquarters is located in a strategic area with easy access to transportation and resources.', notes: '总部位于一个战略区域，交通和资源便利。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N741', word: 'identity', phonetic: '/aɪˈdentəti/', meaning: 'n. 身份 / 标识', sentence: 'The identity of each component in the production line needs to be clearly labeled for quality control.', notes: '生产线上每个组件的标识都需要清楚地标记出来，以进', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N742', word: 'institution', phonetic: '/ˌɪnstɪˈtjuːʃ(ə)n/', meaning: 'n. 机构', sentence: 'The institution provides training courses for workers in the manufacturing sector.', notes: '该机构为制造业工人提供培训课程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N743', word: 'intention', phonetic: '/ɪnˈtenʃ(ə)n/', meaning: 'n. 意图', sentence: 'The intention of the design team is to create a more efficient manufacturing process.', notes: '设计团队的意图是创建更高效的制造流程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N744', word: 'interior', phonetic: '/ɪnˈtɪəriə(r)/', meaning: 'n. 内部 adj. 内部的', sentence: 'The interior design of the factory aims to create a comfortable and efficient working environment for the employees.', notes: '工厂的内部设计旨在为员工创造一个舒适高效的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N745', word: 'exterior', phonetic: '/ɪkˈstɪəriə(r)/', meaning: 'n. 外部 adj. 外部的', sentence: 'The exterior appearance of the product is an important factor in attracting customers.', notes: '产品的外观是吸引客户的重要因素。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N746', word: 'landlord', phonetic: '/ˈlændlɔːd/', meaning: 'n. 房东', sentence: 'The landlord of the factory building is responsible for maintaining the property.', notes: '厂房的房东负责维护该物业。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N747', word: 'master', phonetic: '/ˈmɑːstə(r)/', meaning: 'n. 控制者 / 大师 adj. 主要的', sentence: 'The master plan for the new manufacturing facility is currently under review by the management team.', notes: '新制造设施的总体规划目前正在由管理团队审查。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N748', word: 'mess', phonetic: '/mes/', meaning: 'n. 混乱 / 杂乱', sentence: 'The mess in the workshop needs to be cleaned up to ensure a safe working environment.', notes: '车间里的混乱需要清理，以确保安全的工作环境。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N749', word: 'mixture', phonetic: '/ˈmɪkstʃə(r)/', meaning: 'n. 混合物', sentence: 'The mixture of raw materials must be precisely controlled to ensure consistent product quality.', notes: '必须精确控制原材料的混合物，以确保产品质量的一致性。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N750', word: 'occasion', phonetic: '/əˈkeɪʒ(ə)n/', meaning: 'n. 场合', sentence: 'On this occasion, we are launching a new product line to expand our market share.', notes: '在这个场合，我们正推出新的产品线来扩大市场份额。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N751', word: 'needle', phonetic: '/ˈniːd(ə)l/', meaning: 'n. 针', sentence: 'The needle used in the sewing process needs to be replaced frequently to ensure accurate stitching.', notes: '缝纫过程中使用的针需要经常更换，以确保准确的缝合。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N752', word: 'motive', phonetic: '/ˈməʊtɪv/', meaning: 'n. 动机', sentence: 'The motive behind the company\'s investment in new technology is to increase productivity.', notes: '公司投资新技术背后的动机是提高生产力。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N753', word: 'obligation', phonetic: '/ˌɒblɪˈɡeɪʃ(ə)n/', meaning: 'n. 责任 / 义务', sentence: 'The obligation of the manufacturer is to provide safe and reliable products to the market.', notes: '制造商的责任是向市场提供安全可靠的产品。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N754', word: 'operator', phonetic: '/ˈɒpəreɪtə(r)/', meaning: 'n. 操作员', sentence: 'The operator of the machine must follow strict safety procedures to prevent accidents.', notes: '机器操作员必须遵循严格的安全程序以防止事故发生。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N755', word: 'origin', phonetic: '/ˈɒrɪdʒɪn/', meaning: 'n. 来源', sentence: 'The origin of the raw materials is an important factor in determining the quality of the final product.', notes: '原材料的来源是决定最终产品质量的重要因素。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N756', word: 'pattern', phonetic: '/ˈpæt(ə)n/', meaning: 'n. 模式', sentence: 'The pattern of demand for the product is analyzed to optimize production planning.', notes: '分析产品的需求模式以优化生产计划。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N757', word: 'pension', phonetic: '/ˈpenʃ(ə)n/', meaning: 'n. 养老金', sentence: 'The pension plan for employees is an important aspect of the company\'s benefits package.', notes: '员工的养老金计划是公司福利套餐的重要方面。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N758', word: 'platform', phonetic: '/ˈplætfɔːm/', meaning: 'n. 平台', sentence: 'The platform used for manufacturing is designed to meet specific production requirements.', notes: '用于制造的平台设计以满足特定的生产要求。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N759', word: 'population', phonetic: '/ˌpɒpjuˈleɪʃ(ə)n/', meaning: 'n. 人口', sentence: 'The population growth in the region has led to an increase in demand for manufactured goods.', notes: '该地区的人口增长导致对制成品的需求增加。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N760', word: 'possession', phonetic: '/pəˈzeʃ(ə)n/', meaning: 'n. 拥有 / 所有物', sentence: 'The possession of advanced manufacturing technology gives the company a competitive edge.', notes: '拥有先进的制造技术使公司具有竞争优势。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N761', word: 'privacy', phonetic: '/ˈprɪvəsi/', meaning: 'n. 隐私', sentence: 'The privacy of employees\' personal information is protected by the company\'s policies.', notes: '员工个人信息的隐私受到公司政策的保护。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N762', word: 'professional', phonetic: '/prəˈfeʃən(ə)l/', meaning: 'n. 专业人员 adj. 专业的', sentence: 'The professional skills and knowledge of the workers are crucial for the success of the manufacturing operation.', notes: '工人的专业技能和知识对于制造业务的成功至关重要。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N763', word: 'proof', phonetic: '/pruːf/', meaning: 'n. 证明 / 证据', sentence: 'The proof of quality is provided through rigorous testing and inspection procedures.', notes: '通过严格的测试和检验程序提供质量证明。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N764', word: 'prospect', phonetic: '/ˈprɒspekt/', meaning: 'n. 前景 / 展望', sentence: 'The prospect of new business opportunities motivates the company to invest in research and development.', notes: '新业务机会的前景激励公司投资于研发。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N765', word: 'psychology', phonetic: '/saɪˈkɒlədʒi/', meaning: 'n. 心理', sentence: 'The psychology of the consumer plays a role in product design and marketing.', notes: '消费者的心理在产品设计和营销中起作用。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N766', word: 'rehearsal', phonetic: '/rɪˈhɜːs(ə)l/', meaning: 'n. 排练', sentence: 'The rehearsal of the production process helps identify potential problems before production starts.', notes: '生产过程的排练有助于在生产开始前识别潜在问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N767', word: 'release', phonetic: '/rɪˈliːs/', meaning: 'n. 发布 / 放开', sentence: 'The release of the new product is scheduled for next month.', notes: '新产品的发布计划在下个月。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N768', word: 'replacement', phonetic: '/rɪˈpleɪsmənt/', meaning: 'n. 更换', sentence: 'The replacement of worn-out equipment is necessary to maintain production efficiency.', notes: '更换磨损的设备对于维持生产效率是必要的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N769', word: 'scratch', phonetic: '/skrætʃ/', meaning: 'n. 刮痕', sentence: 'The scratch on the surface of the product was caused during shipping.', notes: '产品表面的划痕是在运输过程中造成的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N770', word: 'shelter', phonetic: '/ˈʃeltə(r)/', meaning: 'n. 庇护所 / 住处', sentence: 'The shelter provided for the workers protects them from the elements.', notes: '为工人提供的庇护所保护他们免受恶劣天气的影响。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N771', word: 'trouble shooting', phonetic: '/ˈtrʌbl ˈʃu:tɪŋ/', meaning: '故障排除', sentence: 'The trouble shooting guide helps technicians diagnose and solve problems in the manufacturing process.', notes: '故障排除指南帮助技术人员诊断和解决制造过程中的问题。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N772', word: 'slope', phonetic: '/sləʊp/', meaning: 'n. 斜坡 / 坡度', sentence: 'The slope of the conveyor belt affects the speed and efficiency of the production line.', notes: '传送带的坡度影响生产线的速度和效率。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N773', word: 'spectator', phonetic: '/spekˈteɪtə(r)/', meaning: 'n. 观众', sentence: 'The spectator area allows visitors to observe the manufacturing process.', notes: '在观众区允许访客观察制造过程。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N774', word: 'spread', phonetic: '/spred/', meaning: 'n. 扩散 / 传播', sentence: 'The spread of the virus has had an impact on the global manufacturing industry.', notes: '病毒的传播对全球制造业产生了影响。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N775', word: 'strain', phonetic: '/streɪn/', meaning: 'n. 压力 / 负担', sentence: 'The strain on the supply chain due to the pandemic has caused delays in production.', notes: '由于大流行对供应链造成的压力导致生产延迟。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N776', word: 'substitute', phonetic: '/ˈsʌbstɪtjuːt/', meaning: 'n. 替代物', sentence: 'The substitute material used in the manufacturing process offers similar properties at a lower cost.', notes: '制造过程中使用的替代材料以较低的成本提供类似的性能。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
  { id: 'vocab_N777', word: 'substance', phonetic: '/ˈsʌbstəns/', meaning: 'n. 物质', sentence: 'The substance used in the product is safe and environmentally friendly.', notes: '产品中使用的物质是安全和环保的。', status: 'new', created: 0, reviewCount: 0, lastReviewed: null },
